;
; Answering Machine Detection configuration
;
; Read by app_amd when the dialplan calls AMD() with no arguments. Fonoster only
; runs AMD() on API-originated (outbound) calls, gated on the AMD_ENABLED channel
; variable set at originate time; see [local-ctx-common] in extensions.conf.
;
; Tune these from the AMDCAUSE recorded on the CDR and from the MixMonitor
; recording of the call, not by guesswork.
;
[general]
; Hard cap on the analysis. On expiry the verdict is NOTSURE, which Fonoster
; reports as UNKNOWN. This also bounds how long the caller hears silence before
; the voice application is dispatched, so it is deliberately below the Asterisk
; sample's 5000.
total_analysis_time = 4000

; Average level below which a sample counts as silence, on a scale of 0 to 32767.
silence_threshold = 256

; Greeting ;
; Silence before the greeting. If exceeded, the result is MACHINE.
initial_silence = 2500

; Silence after a greeting. If exceeded, the result is HUMAN.
after_greeting_silence = 800

; Maximum length of a greeting. If exceeded, the result is MACHINE.
greeting = 1500

; Word detection ;
; These match Asterisk's shipped defaults, restated here so every threshold is
; tunable in one place.
min_word_length = 100
maximum_word_length = 5000
between_words_silence = 50

; Deliberately above Asterisk's shipped default of 2. Reaching this count ends
; the analysis as MACHINE, and at 2 a human answering with anything longer than
; "hello there" is misclassified. Calling a live person a machine is the costlier
; error here, so allow a slightly longer greeting.
maximum_number_of_words = 3
