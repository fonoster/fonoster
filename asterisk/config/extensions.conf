[local-ctx-common]
exten => start,1,NoOp(Common handler for local context)
  same => n,GotoIf($["${APP_REF}" != ""]?4)
  same => n,Set(APP_REF=${PJSIP_HEADER(read,X-App-Ref)})
  same => n,GotoIf($["${INGRESS_NUMBER}" != ""]?6)
  same => n,Set(INGRESS_NUMBER=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
  same => n,GotoIf($["${CALL_DIRECTION}" != ""]?8)
  same => n,Set(CALL_DIRECTION=${PJSIP_HEADER(read,X-Call-Direction)})
  same => n,GotoIf($["${CALL_REF}" != ""]?10)
  same => n,Set(CALL_REF=${PJSIP_HEADER(read,X-Call-Ref)})
  same => n,Set(TIMEOUT(absolute)=3600)
  same => n,MixMonitor(${APP_REF}_${UNIQUEID}.wav)
  ; Answering Machine Detection. Inert unless AMD_ENABLED was set at originate
  ; time, which only the apiserver does, and only for outbound calls. Thresholds
  ; come from amd.conf; the verdict lands in AMDSTATUS/AMDCAUSE for Stasis to read.
  ; TryExec, not Exec: a media server without app_amd would otherwise terminate
  ; the extension and hang up the call instead of falling through to Stasis.
  ;
  ; AMD_ENGINE picks the detector: unset/anything but "ml" (the default, set by
  ; nobody today) runs Asterisk's native AMD() as above; "ml" instead runs the
  ; amdanalyser sidecar over AGI. AMD_MODE is a feature flag passed straight
  ; through as the AGI() call's argument (agi_arg_1 on the sidecar side):
  ; unset/anything but "full" (the default) makes amdanalyser behave exactly
  ; like native AMD() — same two variables, same HUMAN/MACHINE/NOTSURE
  ; vocabulary — so apiserver's read of AMDSTATUS/AMDCAUSE never needs to know
  ; which engine or mode ran. "full" additionally sets AMDCONFIDENCE/
  ; AMDDETECTOR/AMDLATENCYMS and reports the classifier's own five-way status.
  same => n,GotoIf($["${AMD_ENABLED}" != "true"]?stasis)
  same => n,GotoIf($["${AMD_ENGINE}" = "ml"]?mlamd)
  same => n,TryExec(AMD())
  same => n,Goto(stasis)
  same => n(mlamd),TryExec(AGI(agi://amdanalyser:4573,${AMD_MODE}))
  same => n(stasis),Stasis(mediacontroller)
  same => n,Hangup()

[local-ctx]
exten => _+X.,1,NoOp(E.164 Number: ${EXTEN})
  same => n,GoSub(local-ctx-common,start,1)
  same => n,Hangup()
exten => _X.,1,NoOp(Non-E.164 Number: ${EXTEN})
  same => n,GoSub(local-ctx-common,start,1)
  same => n,Hangup()
exten => voice,1,NoOp(Directly connecting to the Voice server)
  same => n,GoSub(local-ctx-common,start,1)
  same => n,Hangup()