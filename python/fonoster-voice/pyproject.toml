[project]
name = "fonoster-voice"
version = "0.27.0"
description = "Fonoster Voice SDK for Python: answer calls over the Fonoster session protocol (asyncio)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[project.optional-dependencies]
test = ["pytest>=8", "fonoster-conformance"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fonoster"]
