# yaml-language-server: $schema=https://fonoster.com/schemas/autopilot.json
#
# autopilot.yaml — one file for every Autopilot replica. Copy to
# config/autopilot.yaml (compose mounts it at /opt/fonoster/autopilot.yaml).
#
#   - Everything Autopilot needs is here, secrets included; it reads no
#     environment variables of its own. Treat the file as a secret.
#   - Replicas hold no product policy (storage, retention and billing belong to
#     the API server), so they scale freely.
#   - Unknown or misspelled keys stop Autopilot at boot, naming the key.

server:
  bindAddr: 0.0.0.0:50061
  # Where the public key that verifies call tokens is fetched, over TLS. Use
  # your own API's public TLS address when you run your own API server.
  identityAddress: api.fonoster.com

apiserver:
  endpoint: apiserver:50051                      # loads assistants, reports conversations

logs:
  level: info
  format: json
  transport: console                             # console | fluent

conversation:
  provider: api                                  # api: assistants from the API server
                                                 # file: one local assistant (development)
  # file: ./config/assistant.json

# Speech provider credentials; the same file the API server mounts.
integrationsFile: /opt/fonoster/integrations.json

knowledgeBase:
  enabled: false
  s3:
    # endpoint: https://minio.example.com        # leave out for AWS
    region: us-east-1
    accessKeyId: ""
    secretAccessKey: ""
  unstructured:
    url: https://api.unstructuredapp.io/general/v0/general
    apiKey: ""
  embeddings: {}
    # openaiApiKey: sk-xxxxxxxxxxxxxxxx           # required when knowledgeBase is enabled

# Development only.
# dev:
#   skipIdentity: false
