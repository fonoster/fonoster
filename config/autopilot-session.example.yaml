# The hosted Autopilot (rework-autopilot): an ordinary session app the gateway dials.
#   node mods/autopilot/dist/session/main.js --config config/autopilot-session.yaml
# Keys are named by credentialRef (the provider registry's catalog says which ref a provider
# uses); each ref reads an environment variable of your choosing or an inline value.
host: 0.0.0.0
port: 50061
# The secret the gateway signs Autopilot sessions with (the same for every Autopilot app).
signingSecret: { env: AUTOPILOT_SIGNING_SECRET }
# Apps and their assistants: {apps: {<appRef>: {workspaceRef, assistant}}} (JSON or YAML), or
# the Autopilot apps managed in the dashboard/API (needs `database`):
#   assistants: { source: database, cacheMs: 5000 }
assistants: { file: ./assistants.json }
# The catalog written by the fonoster-registry utility.
registry: { file: ./registry.json }
# Platform keys by credentialRef.
credentials:
  openai-default: { env: OPENAI_API_KEY }
# Workspace Secrets (bring your own key): {<workspaceRef>: {<credentialRef>: key}}, or the
# workspace vendor keys from the dashboard: { source: database } (also `registry: { source: database }`).
# workspaceSecrets: { file: ./workspace-secrets.json }
# The apiserver's database (for any source: database); the key decrypts vendor keys.
# database: { urlEnv: APISERVER_DATABASE_URL }
# encryption: { key: "${CLOAK_ENCRYPTION_KEY}" }
# Endpoint overrides by adapter or provider id.
endpoints:
  ollama: http://ollama:11434
# Knowledge bases (S3 + Unstructured); keys by credentialRef.
# knowledge:
#   s3: { endpoint: http://minio:9000, region: us-east-1, accessKeyIdRef: s3-id, secretAccessKeyRef: s3-secret }
#   unstructured: { url: http://unstructured:8000/general/v0/general, apiKeyRef: unstructured }
#   embeddings: { apiKeyRef: openai-default }
