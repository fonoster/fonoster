# Developer services: run the TypeScript services from source on the host (`npm run
# start:services`, CONTRIBUTING.md) against these containers. Not a deployment: the platform's
# Compose stack is ops/rebuild/compose.yaml (the root compose.yaml includes it).
#
# InfluxDB stays here only while the apiserver's legacy call listing still reads it (the stack
# lists calls from the call-record index and runs no InfluxDB).
services:
  dashboard:
    build:
      context: mods/dashboard
      dockerfile: ./Dockerfile
    ports:
      - 3030:3030
    # The only setting; sign-in methods and the rest come from the API.
    environment:
      - DASHBOARD_API_URL

  # Stand-in for GitHub sign-in (see .scripts/fake-github.mjs). Opt in with
  # `docker compose -f compose.dev.yaml --profile fake-github ...` and point
  # identity.oauth2.github url/apiUrl at http://localhost:3999.
  fake-github:
    image: node:20-alpine
    profiles: [fake-github]
    command: node /opt/fake-github.mjs
    volumes:
      - ./.scripts/fake-github.mjs:/opt/fake-github.mjs:ro
    ports:
      - 3999:3999

  apiserver:
    build:
      context: .
      dockerfile: ./mods/apiserver/Dockerfile
    restart: unless-stopped
    # The API server reads config/fonoster.yaml; .env only resolves ${VAR} references in it.
    env_file: .env
    volumes:
      - ./config/fonoster.yaml:/opt/fonoster/fonoster.yaml:ro
      - ./.keys:/opt/fonoster/keys
    ports:
      - 50051:50051

  autopilot:
    build:
      context: .
      dockerfile: ./mods/autopilot/Dockerfile
    restart: unless-stopped
    volumes:
      - ./config/autopilot-session.yaml:/etc/fonoster/autopilot-session.yaml:ro

  routr:
    image: fonoster/routr-one:2.15.1
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      DATABASE_URL: ${ROUTR_DATABASE_URL}
      EXTERNAL_ADDRS: ${ROUTR_EXTERNAL_ADDRS}
      LOGS_FORMAT: ${ROUTR_LOGS_FORMAT}
      LOGS_LEVEL: ${ROUTR_LOGS_LEVEL}
      LOGS_TRANSPORT: ${ROUTR_LOGS_TRANSPORT}
      NATS_PUBLISHER_ENABLED: true
      # The NATS container's address (the .env value is for host processes).
      NATS_PUBLISHER_URL: nats://nats:4222
      CONSOLE_PUBLISHER_ENABLED: "true"
      RTPENGINE_HOST: ${ROUTR_RTPENGINE_HOST}
      START_INTERNAL_DB: "false"
      CONNECT_VERIFIER_PUBLIC_KEY_PATH: /etc/routr/keys/public.pem
    ports:
      - 51907:51907
      - 51908:51908
      - 5060:5060/udp
      - 5060-5063:5060-5063
    # Add this healthcheck along with the autoheal container as we are having issues with Routr crashing out.
    # We will need a proper fix for this before we can remove this healthcheck.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'printf "REGISTER sip:localhost SIP/2.0\r\nVia: SIP/2.0/UDP 127.0.0.1:5061;branch=z9hG4bKhealth\r\nFrom: <sip:health@localhost>;tag=1234\r\nTo: <sip:health@localhost>\r\nCall-ID: health-$$@localhost\r\nCSeq: 1 REGISTER\r\nMax-Forwards: 70\r\nContent-Type: text/plain\r\nContent-Length: 4\r\n\r\nping" | nc -u -w 1 127.0.0.1 5060 | grep -Eq "^SIP/2.0"'
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - ./etc/log4j2.yaml:/etc/routr/log4j2.yaml
      - ./.keys/public.pem:/etc/routr/keys/public.pem

  # RTPEngine uses a range of ports to handle RTP traffic. Because exposing a large range of ports 
  # is not possible in Docker, we need to use network_mode: host.
  #
  # Unfortunately, network_mode: host is not supported for Windows or Mac.
  # In those cases, we need to use a different approach.
  #
  # By default we are opening a small range of ports (10000-10100) to handle RTP traffic.
  # However, this is not enough for production environments.
  #
  # We recommend that when using Linux you use network_mode: host and remove the ports section.
  rtpengine:
    image: fonoster/rtpengine:0.3.17
    restart: unless-stopped
    platform: linux/x86_64
    ports: 
      - 10000-10100:10000-10100/udp
      - 8080:8080
    environment:
      PORT_MAX: ${RTPENGINE_PORT_MAX}
      PORT_MIN: ${RTPENGINE_PORT_MIN}
      PUBLIC_IP: ${RTPENGINE_PUBLIC_IP}

  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      PGTZ: UTC
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      TZ: UTC
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql/data

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_TOKEN}
      DOCKER_INFLUXDB_INIT_BUCKET: calls
      DOCKER_INFLUXDB_INIT_RETENTION: 720h
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
    ports:
      - 8086:8086
    volumes:
      - influxdb:/var/lib/influxdb2

  nats:
    image: nats:2.11.8
    restart: unless-stopped
    # JetStream on (the gateway's session registry KV).
    command: ["-js"]
    ports:
      - 4222:4222

  envoy:
    image: envoyproxy/envoy:v1.35.0
    restart: unless-stopped
    extra_hosts:
      apiserver: ${DOCKER_HOST_ADDRESS}
    environment:
      - loglevel=debug
    volumes:
      - ./config/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - 8449:8449

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  adminer:
    image: adminer:standalone
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - 8282:8080

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - 8025:8025
      - 1025:1025

volumes:
  db:
  influxdb:
