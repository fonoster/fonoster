services:
  dashboard:
    build:
      context: mods/dashboard
      dockerfile: ./Dockerfile
    ports:
      - 3030:3030
    # The only setting; sign-in methods and the rest come from the API.
    environment:
      - DASHBOARD_API_URL

  # Stand-in for GitHub sign-in (see .scripts/fake-github.mjs). Opt in with
  # `docker compose --profile fake-github ...` and point identity.oauth2.github
  # url/apiUrl at http://localhost:3999.
  fake-github:
    image: node:20-alpine
    profiles: [fake-github]
    command: node /opt/fake-github.mjs
    volumes:
      - ./.scripts/fake-github.mjs:/opt/fake-github.mjs:ro
    ports:
      - 3999:3999

  apiserver:
    build:
      context: .
      dockerfile: ./mods/apiserver/Dockerfile
    volumes:
      - ./.keys:/opt/fonoster/keys
    ports:
      - 50051:50051

  autopilot:
    build:
      context: .
      dockerfile: ./mods/autopilot/Dockerfile
    volumes:
      - ./config/autopilot-session.yaml:/etc/fonoster/autopilot-session.yaml:ro

  routr:
    ports:
      - 51907:51907
      - 51908:51908
      - 5060:5060/udp
      - 5060-5063:5060-5063
    environment:
      # In development this environment variable points to an
      # address not accessible from the container. Therefore, we
      # need to manually point to the NAT's container address here.
      NATS_PUBLISHER_URL: nats://nats:4222
      CONSOLE_PUBLISHER_ENABLED: "true"
    volumes:
      - ./etc/log4j2.yaml:/etc/routr/log4j2.yaml
      - ./.keys/public.pem:/etc/routr/keys/public.pem

  postgres:
    ports:
      - 5432:5432

  influxdb:
    ports:
      - 8086:8086

  envoy:
    extra_hosts:
      apiserver: ${DOCKER_HOST_ADDRESS}
    environment:
      - loglevel=debug

  nats:
    ports:
      - 4222:4222

  adminer:
    image: adminer:standalone
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - 8282:8080

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - 8025:8025
      - 1025:1025