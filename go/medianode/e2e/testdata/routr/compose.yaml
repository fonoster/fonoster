name: rb-medianode
services:
  edgeport:
    image: fonoster/routr-edgeport:latest
    container_name: rb-medianode-edgeport
    ports:
      - 15360:15360
      - 15360:15360/udp
    volumes:
      - ./edgeport.yaml:/etc/routr/edgeport.yaml
  dispatcher:
    image: fonoster/routr-dispatcher:latest
    container_name: rb-medianode-dispatcher
    volumes:
      - ./dispatcher.yaml:/etc/routr/dispatcher.yaml
  location:
    image: fonoster/routr-location:latest
    container_name: rb-medianode-location
    environment:
      LOGS_LEVEL: verbose
    volumes:
      - ./location.yaml:/etc/routr/location.yaml
  connect:
    image: fonoster/routr-connect:latest
    container_name: rb-medianode-connect
    environment:
      LOGS_LEVEL: verbose
      LOCATION_ADDR: location:51902
      API_ADDR: apiserver:51907
  apiserver:
    image: fonoster/routr-simpledata:latest
    container_name: rb-medianode-simpledata
    volumes:
      - ./resources:/etc/routr/resources
