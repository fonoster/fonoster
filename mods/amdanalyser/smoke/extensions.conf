; Minimal dialplan for smoke-testing amdanalyser against a bare Asterisk
; instance, with no other part of the Fonoster stack involved.
[smoke-test]
exten => 7000,1,Answer()
  same => n,Wait(1)
  same => n,AGI(agi://amdanalyser:4573)
  same => n,Verbose(1,AMDSTATUS=${AMDSTATUS} AMDCAUSE=${AMDCAUSE})
  same => n,Hangup()
