syntax = "proto3";

package fonoster.capabilities.v1beta2;

import "google/protobuf/empty.proto";

// What this deployment supports, from fonoster.yaml. Public (no credentials
// needed) so sign-in screens can render from it; it never returns secrets.
service Capabilities {
  // Gets the deployment's capabilities
  rpc GetCapabilities (google.protobuf.Empty) returns (GetCapabilitiesResponse) {}
}

message GitHubCapability {
  string client_id = 1;
  string authorize_url = 2;
}

message AuthCapabilities {
  // Enabled sign-in methods: password | email_code | github
  repeated string methods = 1;
  // Who may create an account: invite | open
  string signup = 2;
  // Set when github is among the methods
  GitHubCapability github = 3;
}

message BillingCapabilities {
  bool enabled = 1;
}

message CostsCapabilities {
  // none | usage | prices
  string display = 1;
}

// Private regions (customer-run regions enrolled through the region hub).
// The local public region always exists and is not reported here.
message RegionsCapabilities {
  // True when the operator configured the region hub and the region-signing
  // key (regions.hub and regions.signingKey), so workspaces can enroll
  // private regions. Never carries hub URLs or keys.
  bool private = 1;
}

// How trunk inbound URIs are checked (features.trunks.inboundUri).
message TrunksCapabilities {
  // "domain": one DNS label under sip.<domain> (the default). "any": any host
  // or IP, for installs whose carriers reach them by address.
  string inbound_uri = 1;
}

message SipEndpoint {
  string host = 1;
  int32 port = 2;
  // udp | tcp | tls | ws | wss
  string transport = 3;
}

message PortRange {
  int32 min = 1;
  int32 max = 2;
}

// Where carriers and softphones reach this deployment: the default public
// region's endpoints (regions.public in fonoster.yaml). Addresses and ports
// only, never credentials. Empty when the operator listed none.
message ConnectionCapabilities {
  repeated SipEndpoint sip = 1;
  repeated string signaling_addresses = 2;
  repeated string media_addresses = 3;
  PortRange rtp_ports = 4;
}

message GetCapabilitiesResponse {
  AuthCapabilities auth = 1;
  BillingCapabilities billing = 2;
  CostsCapabilities costs = 3;
  string domain = 4;
  string app_url = 5;
  RegionsCapabilities regions = 6;
  ConnectionCapabilities connection = 7;
  TrunksCapabilities trunks = 8;
}
