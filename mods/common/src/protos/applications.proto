syntax = "proto3";

package fonoster.applications.v1beta2;

import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

// Applications service definition
service Applications {
  // Create a new application
  rpc CreateApplication(CreateApplicationRequest) returns (CreateApplicationResponse) {}
  // Get an application
  rpc GetApplication(GetApplicationRequest) returns (Application) {}
  // List applications
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {}
  // Update an application
  rpc UpdateApplication(UpdateApplicationRequest) returns (UpdateApplicationResponse) {}
  // Delete an application
  rpc DeleteApplication(DeleteApplicationRequest) returns (DeleteApplicationResponse) {}
  // Evaluate the intelligence for an Autopilot application (server streaming)
  rpc EvaluateIntelligence(EvaluateIntelligenceRequest) returns (stream EvaluateIntelligenceEvent);
  // Create an Ephemeral Agent to perform test calls to an application
  rpc CreateTestToken(google.protobuf.Empty) returns (TestTokenResponse) {}
  // Replace an application's signing secret; the old one stops working at once (no overlap)
  rpc RotateSigningSecret(RotateSigningSecretRequest) returns (RotateSigningSecretResponse) {}
}

// Speech defaults of a session app; voices and models are catalog ids (provider/model-or-voice)
message SpeechDefaults {
  // Default voice, e.g. elevenlabs/rachel
  string voice = 1;
  // Default language (BCP 47), e.g. en-US
  string language = 2;
  // Speech-to-text model, e.g. deepgram/nova-3 (empty: the platform default)
  string stt_model = 3;
  // Text-to-speech model (empty: the voice's default)
  string tts_model = 4;
  // Silence timeout in milliseconds (0: the gateway default)
  int32 silence_timeout_ms = 5;
  // The Pacing policy's patience: low, normal or high (empty: normal)
  string patience = 6;
}

// Caller and agent audio format for the native flavor
message AudioFormat {
  // pcm16 or pcmu
  string codec = 1;
  // Sample rate in Hz: 8000, 16000 or 24000 (pcmu is 8000 only)
  int32 rate = 2;
}

// Answering-machine detection: one amd.result event per call
message AmdSettings {
  // Classify the caller's first seconds of audio
  bool enabled = 1;
  // How much caller audio to classify, in milliseconds (0: 4000; 500 to 15000)
  int32 window_ms = 2;
}

// A listen-only socket dialed for every session of the app
message Listener {
  // ws:// or wss:// address
  string url = 1;
  // inbound, outbound or both
  string tracks = 2;
}

message RotateSigningSecretRequest {
  // The reference to the application
  string ref = 1;
}

message RotateSigningSecretResponse {
  // The reference to the application
  string ref = 1;
  // The new secret; shown only in this response
  string signing_secret = 2;
  // The last characters of the secret
  string signing_secret_hint = 3;
}

// The type of application
enum ApplicationType {
  // Programmable Voice
  EXTERNAL = 0;
  // Internal LLM based applications
  AUTOPILOT = 1;
}

message ProductContainer {
  // Product reference
  string product_ref = 1;
  // Product configuration
  google.protobuf.Struct config = 2;
  // Product credentials
  google.protobuf.Struct credentials = 3;
}

// Application definition
message Application {
  // Reference to the application
  string ref = 1;
  // The application's resource name
  string name = 2;
  // Application type
  ApplicationType type = 3;
  // Endpoint for programmable voice
  string endpoint = 4;
  // Text to speech product
  ProductContainer text_to_speech = 5;
  // Speech to text product
  ProductContainer speech_to_text = 6;
  // Intelligence product
  ProductContainer intelligence = 7;
  // Creation time
  int32 created_at = 8;
  // Update time
  int32 updated_at = 9;
  // Session app: the WebSocket URL the gateway dials
  string url = 10;
  // Session flavor: native or twilio
  string flavor = 11;
  // The last characters of the signing secret (the secret is never returned on reads)
  string signing_secret_hint = 12;
  // Speech defaults
  SpeechDefaults speech = 13;
  // Audio format (native flavor)
  AudioFormat audio = 14;
  // App used when this one cannot be reached
  string fallback_app_ref = 15;
  // Message spoken when neither the app nor its fallback can be reached
  string fallback_message = 16;
  // Listen-only sockets
  repeated Listener listeners = 17;
  // Recording policy: off, on or consent (empty: the workspace's)
  string recording = 18;
  // Answering-machine detection (off when unset)
  AmdSettings amd = 19;
}

// Request to create a new application
message CreateApplicationRequest {
  // Name of the application
  string name = 1;
  // Application type
  ApplicationType type = 2;
  // App URL for programmable voice
  string endpoint = 3;
  // Text to speech product
  ProductContainer text_to_speech = 4;
  // Speech to text product
  ProductContainer speech_to_text = 5;
  // Inference engine
  ProductContainer intelligence = 6;
  // Session app: the WebSocket URL (Autopilot apps default to the hosted Autopilot)
  string url = 7;
  // native or twilio (default native)
  string flavor = 8;
  // Speech defaults
  SpeechDefaults speech = 9;
  // Audio format (native flavor)
  AudioFormat audio = 10;
  // App used when this one cannot be reached
  string fallback_app_ref = 11;
  // Message spoken when neither the app nor its fallback can be reached
  string fallback_message = 12;
  // Listen-only sockets
  repeated Listener listeners = 13;
  // Recording policy: off, on or consent (empty: the workspace's)
  string recording = 14;
  // Answering-machine detection (off when unset)
  AmdSettings amd = 15;
}

// Response for create application
message CreateApplicationResponse {
  // Echo the reference of the application
  string ref = 1;
  // The app's signing secret; shown only in this response
  string signing_secret = 2;
  // The last characters of the secret
  string signing_secret_hint = 3;
}

// Request to get an application
message GetApplicationRequest {
  // The reference to the application
  string ref = 1;
}

// Request to list applications
message ListApplicationsRequest {
  // The number of items to list
  int32 page_size = 1;
  // The page token
  string page_token = 2;
}

// Response for list applications
message ListApplicationsResponse {
  // List of applications
  repeated Application items = 1;
  // The page token
  string next_page_token = 2;
}

// Request to update an application
message UpdateApplicationRequest {
  // Reference to the application
  string ref = 1;
  // Name of the application
  string name = 2;
  // Application type
  ApplicationType type = 3;
  // App URL for programmable voice
  string endpoint = 4;
  // Text to speech product
  ProductContainer text_to_speech = 5;
  // Speech to text product
  ProductContainer speech_to_text = 6;
  // Intelligence product
  ProductContainer intelligence = 7;
  // Session app: the WebSocket URL (Autopilot apps default to the hosted Autopilot)
  string url = 8;
  // native or twilio (default native)
  string flavor = 9;
  // Speech defaults
  SpeechDefaults speech = 10;
  // Audio format (native flavor)
  AudioFormat audio = 11;
  // App used when this one cannot be reached
  string fallback_app_ref = 12;
  // Message spoken when neither the app nor its fallback can be reached
  string fallback_message = 13;
  // Listen-only sockets
  repeated Listener listeners = 14;
  // Recording policy: off, on or consent (empty: the workspace's)
  string recording = 15;
  // Answering-machine detection (off when unset)
  AmdSettings amd = 16;
}

// Response for update application
message UpdateApplicationResponse {
  // Echo the reference of the application
  string ref = 1;
  // A new signing secret when the update generated one (the app stopped being an Autopilot
  // app); shown only in this response. Empty otherwise.
  string signing_secret = 2;
  // The last characters of the new secret (empty when there is none)
  string signing_secret_hint = 3;
}

// Request to delete an application
message DeleteApplicationRequest {
  // The reference to the application
  string ref = 1;
}

// Response for delete application
message DeleteApplicationResponse {
  // Echo the reference of the application
  string ref = 1;
}

// Request to perform an eval for a given Autopilot application
message EvaluateIntelligenceRequest {
  // The intelligence to evaluate
  ProductContainer intelligence = 1;
}

// Expected text comparison type for eval steps
enum ExpectedTextType {
  EXACT = 0;
  SIMILAR = 1;
}

// Tool evaluation report for a single tool call
message ToolEvaluationReport {
  string expected_tool = 1;
  string actual_tool = 2;
  bool passed = 3;
  google.protobuf.Struct expected_parameters = 4;
  google.protobuf.Struct actual_parameters = 5;
  string error_message = 6;
}

// Step evaluation report for a single conversation step
message StepEvaluationReport {
  string human_input = 1;
  string expected_response = 2;
  string ai_response = 3;
  ExpectedTextType evaluation_type = 4;
  bool passed = 5;
  string error_message = 6;
  repeated ToolEvaluationReport tool_evaluations = 7;
}

// Scenario evaluation report (full scenario with all steps)
message ScenarioEvaluationReport {
  string scenario_ref = 1;
  bool overall_passed = 2;
  repeated StepEvaluationReport steps = 3;
}

// Streaming event: one step result for a scenario
message StepEvaluationResult {
  string scenario_ref = 1;
  StepEvaluationReport report = 2;
}

// Streaming event: scenario completed summary
message ScenarioSummary {
  string scenario_ref = 1;
  bool overall_passed = 2;
}

// Streaming event: eval error
message EvalError {
  string message = 1;
}

// Single event in the EvaluateIntelligence server stream
message EvaluateIntelligenceEvent {
  oneof event {
    StepEvaluationResult step_result = 1;
    ScenarioSummary scenario_summary = 2;
    EvalError eval_error = 3;
  }
}

message TestTokenResponse {
  string token = 1;
  string domain = 2;
  string display_name = 3;
  string signaling_server = 4;
  string target_aor = 5;
  string username = 6;
}
