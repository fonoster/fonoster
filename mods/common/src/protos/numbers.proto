syntax = "proto3";

package fonoster.numbers.v1beta2;

// The Numbers service definition
service Numbers {
  // Create a new Number
  rpc CreateNumber (CreateNumberRequest) returns (CreateNumberResponse) {}
  // Update an existing Number
  rpc UpdateNumber (UpdateNumberRequest) returns (UpdateNumberResponse) {}
  // Get an existing Number
  rpc GetNumber (GetNumberRequest) returns (Number) {}
  // Delete an existing Number
  rpc DeleteNumber (DeleteNumberRequest) returns (DeleteNumberResponse) {}
  // List Numbers
  rpc ListNumbers (ListNumbersRequest) returns (ListNumbersResponse) {}
  // Link a Twilio number: provision its Twilio trunk and route it to an agent or application
  rpc LinkTwilio (LinkTwilioRequest) returns (LinkTwilioResponse) {}
  // Link a WhatsApp Business number: its trunk to Meta, its credential and the Number, plus the SIP
  // server hostname to register in WhatsApp Manager. Fonoster calls no Meta API.
  rpc LinkWhatsApp (LinkWhatsAppRequest) returns (LinkWhatsAppResponse) {}
}

// The message for the Number resource
message Number {
  message Trunk {
    // The unique identifier of the Trunk
    string ref = 1;
    // The name of the Trunk
    string name = 2;
  }
  // The unique identifier of the Number
  string ref = 1;
  // The name of the Number
  string name = 2;
  // The tel_url of the Number
  string tel_url = 3;
  // The city of the Number
  string city = 4;
  // The country of the Number
  string country = 5;
  // The country_iso_code of the Number
  string country_iso_code = 6;
  // The date when the Number was created
  int32 created_at = 7;
  // The date when the Number was last updated
  int32 updated_at = 8;
  // The trunk this number is associated with
  Trunk trunk = 9;
  // This dictates how the number will handle incoming calls
  oneof ingress_handler {
    // The call will be forwarded to this agent
    string agent_aor = 10;
    // The call will be forward to this application
    string app_ref = 11;
  }
}

// The request message for Numbers.CreateNumber
message CreateNumberRequest {
  // The name of the Number
  string name = 1;
  // The tel_url of the Number
  string tel_url = 2;
  // The city of the Number
  string city = 3;
  // The country of the Number
  string country = 4;
  // The country_iso_code of the Number
  string country_iso_code = 5;
  // Reference to the trunk this number is associated with
  string trunk_ref = 6;
  // This dictates how the number will handle incoming calls
  oneof ingress_handler {
    // The call will be forwarded to this agent
    string agent_aor = 7;
    // The call will be forward to this application
    string app_ref = 8;
  }
}

// The response message for Numbers.CreateNumber
message CreateNumberResponse {
  // The reference of the Number
  string ref = 1;
}

// The request message for Numbers.UpdateNumber
message UpdateNumberRequest {
  // The unique identifier of the Number
  string ref = 1;
  // The name of the Number
  string name = 2;
  // Reference to the trunk this number is associated with
  string trunk_ref = 3;
  // This dictates how the number will handle incoming calls
  oneof ingress_handler {
    // The call will be forwarded to this agent
    string agent_aor = 4;
    // The call will be forward to this application
    string app_ref = 5;
  }
}

// The response message for Numbers.UpdateNumber
message UpdateNumberResponse {
  // The reference of the Number
  string ref = 1;
}

// The request message for Numbers.GetNumber
message GetNumberRequest {
  // The unique identifier of the Number
  string ref = 1;
}

// The request message for Numbers.DeleteNumber
message DeleteNumberRequest {
  // The unique identifier of the Number
  string ref = 1;
}

// The response message for Numbers.DeleteNumber
message DeleteNumberResponse {
  // The reference of the Number
  string ref = 1;
}

// The request message for Numbers.ListNumbers
message ListNumbersRequest {
  // The maximum number of items in the list
  int32 page_size = 1;
  // The next_page_token value returned from the previous request, if any
  string page_token = 2;
}

// The response message for Numbers.ListNumbers
message ListNumbersResponse {
  // List of Numbers
  repeated Number items = 1;
  // Token to retrieve the next page of results, or empty if there are no more results in the list
  string next_page_token = 2;
}

// Used once for this request; never stored or logged.
message TwilioCredentials {
  // The Twilio Account SID (AC…), always required
  string account_sid = 1;
  // The account's Auth Token; set this …
  string auth_token = 2;
  // … or these two (SK…, a Standard key; Restricted keys can't link)
  string api_key_sid = 3;
  // The API key's secret
  string api_key_secret = 4;
}

// The request message for Numbers.LinkTwilio
message LinkTwilioRequest {
  // The number in E.164; must be in the Twilio account
  string phone_number = 1;
  // The name of the Number; defaults to phone_number
  string name = 2;
  // The Twilio credentials
  TwilioCredentials credentials = 3;
  // This dictates how the number will handle incoming calls
  oneof ingress_handler {
    // The call will be forwarded to this agent
    string agent_aor = 4;
    // The call will be forward to this application
    string app_ref = 5;
  }
}

// The response message for Numbers.LinkTwilio
message LinkTwilioResponse {
  // The Fonoster Number; a number already in the workspace keeps its ref
  string ref = 1;
  // The Fonoster "Twilio Trunk"
  string trunk_ref = 2;
}

// The request message for Numbers.LinkWhatsApp
message LinkWhatsAppRequest {
  // The WhatsApp Business number in E.164. Required without access_token; with one, Meta's
  // record of the number wins and this field is ignored.
  string phone_number = 1;
  // The SIP password Meta issued for the number (GET /<PNID>/settings?include_sip_credentials=true).
  // Optional: empty keeps the current one, or sets a placeholder on a first link. Never logged.
  // Not allowed with access_token: Meta then supplies it.
  string sip_password = 2;
  // The name of the Number; defaults to Meta's verified name, or phone_number
  string name = 3;
  // This dictates how the number will handle incoming calls
  oneof ingress_handler {
    // The call will be forwarded to this agent
    string agent_aor = 4;
    // The call will be forward to this application
    string app_ref = 5;
  }
  // Meta's id of the phone number (WhatsApp Manager > Phone numbers). Required with access_token.
  string phone_number_id = 6;
  // A Meta System User token with whatsapp_business_management. Used once to turn on SIP calling
  // for the number, point it at this install with SDES and read the SIP password; never stored
  // or logged.
  string access_token = 7;
}

// The response message for Numbers.LinkWhatsApp
message LinkWhatsAppResponse {
  // The Fonoster Number; a number already in the workspace keeps its ref
  string ref = 1;
  // The Fonoster trunk for this number, "WhatsApp Trunk <+E.164>"
  string trunk_ref = 2;
  // The SIP server to register in WhatsApp Manager: hostname and port
  string sip_server_hostname = 3;
  int32 sip_server_port = 4;
  // false until a sip_password was given on this or an earlier link, or Meta issued one
  bool sip_password_set = 5;
  // The linked number in E.164 (from Meta when an access_token was given)
  string phone_number = 6;
  // Meta's verified business name for the number; empty without an access_token
  string verified_name = 7;
  // true when this call turned on SIP calling in Meta, pointed at sip_server_hostname with SDES
  bool meta_configured = 8;
}
