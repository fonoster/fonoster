  - { kind: voice, id: deepgram/aura-2-nestor-es, label: "Aura 2 Nestor", models: [deepgram/aura-2], language: es-ES, gender: male, state: active }
  - { kind: voice, id: deepgram/aura-2-orion-en, label: "Aura 2 Orion", models: [deepgram/aura-2], language: en-US, gender: male, state: active }
  - { kind: voice, id: deepgram/aura-2-selena-es, label: "Aura 2 Selena", models: [deepgram/aura-2], language: es-419, gender: female, state: active }
