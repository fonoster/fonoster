# Configuration used by the API server's unit tests (loaded by setupConfig.ts).
domain: fonoster.local
database:
  url: postgresql://postgres:postgres@localhost:5432/fonoster
encryption:
  key: test-encryption-key
mediaService:
  asterisk:
    ariUrl: http://localhost:8088
    ariUsername: ari
    ariPassword: changeme
nats:
  url: nats://localhost:4222
influxdb:
  url: http://localhost:8086
  org: fonoster
  username: influxdb
  password: changeme
  token: test-token
identity:
  # Generated by the root pretest step (npm run generate:keypair); paths are
  # relative to the repo root, where the tests run.
  keys:
    privateKeyPath: config/keys/private.pem
    publicKeyPath: config/keys/public.pem
