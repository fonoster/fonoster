# Static dashboard. 40-fonoster-config.sh writes /config.js and the security
# headers (with the API origin in the CSP) before nginx starts.
server {
  listen 3030;
  listen [::]:3030;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/fonoster/security-headers.conf;

  # Hashed bundles never change.
  location /assets/ {
    include /etc/nginx/fonoster/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Per-deployment settings and the entry page must never be cached.
  location = /config.js {
    include /etc/nginx/fonoster/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  location / {
    include /etc/nginx/fonoster/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
