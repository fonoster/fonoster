format: fonoster.scenario.v1
name: transfer-tool
contract: autopilot
role: gateway
spec: "Built-in hangup and transfer / Transfer tool"
setup:
  assistant:
    conversationSettings:
      { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong.", transferOptions: { phoneNumber: "+15551234567", message: "Transferring you to a person." } }
    languageModel: { model: fake/llm }
  providers:
    llm: { script: [{ tool_calls: [{ name: transfer, arguments: {} }] }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "I want a human.", language: en-US, confidence: 0.9, durationMs: 700 }
  - expect: { type: speak, text: "Transferring you to a person.", last: true }
    capture: { tid: id }
    within_ms: 2000
  - send: { type: output.started, id: "${tid}" }
  - send: { type: output.done, id: "${tid}" }
  - expect: { type: transfer, to: "+15551234567" }
    within_ms: 1000
