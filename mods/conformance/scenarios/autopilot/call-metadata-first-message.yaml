format: fonoster.scenario.v1
name: call-metadata-first-message
contract: autopilot
role: appbridge
spec: "Per-call metadata / The call's first message replaces the agent's"
setup:
  agent:
    conversationSettings: { systemPrompt: "You are a collections agent.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong.", firstMessage: "Hello" }
    languageModel: { model: fake/llm }
  providers:
    llm: { script: [{ content: "Your balance is due on Friday." }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: outbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: { firstMessage: "Hola Ana" }
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Hola Ana" }
    capture: { fid: id }
    within_ms: 2000
  - send: { type: output.started, id: "${fid}" }
  - send: { type: output.done, id: "${fid}" }
  - send: { type: turn.ended, text: "When is it due?", language: en-US, confidence: 0.9, durationMs: 900 }
  - expect: { type: speak, last: true }
    within_ms: 2000
  - assert:
      providers.llm.last_messages: { $includes: [{ role: assistant, content: "Hola Ana" }] }
  - assert:
      providers.llm.last_messages: { $excludes: [{ role: assistant, content: "Hello" }] }
