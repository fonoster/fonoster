format: fonoster.scenario.v1
name: hangup-tool
contract: autopilot
role: appbridge
spec: "Built-in hangup and transfer / Hangup tool"
setup:
  agent:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm: { script: [{ tool_calls: [{ name: hangup, arguments: {} }] }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "That is all, bye.", language: en-US, confidence: 0.9, durationMs: 700 }
  - expect: { type: speak, text: "Goodbye!", last: true }
    capture: { gid: id }
    within_ms: 2000
  - expect_none: { type: hangup }
    for_ms: 100
  - send: { type: output.started, id: "${gid}" }
  - send: { type: output.done, id: "${gid}" }
  - expect: { type: hangup }
    within_ms: 1000
