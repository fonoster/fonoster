format: fonoster.scenario.v1
name: filler-while-thinking
contract: autopilot
role: gateway
spec: "Optional filler while thinking / Filler configured"
setup:
  assistant:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong.", filler: { url: "${media}/tone-2000.wav" } }
    languageModel: { model: fake/llm }
  providers:
    llm: { delayMs: 200, script: [{ content: "We open at nine." }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "What are your hours?", language: en-US, confidence: 0.9, durationMs: 900 }
  - expect: { type: play, url: { $contains: "/tone-2000.wav" }, interruptible: true }
    within_ms: 500
  - expect: { type: speak, text: "We open at nine.", preempt: true }
    within_ms: 2000
