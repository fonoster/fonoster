format: fonoster.scenario.v1
name: call-metadata-in-prompt
contract: autopilot
role: appbridge
spec: "Per-call metadata / Metadata reaches the system prompt"
setup:
  agent:
    conversationSettings: { systemPrompt: "You are a collections agent.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm: { script: [{ content: "Your balance is RD$12,450." }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: outbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: { firstName: Ana, balance: "RD$12,450" }
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "How much do I owe?", language: en-US, confidence: 0.9, durationMs: 900 }
  - expect: { type: speak, last: true }
    within_ms: 2000
  - assert:
      providers.llm.last_messages:
        $includes:
          - role: system
            content: { $contains: "You are a collections agent.\n\n[Additional Parameters (metadata)]\n- firstName: Ana\n- balance: RD$12,450" }
