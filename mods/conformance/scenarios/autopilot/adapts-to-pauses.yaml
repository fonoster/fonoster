format: fonoster.scenario.v1
name: adapts-to-pauses
contract: autopilot
role: appbridge
spec: "Pacing policy / Adapting to a caller who pauses often"
description: >
  An eager agent prepares on every turn.likely_ended; after three resumes in one call it
  stops preparing early (the fourth likely_ended starts no generation).
setup:
  agent:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm: { delayMs: 50 }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.user_started }
  - send: { type: turn.likely_ended, text: "I" }
  - wait: { ms: 100 }
  - send: { type: turn.resumed }
  - send: { type: turn.likely_ended, text: "I want" }
  - wait: { ms: 100 }
  - send: { type: turn.resumed }
  - send: { type: turn.likely_ended, text: "I want to" }
  - wait: { ms: 100 }
  - send: { type: turn.resumed }
  - send: { type: turn.likely_ended, text: "I want to book" }
  - wait: { ms: 200 }
  - assert: { providers.llm.requests: 3 }
