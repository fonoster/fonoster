format: fonoster.scenario.v1
name: patient-waits
contract: autopilot
role: gateway
spec: "Pacing policy / Patient assistant waits for the detector's final event"
setup:
  assistant:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong.", patience: patient }
    languageModel: { model: fake/llm }
  providers:
    llm: { script: [{ content: "Sure." }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.user_started }
  - send: { type: turn.likely_ended, text: "I want to book" }
  - expect_none: { type: speak }
    for_ms: 400
  - assert: { providers.llm.requests: 0 }
  - send: { type: turn.ended, text: "I want to book an appointment", language: en-US, confidence: 0.9, durationMs: 1500 }
  - expect: { type: speak, text: "Sure." }
    within_ms: 2000
