format: fonoster.scenario.v1
name: interrupted-reply
contract: autopilot
role: gateway
spec: "Barge-in stops speech and keeps history honest / Interrupted reply"
setup:
  assistant:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm:
      script:
        - { content: "We open at nine. We close at five." }
        - { content: "On Sunday we are closed." }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "What are your hours?", language: en-US, confidence: 0.9, durationMs: 900 }
  - expect: { type: speak, last: true }
    capture: { rid: id }
    within_ms: 2000
  - send: { type: output.started, id: "${rid}" }
  - send: { type: turn.user_started }
  - expect: { type: clear }
    within_ms: 500
  - send: { type: output.interrupted, id: "${rid}", heardText: "We open at nine.", heardMs: 1200 }
  - send: { type: turn.ended, text: "And on Sunday?", language: en-US, confidence: 0.9, durationMs: 700 }
  - expect: { type: speak, text: "On Sunday we are closed." }
    within_ms: 2000
  - assert:
      providers.llm.last_messages: { $includes: [{ role: assistant, content: "We open at nine." }] }
  - assert:
      providers.llm.last_messages: { $excludes: [{ content: { $contains: five } }] }
