format: fonoster.scenario.v1
name: prepared-reply-discarded
contract: autopilot
role: appbridge
spec: "Replies stream into speech / Prepared reply is discarded on resume"
setup:
  agent:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm:
      script:
        - { content: "PREPARED REPLY." }
        - { content: "We open at nine." }
        - { content: "You are welcome." }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.user_started }
  - send: { type: turn.likely_ended, text: "What are your" }
  - wait: { ms: 100 }
  - send: { type: turn.resumed }
  - expect_none: { type: speak }
    for_ms: 300
  - send: { type: turn.ended, text: "What are your hours?", language: en-US, confidence: 0.9, durationMs: 1500 }
  - expect: { type: speak, last: true }
    capture: { rid: id }
    within_ms: 2000
  - send: { type: output.started, id: "${rid}" }
  - send: { type: output.done, id: "${rid}" }
  - send: { type: turn.ended, text: "Thanks", language: en-US, confidence: 0.9, durationMs: 400 }
  - expect: { type: speak, text: "You are welcome." }
    within_ms: 2000
  - assert:
      providers.llm.last_messages:
        $excludes: [{ content: { $contains: PREPARED } }]
