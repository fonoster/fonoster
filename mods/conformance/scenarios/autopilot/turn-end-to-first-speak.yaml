format: fonoster.scenario.v1
name: turn-end-to-first-speak
contract: autopilot
role: gateway
spec: "Replies stream into speech / First sentence starts before generation ends"
tags: [timing]
description: >
  The latency stopwatch (rework-autopilot task 1.3): from turn.ended to Autopilot's first speak,
  with the fake LLM's 300 ms delay subtracted. One sample; the timing test repeats it and checks
  the p95 of Autopilot's own time.
setup:
  assistant:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm: { delayMs: 300, script: [{ content: "We open at nine. We close at five." }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.user_started }
  - send: { type: turn.ended, text: "What are your hours?", language: en-US, confidence: 0.9, durationMs: 1200 }
  - expect: { type: speak, text: "We open at nine. " }
    label: first-speak
    budget_ms: 150
