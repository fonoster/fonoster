format: fonoster.scenario.v1
name: tool-start-message
contract: autopilot
role: appbridge
spec: "Tools are structured and behind a port / Tool start message"
setup:
  agent:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm, tools: [{ name: getHours, description: "Opening hours", parameters: { type: object, properties: {} }, requestStartMessage: "Let me check.", operation: { method: get, url: "${media}/tool/hours" } }] }
  providers:
    llm:
      script:
        - { tool_calls: [{ name: getHours, arguments: {} }] }
        - { content: "We open at 9." }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "What are your hours?", language: en-US, confidence: 0.9, durationMs: 900 }
  - expect: { type: speak, text: "Let me check.", last: true }
    within_ms: 2000
  - expect: { type: speak, text: "We open at 9." }
    within_ms: 3000
