format: fonoster.scenario.v1
name: new-turn-cancels-reply
contract: autopilot
role: gateway
spec: "Barge-in stops speech and keeps history honest / A new turn cancels an in-flight reply"
setup:
  assistant:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm:
      delayMs: 400
      script:
        - { content: "REPLY TO A." }
        - { content: "Here is the answer to both." }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "Turn A", language: en-US, confidence: 0.9, durationMs: 500 }
  - wait: { ms: 100 }
  - send: { type: turn.ended, text: "Turn B", language: en-US, confidence: 0.9, durationMs: 500 }
  - expect: { type: speak, text: "Here is the answer to both." }
    within_ms: 2000
  - expect_none: { type: speak, text: { $contains: "REPLY TO A" } }
    for_ms: 300
  - assert:
      providers.llm.last_messages: { $includes: [{ role: user, content: Turn A }, { role: user, content: Turn B }] }
  - assert:
      providers.llm.last_messages: { $excludes: [{ content: { $contains: "REPLY TO A" } }] }
