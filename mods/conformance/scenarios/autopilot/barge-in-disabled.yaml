format: fonoster.scenario.v1
name: barge-in-disabled
contract: autopilot
role: gateway
spec: "Barge-in stops speech and keeps history honest / Barge-in disabled"
setup:
  assistant:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong.", allowUserBargeIn: false }
    languageModel: { model: fake/llm }
  providers:
    llm: { script: [{ content: "We open at nine." }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "What are your hours?", language: en-US, confidence: 0.9, durationMs: 900 }
  - expect: { type: speak, interruptible: false, last: true }
    capture: { rid: id }
    within_ms: 2000
  - send: { type: output.started, id: "${rid}" }
  - send: { type: turn.user_started }
  - expect_none: { type: clear }
    for_ms: 300
