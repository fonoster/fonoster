format: fonoster.scenario.v1
name: complete-turn-trace
contract: autopilot
role: gateway
spec: "Conversation events in the call record / Complete turn trace"
setup:
  assistant:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm: { script: [{ content: "We open at nine." }, { content: "On Sunday we are closed. Sorry." }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "What are your hours?", language: en-US, confidence: 0.9, durationMs: 900 }
  - expect: { type: speak, last: true }
    capture: { r1: id }
    within_ms: 2000
  - send: { type: output.started, id: "${r1}" }
  - send: { type: output.done, id: "${r1}" }
  - expect:
      type: record.note
      data: { kind: autopilot.turn, userText: "What are your hours?", heardText: "We open at nine.", interrupted: false, firstTokenMs: { $gte: 0 } }
    within_ms: 1000
  - send: { type: turn.ended, text: "And on Sunday?", language: en-US, confidence: 0.9, durationMs: 700 }
  - expect: { type: speak, text: "On Sunday we are closed. " }
    capture: { r2: id }
    within_ms: 2000
  - send: { type: output.started, id: "${r2}" }
  - send: { type: output.interrupted, id: "${r2}", heardText: "On Sunday", heardMs: 500 }
  - expect:
      type: record.note
      data: { kind: autopilot.turn, userText: "And on Sunday?", heardText: "On Sunday", interrupted: true }
    within_ms: 1000
