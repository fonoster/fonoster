format: fonoster.scenario.v1
name: max-duration
contract: autopilot
role: appbridge
spec: "Session limits / Maximum duration"
setup:
  agent:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong.", maxSessionDuration: 500 }
    languageModel: { model: fake/llm }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Goodbye!" }
    capture: { gid: id }
    within_ms: 1500
  - send: { type: output.started, id: "${gid}" }
  - send: { type: output.done, id: "${gid}" }
  - expect: { type: hangup }
    within_ms: 1000
