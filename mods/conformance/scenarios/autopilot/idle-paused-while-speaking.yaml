format: fonoster.scenario.v1
name: idle-paused-while-speaking
contract: autopilot
role: appbridge
spec: "Idle handling / Idle clock paused while speaking"
setup:
  agent:
    conversationSettings:
      { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong.", firstMessage: "Welcome to the clinic.", idleOptions: { message: "Are you still there?", timeout: 300, maxTimeoutCount: 3 } }
    languageModel: { model: fake/llm }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Welcome to the clinic." }
    capture: { fid: id }
  - send: { type: output.started, id: "${fid}" }
  - expect_none: { type: speak, text: "Are you still there?" }
    for_ms: 700
  - send: { type: output.done, id: "${fid}" }
    label: done
  - expect: { type: speak, text: "Are you still there?" }
    from: done
    not_before_ms: 250
    within_ms: 800
