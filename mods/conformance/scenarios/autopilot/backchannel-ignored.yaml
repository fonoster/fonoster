format: fonoster.scenario.v1
name: backchannel-ignored
contract: autopilot
role: appbridge
spec: "Autopilot reacts to turn events and never detects turns itself / Backchannel is ignored"
setup:
  agent:
    conversationSettings: { systemPrompt: "You are the receptionist of a dental clinic.", goodbyeMessage: "Goodbye!", systemErrorMessage: "Sorry, something went wrong." }
    languageModel: { model: fake/llm }
  providers:
    llm: { script: [{ content: "We open at nine and close at five every weekday." }] }
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.ended, text: "Hours?", language: en-US, confidence: 0.9, durationMs: 500 }
  - expect: { type: speak, last: true }
    capture: { rid: id }
    within_ms: 2000
  - send: { type: output.started, id: "${rid}" }
  - send: { type: turn.backchannel, text: "uh-huh" }
  - expect_none: { type: clear }
    for_ms: 300
