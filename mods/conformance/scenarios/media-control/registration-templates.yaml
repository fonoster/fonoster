format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: registration-templates
spec: "Registration is optional and configured / Count sent on registration"
description: "The fake registrar challenges with digest and the node answers with its auth; X-Session-Count renders the room count, and a change past reregisterDelta re-registers at once."
setup:
  roomr:
    registrar: { username: roomr, password: reg-secret-55 }
    config:
      reregisterDelta: 1
      registrations:
        [
          {
            expires: 30s,
            headers: { X-Session-Count: "{sessions}" },
            auth: { username: roomr, password: reg-secret-55 }
          }
        ]
steps:
  - expect: { type: registration.state, state: registered }
    within_ms: 3000
  - assert:
      registrar.registers:
        {
          $includes:
            [{ challenged: true }, { headers: { X-Session-Count: "0" } }]
        }
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - wait: { ms: 500 }
  - assert:
      registrar.registers:
        { $includes: [{ headers: { X-Session-Count: "1" } }] }
      secrets.leaked: false
