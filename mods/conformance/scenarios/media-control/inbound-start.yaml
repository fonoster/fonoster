format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: inbound-start
spec: "Inbound calls become rooms / Inbound call reported with its headers"
description: "Start is first and carries every INVITE header untouched; 180 at once, 200 only after the app's Answer (it answers after 1 s here); a generated call_ref and room_ref carry 128 random bits."
setup:
  roomr: { app: { mode: stall } }
steps:
  - caller:
      {
        call: { to: "+15550001", appRef: app-1, headers: { X-Anything: "42" } }
      }
  - expect:
      type: stream.start
      direction: INBOUND
      call_ref: { $re: "^call-[0-9a-f]{32}$" }
      to: { $contains: "+15550001" }
      headers: { X-App-Ref: app-1, X-Anything: "42" }
      room_ref: { $re: "^room-[0-9a-f]{32}$" }
      node_ref: { $re: ".+" }
      media: { ip: { $re: ".+" }, port: { $gt: 0 }, codec: "L16/16000" }
    within_ms: 2000
    capture: { call: call_ref }
  - assert:
      caller.sip: [180]
  - wait: { ms: 1000 }
  - assert:
      caller.sip: [180]
  - app: { answer: true }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 2000
  - assert:
      caller.sip: [180, 200]
  - expect:
      { type: call.started, call_ref: "${call}", direction: inbound, seq: 1 }
    within_ms: 1000
  - expect: { type: call.ringing, call_ref: "${call}", seq: 2 }
    within_ms: 1000
  - expect: { type: call.answered, call_ref: "${call}", seq: 3 }
    within_ms: 1000
