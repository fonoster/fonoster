format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: max-duration
spec: "Calls can carry a lower maximum duration / App limit applied"
description: "Answer's max_duration_s (1 s) and CreateCall's lower the node's maximum duration for their call."
setup:
  roomr: { app: { max_duration_s: 1 } }
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - expect: { type: stream.ended, cause: max_duration }
    within_ms: 3000
  - rpc:
      method: CreateCall
      request:
        {
          call_ref: m1,
          to: { uri: "sip:+15551234567@carrier.invalid", proxy: "${trunk}" },
          max_duration_s: 1
        }
  - expect: { type: call.ended, call_ref: m1, cause: max_duration }
    within_ms: 4000
