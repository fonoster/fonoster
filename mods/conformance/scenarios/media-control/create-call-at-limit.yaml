format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: create-call-at-limit
spec: "CreateCall dials out on the node the controller chose / Node at its limit"
description: "At maxRooms: RESOURCE_EXHAUSTED before any INVITE, and 503 for an inbound INVITE."
setup:
  roomr: { config: { maxRooms: 1, heartbeatInterval: 200ms } }
steps:
  - rpc:
      method: CreateRoom
      request: { room_ref: r1 }
      reply: { room_ref: r1 }
  - rpc:
      method: CreateCall
      request:
        {
          call_ref: l1,
          to: { uri: "sip:+15551234567@carrier.invalid", proxy: "${trunk}" }
        }
      error: { code: RESOURCE_EXHAUSTED, reason: at_capacity }
  - assert:
      trunk.invites: []
  - expect: { type: node.heartbeat, rooms: 1, max_rooms: 1 }
    within_ms: 1500
  - caller: { call: { appRef: app-1 } }
  - wait: { ms: 500 }
  - assert:
      caller.sip: [503]
