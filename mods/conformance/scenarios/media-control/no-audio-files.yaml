format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: no-audio-files
spec: "The node never records and captures no SIP / The node writes no audio"
description: "A call with a recording listener: the node (started in an empty directory that is also its TMPDIR) writes no file."
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - rpc:
      method: AddParticipant
      request:
        {
          room_ref: "${room}",
          listen:
            [{ track_id: 1, rtp: "${rtp_a}" }, { track_id: 2, rtp: "${rtp_b}" }]
        }
  - caller: { audio: { kind: tone, ms: 1000 } }
  - wait: { ms: 1200 }
  - caller: { hangup: true }
  - expect: { type: call.ended, cause: caller_hangup }
    within_ms: 2000
  - assert:
      node.files: []
