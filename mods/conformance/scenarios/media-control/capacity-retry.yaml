format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: capacity-retry
spec: "Roomr node suite / Capacity path exercised"
description: "The fake controller tries the full node first: it refuses with RESOURCE_EXHAUSTED and sends no INVITE, and the call lands on the other node."
setup:
  roomr: { nodes: 2, node_config: [{ maxRooms: 1 }, {}] }
steps:
  - rpc:
      method: CreateRoom
      node: 0
      request: { room_ref: full }
      reply: { room_ref: full }
  - rpc:
      method: place
      order: [0, 1]
      request:
        {
          call_ref: p1,
          to: { uri: "sip:+15551234567@carrier.invalid", proxy: "${trunk}" },
          metadata: { app_ref: app-1 }
        }
      reply: { call_ref: p1, state: RINGING }
  - assert:
      controller.attempts:
        [{ node: 0, code: RESOURCE_EXHAUSTED }, { node: 1, code: OK }]
  - expect: { type: call.answered, call_ref: p1 }
    within_ms: 3000
  - assert:
      trunk.invites: [{ requestUri: { $contains: "+15551234567" } }]
