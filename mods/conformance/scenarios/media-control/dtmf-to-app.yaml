format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: dtmf-to-app
spec: "Each call opens one control stream to the session endpoint / Start is first"
description: "The caller's keypress reaches the app as Dtmf on the call's control stream."
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - caller: { dtmf: "5" }
  - expect: { type: stream.dtmf, digit: "5", source: rfc4733 }
    within_ms: 2000
