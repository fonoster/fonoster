format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: refer-transfer
spec: "Transfer modes / Refer transfer"
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - app:
      {
        send:
          {
            transfer: { to: { uri: "sip:+15551234567@127.0.0.1" }, mode: refer }
          }
      }
  - expect: { type: stream.transfer_result, status: referred }
    within_ms: 3000
  - expect: { type: stream.ended, cause: removed }
    within_ms: 2000
  - expect: { type: room.ended, room_ref: "${room}" }
    within_ms: 2000
  - assert:
      trunk.refers: { $includes: [{ $contains: "+15551234567" }] }
