format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: cancel-while-ringing
spec: "CreateCall dials out on the node the controller chose / Cancel while ringing"
description: "EndCall on a ringing call sends CANCEL and ends it with removed, with no room and no stream; an unknown call is NOT_FOUND."
setup:
  roomr: { trunk: { mode: no_answer } }
steps:
  - rpc:
      method: CreateCall
      request:
        {
          call_ref: c1,
          to: { uri: "sip:+15551234567@carrier.invalid", proxy: "${trunk}" }
        }
      reply: { state: RINGING }
  - wait: { ms: 300 }
  - rpc:
      method: EndCall
      request: { call_ref: c1 }
  - expect: { type: call.ended, call_ref: c1, cause: removed, answered: false }
    within_ms: 2000
  - expect_none: { type: stream.start }
    for_ms: 300
  - rpc:
      method: EndCall
      request: { call_ref: nope }
      error: { code: NOT_FOUND, reason: call_not_found }
