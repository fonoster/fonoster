format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: warm-transfer-not-answered
spec: "Warm transfer keeps the caller on hold / Warm transfer not answered"
description: "The transfer's ring_timeout_s (3 s) stands in for the 30 s limit."
setup:
  roomr: { trunk: { mode: no_answer } }
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - app:
      {
        send:
          {
            transfer:
              {
                to: { uri: "sip:+15551234567@127.0.0.1", proxy: "${trunk}" },
                mode: warm,
                ring_timeout_s: 3
              }
          }
      }
  - wait: { ms: 200 }
  - assert:
      media.held: true
  - expect: { type: stream.transfer_result, status: failed, cause: no_answer }
    within_ms: 4000
  - assert:
      media.held: false
