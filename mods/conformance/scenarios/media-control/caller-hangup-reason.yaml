format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: caller-hangup-reason
spec: "Endings carry a reason / Caller hangs up"
description: "The configured call-ref header (X-Call-Ref) names the call end to end; the caller's BYE is caller_hangup on the stream and on NATS."
steps:
  - caller: { call: { to: "+15550001", appRef: app-1, callRef: call-9 } }
  - expect: { type: stream.start, call_ref: call-9 }
    within_ms: 2000
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 2000
  - caller: { hangup: true }
  - expect: { type: stream.ended, cause: caller_hangup }
    within_ms: 2000
  - expect: { type: stream.closed }
    within_ms: 1000
  - expect:
      {
        type: call.ended,
        call_ref: call-9,
        cause: caller_hangup,
        answered: true
      }
    within_ms: 2000
  - expect: { type: room.ended, cause: caller_hangup }
    within_ms: 2000
