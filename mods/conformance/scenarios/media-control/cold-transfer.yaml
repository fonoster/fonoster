format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: cold-transfer
spec: "Transfer modes / Cold transfer"
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - app:
      {
        send:
          {
            transfer:
              {
                to: { uri: "sip:+15551234567@127.0.0.1", proxy: "${trunk}" },
                mode: cold
              }
          }
      }
  - expect: { type: stream.participant_joined, track_id: 3 }
    within_ms: 3000
  - expect:
      {
        type: stream.participant_left,
        participant_ref: "${app_leg}",
        cause: removed
      }
    within_ms: 2000
  - expect: { type: stream.transfer_result, status: completed }
    within_ms: 2000
  - assert:
      trunk.invites:
        { $includes: [{ requestUri: { $contains: "+15551234567" } }] }
  - caller: { audio: { kind: tone, ms: 800 } }
    label: spoke
  - wait: { ms: 1100 }
  - assert:
      trunk.heard_ms: { $gte: 300 }
    from: spoke
