format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: drain-health
spec: "Draining is a health signal with a bounded wait / Health fails on SIGTERM"
description: "On SIGTERM: health NOT_SERVING, REGISTER Expires 0, node.down and no more heartbeats, while the live call keeps running."
setup:
  roomr:
    config:
      drainWait: 3s
      heartbeatInterval: 200ms
      registrations:
        [{ expires: 30s, headers: { X-Session-Count: "{sessions}" } }]
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - assert:
      node.health: SERVING
  - node: { sigterm: true }
  - expect: { type: node.down }
    within_ms: 1000
  - wait: { ms: 300 }
    label: draining
  - assert:
      node.health: NOT_SERVING
      registrar.registers: { $includes: [{ expires: "0" }] }
      caller.state: answered
  - wait: { ms: 600 }
  - assert:
      heartbeats: 0
    from: draining
