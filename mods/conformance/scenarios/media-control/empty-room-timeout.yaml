format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: empty-room-timeout
spec: "Rooms without an owner end / Per-room timeout"
description: "A room nothing joined ends with node_error after the node's emptyRoomTimeout (1 s here) or its own empty_room_timeout_s (2 s); a longer per-room timeout keeps it."
setup:
  roomr: { config: { emptyRoomTimeout: 1s } }
steps:
  - rpc:
      method: CreateRoom
      request: { room_ref: idle, empty_room_timeout_s: 2 }
  - rpc:
      method: CreateRoom
      request: { room_ref: idle-default }
  - rpc:
      method: CreateRoom
      request: { room_ref: emptied, empty_room_timeout_s: 30 }
  - expect: { type: room.ended, room_ref: idle-default, cause: node_error }
    within_ms: 2000
  - expect: { type: room.ended, room_ref: idle, cause: node_error }
    not_before_ms: 300
    within_ms: 2500
  - expect_none: { type: room.ended, room_ref: emptied }
    for_ms: 300
