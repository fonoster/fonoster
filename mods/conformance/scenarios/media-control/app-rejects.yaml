format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: app-rejects
spec: "Inbound calls become rooms / App rejects"
setup:
  roomr: { app: { mode: reject, sip_status: 404 } }
steps:
  - caller: { call: { appRef: app-1 } }
  - expect: { type: stream.start }
    within_ms: 2000
    capture: { call: call_ref }
  - expect:
      {
        type: call.ended,
        call_ref: "${call}",
        cause: rejected,
        sip_status: 404,
        answered: false
      }
    within_ms: 2000
  - expect: { type: stream.closed }
    within_ms: 2000
  - assert:
      caller.sip: [180, 404]
