format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: session-endpoint-unreachable
spec: "Inbound calls become rooms / Session endpoint unreachable"
setup:
  roomr: { app: { mode: down } }
steps:
  - caller: { call: { appRef: app-1 } }
  - expect:
      { type: call.ended, cause: app_gone, sip_status: 503, answered: false }
    within_ms: 5000
  - assert:
      caller.sip: [180, 503]
      app.streams: 0
