format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: header-crlf-refused
spec: "Inbound calls become rooms / CR or LF in a header value"
steps:
  - rpc:
      method: CreateCall
      request:
        {
          call_ref: x1,
          to:
            {
              uri: "sip:+15551234567@carrier.invalid",
              proxy: "${trunk}",
              headers: { X-Bad: "a\r\nInjected: 1" }
            }
        }
      error: { code: INVALID_ARGUMENT }
  - assert:
      trunk.invites: []
