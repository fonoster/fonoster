format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: dialed-party-busy
spec: "Endings carry a reason / Dialed party busy"
setup:
  media: { dialOutcome: busy }
steps:
  - send: { type: room.create, id: c1 }
  - expect: { type: ack, id: c1 }
    within_ms: 2000
    capture: { room: roomRef }
  - send: { type: participant.dial, id: d1, roomRef: "${room}", to: "+15551234567" }
  - expect: { type: call.progress, id: d1, status: ringing }
    within_ms: 1000
  - expect: { type: call.progress, id: d1, status: busy, sipStatus: 486 }
    within_ms: 1000
