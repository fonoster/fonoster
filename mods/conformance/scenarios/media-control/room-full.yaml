format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: room-full
spec: "Call and room limits / Per-room participant limit"
description: "CreateRoom's max_participants overrides the node's maxParticipants (1 here), which applies to rooms that set none."
setup:
  roomr: { config: { maxParticipants: 1 } }
steps:
  - rpc:
      method: CreateRoom
      request: { room_ref: small, max_participants: 2 }
  - rpc:
      method: AddParticipant
      request: { room_ref: small, rtp: "${rtp_a}" }
  - rpc:
      method: AddParticipant
      request: { room_ref: small, rtp: "${rtp_b}" }
  - rpc:
      method: AddParticipant
      request: { room_ref: small, rtp: "${rtp_c}" }
      error: { code: RESOURCE_EXHAUSTED, reason: room_full }
  - rpc:
      method: CreateRoom
      request: { room_ref: default }
  - rpc:
      method: AddParticipant
      request: { room_ref: default, rtp: "${rtp_d}" }
  - rpc:
      method: AddParticipant
      request: { room_ref: default, rtp: "${rtp_c}" }
      error: { code: RESOURCE_EXHAUSTED, reason: room_full }
