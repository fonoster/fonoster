format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: dial-into-room
spec: "Add a participant is the one primitive / Dial into an existing room"
steps:
  - caller: { call: { to: "+15550001", appRef: app-1, callRef: call-9 } }
  - expect: { type: call.incoming, appRef: app-1, callRef: call-9, to: "+15550001", direction: inbound }
    within_ms: 1000
    capture: { room: roomRef, caller: participantRef }
  - send: { type: participant.dial, id: d1, roomRef: "${room}", to: "+15551234567" }
  - expect: { type: call.progress, id: d1, status: ringing }
    within_ms: 1000
  - expect: { type: participant.joined, id: d1 }
    within_ms: 1000
