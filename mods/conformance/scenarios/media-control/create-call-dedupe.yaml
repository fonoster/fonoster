format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: create-call-dedupe
spec: "CreateCall dials out on the node the controller chose / Retry is safe"
description: "A repeated call_ref returns the existing Call (ended ones too) with no second INVITE; other parameters are ALREADY_EXISTS."
steps:
  - rpc:
      method: CreateCall
      request:
        {
          call_ref: r1,
          to: { uri: "sip:+15551234567@carrier.invalid", proxy: "${trunk}" }
        }
      reply: { call_ref: r1, state: RINGING }
    capture: { room: room_ref }
  - rpc:
      method: CreateCall
      request:
        {
          call_ref: r1,
          to: { uri: "sip:+15551234567@carrier.invalid", proxy: "${trunk}" }
        }
      reply: { call_ref: r1, room_ref: "${room}" }
  - expect: { type: call.answered, call_ref: r1 }
    within_ms: 3000
  - rpc:
      method: CreateCall
      request:
        {
          call_ref: r1,
          to: { uri: "sip:+15559999999@carrier.invalid", proxy: "${trunk}" }
        }
      error: { code: ALREADY_EXISTS, reason: call_exists }
  - rpc:
      method: EndCall
      request: { call_ref: r1 }
  - expect: { type: call.ended, call_ref: r1, cause: removed }
    within_ms: 2000
  - rpc:
      method: CreateCall
      request:
        {
          call_ref: r1,
          to: { uri: "sip:+15551234567@carrier.invalid", proxy: "${trunk}" }
        }
      reply: { call_ref: r1, state: ENDED }
  - assert:
      trunk.invites: [{ requestUri: { $contains: "+15551234567" } }]
