format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: hold-with-music
spec: "Hold silences the app and plays hold audio / Hold with music"
description: "Observed on the node: while held, the app's leg hears none of the caller's speech and the caller hears the hold music (served by the harness); Resume restores both directions."
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - assert:
      media.held: false
  - app: { send: { hold: { music: "${media}/hold.wav" } } }
  - wait: { ms: 300 }
  - assert:
      media.held: true
      media.hold_audio_ms: { $gte: 200 }
  - app: { send: { resume: {} } }
  - wait: { ms: 100 }
  - assert:
      media.held: false
