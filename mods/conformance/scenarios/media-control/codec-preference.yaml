format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: codec-preference
spec: "Supported codecs / Opus preferred when the peer accepts it"
description: "A caller offering PCMU and Opus gets Opus; an offer with no common codec gets 488. Needs a node built with libopus."
steps:
  - caller: { call: { appRef: app-1, codecs: ["PCMU/8000", "opus/48000"] } }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
  - assert:
      caller.codec: { $re: "^[oO][pP][uU][sS]" }
  - caller: { call: { name: gsm, appRef: app-1, codecs: ["GSM/8000"] } }
  - wait: { ms: 500 }
  - assert:
      caller.gsm.sip: [488]
