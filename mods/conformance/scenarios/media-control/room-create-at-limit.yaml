format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: room-create-at-limit
spec: "Nodes report liveness / Heartbeats report the room limit"
description: A node at its room limit refuses room.create with at_capacity and heartbeats its limit.
setup:
  media: { maxRooms: 1, heartbeatMs: 200 }
steps:
  - send: { type: room.create, id: c1 }
  - expect: { type: ack, id: c1, roomRef: { $re: ".+" } }
    within_ms: 2000
  - send: { type: room.create, id: c2 }
  - expect: { type: error, id: c2, code: at_capacity }
    within_ms: 2000
  - expect: { type: node.heartbeat, rooms: 1, maxRooms: 1 }
    within_ms: 1000
