format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: node-killed
spec: "A crashed node's calls end cleanly / Node killed mid-call"
description: "The app's control stream closes (within keepalive) and no heartbeat follows the kill (controllers stop placing on it)."
setup:
  roomr: { config: { heartbeatInterval: 200ms } }
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - node: { kill: true }
  - expect: { type: stream.closed }
    within_ms: 30000
  - wait: { ms: 300 }
    label: dead
  - wait: { ms: 1000 }
  - assert:
      heartbeats: 0
    from: dead
