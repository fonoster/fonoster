format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: drain-max-wait
spec: "Draining is a health signal with a bounded wait / Maximum wait reached"
description: "A short drainWait ends the remaining room with node_error, sent as Ended before the stream closes, and the node exits."
setup:
  roomr: { config: { drainWait: 1s } }
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - node: { sigterm: true }
  - expect: { type: stream.ended, cause: node_error }
    within_ms: 3000
  - expect: { type: stream.closed }
    within_ms: 2000
  - wait: { ms: 1000 }
  - assert:
      node.alive: false
