format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: caller-stops-rtp
spec: "A silent leg ends the call / Caller stops sending audio"
setup:
  roomr: { config: { mediaTimeout: 1s } }
steps:
  - caller: { call: { to: "+15550001", appRef: app-1 } }
  - expect: { type: stream.start, direction: INBOUND }
    within_ms: 3000
    capture: { room: room_ref, call: call_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
    capture: { app_leg: participant_ref }
  - caller: { mute: true }
  - expect: { type: call.ended, cause: media_timeout }
    within_ms: 3000
  - expect: { type: stream.ended, cause: media_timeout }
    within_ms: 1000
