format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: caller-cancels-before-answer
spec: "Each call opens one control stream to the session endpoint / Caller cancels before Answer"
setup:
  roomr: { app: { mode: stall } }
steps:
  - caller: { call: { appRef: app-1 } }
  - expect: { type: stream.start }
    within_ms: 2000
  - caller: { hangup: true }
  - expect: { type: stream.ended, cause: caller_hangup }
    within_ms: 2000
  - expect: { type: stream.closed }
    within_ms: 1000
  - expect: { type: call.ended, cause: caller_hangup, answered: false }
    within_ms: 1000
