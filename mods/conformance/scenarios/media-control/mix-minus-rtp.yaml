format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: mix-minus-rtp
spec: "Rooms mix audio for their participants / Mix-minus with three participants"
description: "A SIP caller and two RTP participants share a room; the caller and B each play a tone: C hears both, the caller hears only B, B hears only the caller (mix-minus across SIP and RTP)."
steps:
  - caller: { call: { name: sip, appRef: app-1 } }
  - expect: { type: stream.start }
    within_ms: 3000
    capture: { room: room_ref }
  - expect: { type: stream.participant_joined, track_id: 2 }
    within_ms: 3000
  - rpc:
      method: AddParticipant
      request: { room_ref: "${room}", rtp: "${rtp_b}" }
  - rpc:
      method: AddParticipant
      request: { room_ref: "${room}", rtp: "${rtp_c}" }
  - caller: { name: sip, audio: { kind: tone, hz: 440, ms: 1800 } }
  - rtp: { name: b, audio: { kind: tone, hz: 1000, ms: 1800 } }
    label: playing
  - wait: { ms: 1200 }
  - assert:
      mix: { sip: [b], b: [sip], c: [b, sip] }
    from: playing
