format: fonoster.scenario.v1
contract: media-control
role: media-control-client
name: ring-then-answer
spec: "Ringing before answer / Caller hears ringing while the app is unreachable"
steps:
  - caller: { call: { to: "+15550001", appRef: app-1, callRef: call-9 } }
  - expect: { type: call.incoming, appRef: app-1, callRef: call-9, to: "+15550001", direction: inbound }
    within_ms: 1000
    capture: { room: roomRef, caller: participantRef }
  - send: { type: ring, id: r1, roomRef: "${room}", participantRef: "${caller}" }
  - expect: { type: ack, id: r1 }
    within_ms: 2000
  - assert:
      media.sip: [180]
  - send: { type: answer, id: a1, roomRef: "${room}", participantRef: "${caller}" }
  - expect: { type: ack, id: a1 }
    within_ms: 2000
  - assert:
      media.sip: [180, 200]
