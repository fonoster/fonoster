format: fonoster.scenario.v1
name: unknown-event-ignored
contract: twilio-media-streams-flavor
role: app
spec: "Twilio protocol scope / Unknown event from a Twilio-protocol stream"
setup:
  app: { protocol: twilio }
ignore: [media]
steps:
  - expect: { event: start }
    capture: { sid: streamSid }
  - send: { event: transfer, streamSid: "${sid}" }
  - expect_none: { event: stop }
    for_ms: 500
