format: fonoster.scenario.v1
name: noise-then-silence
contract: turn-taking
role: app
spec: "Turns that never end are abandoned / Noise then silence"
tags: [slow]
steps:
  - expect: { type: session.start }
  - send: { type: listen.update }
  - caller: { audio: { kind: tone, ms: 400 } }
  - expect: { type: turn.user_started }
    within_ms: 1000
  - expect_none: { type: turn.ended }
    for_ms: 9000
  - expect: { type: turn.ended, text: "", abandoned: true }
    within_ms: 2500
