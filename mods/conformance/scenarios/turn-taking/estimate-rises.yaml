format: fonoster.scenario.v1
name: estimate-rises
contract: turn-taking
role: app
spec: "The Detector publishes a continuous end-of-thought estimate / The estimate rises as a thought completes"
setup:
  providers:
    stt: { script: [{ atMs: 500, text: "I want to pay my bill" }] }
steps:
  - expect: { type: session.start }
  - send: { type: subscribe, events: [turn.estimate] }
  - caller: { audio: { kind: tone, ms: 600 } }
  - expect: { type: turn.estimate, speaking: true, eot: 0 }
    within_ms: 1000
  - expect: { type: turn.estimate, speaking: false, eot: { $lt: 0.6 } }
    within_ms: 2000
  - expect: { type: turn.estimate, speaking: false, eot: { $gte: 0.8 } }
    within_ms: 1000
