format: fonoster.scenario.v1
name: say-hello
contract: voice-sdk
role: appbridge
fixture: say-hello
spec: "say speaks text and reports what was heard / Fully heard"
description: >
  The fixture says "Hello from the SDK." and hangs up once it has been heard.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, id: "*", text: "Hello from the SDK.", last: true }
    capture: { sid: id }
    within_ms: 2000
  - send: { type: output.started, id: "${sid}" }
  - expect_none: { type: hangup }
    for_ms: 200
  - send: { type: output.done, id: "${sid}" }
  - expect: { type: hangup }
    within_ms: 1000
  - send: { type: session.end, reason: app_hangup }
  - close: {}
