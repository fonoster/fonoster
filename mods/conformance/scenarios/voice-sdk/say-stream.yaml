format: fonoster.scenario.v1
name: say-stream
contract: voice-sdk
role: gateway
fixture: say-stream
spec: "say streams text as it is produced / Streaming LLM tokens"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Hello", last: false }
    capture: { sid: id }
  - expect: { type: speak, id: "${sid}", text: " there", last: false }
  - expect: { type: speak, id: "${sid}", text: "!", last: false }
  - expect: { type: speak, id: "${sid}", last: true }
  - expect_none: { type: hangup }
    for_ms: 100
  - send: { type: output.started, id: "${sid}" }
  - send: { type: output.done, id: "${sid}" }
  - expect: { type: hangup }
    within_ms: 1000
