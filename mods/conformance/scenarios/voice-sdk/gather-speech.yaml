format: fonoster.scenario.v1
name: gather-speech
contract: voice-sdk
role: appbridge
fixture: gather-echo
spec: "gather is built from events / Speech"
description: >
  The fixture calls gather() and says "You said: <speech>" with the result.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect_none: { type: speak }
    for_ms: 200
  - send: { type: turn.user_started }
  - send: { type: turn.ended, text: "I want to pay my bill", language: en-US, confidence: 0.94, durationMs: 1400 }
  - expect: { type: speak, id: "*", text: "You said: I want to pay my bill", last: true }
    within_ms: 1000
