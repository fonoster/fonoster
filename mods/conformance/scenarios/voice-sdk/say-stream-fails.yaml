format: fonoster.scenario.v1
name: say-stream-fails
contract: voice-sdk
role: gateway
fixture: say-stream-fails
spec: "say streams text as it is produced / The stream fails midway"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Hello", last: false }
    capture: { sid: id }
  - expect: { type: speak, id: "${sid}", last: true }
  - expect: { type: speak, text: "The stream failed.", last: true }
    within_ms: 1000
