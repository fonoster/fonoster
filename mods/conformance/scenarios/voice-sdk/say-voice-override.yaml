format: fonoster.scenario.v1
name: say-voice-override
contract: voice-sdk
role: gateway
fixture: say-voice-override
spec: "say speaks text and reports what was heard / Voice override"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, id: "*", text: "Hola", voice: elevenlabs/rachel, language: es, last: true }
    within_ms: 2000
