format: fonoster.scenario.v1
name: answer-is-a-no-op
contract: voice-sdk
role: appbridge
fixture: answer-then-say
spec: "answer is a no-op / Old apps that answer first"
description: The fixture calls session.answer() first; the first command on the socket is the speak.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Hello from the SDK.", last: true }
    next: true
    within_ms: 2000
