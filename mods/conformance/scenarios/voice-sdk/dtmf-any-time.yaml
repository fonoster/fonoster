format: fonoster.scenario.v1
name: dtmf-any-time
contract: voice-sdk
role: gateway
fixture: dtmf-listener
spec: "Events are exposed as subscriptions / Listening for keypresses at any time"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Welcome to the menu.", last: true }
    capture: { sid: id }
  - send: { type: output.started, id: "${sid}" }
  - send: { type: dtmf, digit: "0" }
  - expect: { type: speak, text: "Key 0", last: true }
    within_ms: 1000
