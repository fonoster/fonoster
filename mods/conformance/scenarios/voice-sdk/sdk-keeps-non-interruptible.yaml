format: fonoster.scenario.v1
name: sdk-keeps-non-interruptible
contract: voice-sdk
role: gateway
fixture: say-kept
spec: "say speaks text and reports what was heard / Non-interruptible say is kept"
description: The SDK sends no clear when the caller talks over a say sent with interruptible false.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, id: "*", text: "Please hold.", last: true, interruptible: false }
    capture: { sid: id }
  - send: { type: output.started, id: "${sid}" }
  - send: { type: turn.user_started }
  - expect_none: { type: clear }
    for_ms: 300
  - send: { type: output.done, id: "${sid}" }
