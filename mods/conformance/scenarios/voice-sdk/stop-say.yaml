format: fonoster.scenario.v1
name: stop-say
contract: voice-sdk
role: gateway
fixture: stop-say
spec: "stopSay clears queued output / Cutting the agent off"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "This is a long message.", last: true }
    capture: { sid: id }
  - send: { type: output.started, id: "${sid}" }
  - send: { type: dtmf, digit: "1" }
  - expect: { type: clear }
    within_ms: 1000
  - send: { type: output.interrupted, id: "${sid}", heardText: "This is", heardMs: 400 }
  - expect: { type: speak, text: "Stopped after: This is", last: true }
    within_ms: 1000
