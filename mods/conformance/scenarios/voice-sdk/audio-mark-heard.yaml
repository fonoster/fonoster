format: fonoster.scenario.v1
name: audio-mark-heard
contract: voice-sdk
role: appbridge
fixture: audio-mark
spec: "Raw audio access / Bring-your-own TTS"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect_audio: { ms: 60 }
    within_ms: 1000
  - expect: { type: mark, name: r1 }
  - send: { type: mark, name: r1, cleared: false }
  - expect: { type: speak, text: "Heard.", last: true }
    within_ms: 1000
