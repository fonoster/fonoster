format: fonoster.scenario.v1
name: gather-twice
contract: voice-sdk
role: appbridge
fixture: gather-twice
spec: "gather is built from events / A turn already in progress"
description: A turn starts and ends during a first gather; a second gather with no input still times out.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: turn.user_started }
  - wait: { ms: 600 }
  - send: { type: turn.ended, text: "Pedro" }
  - expect: { type: speak, text: "First: Pedro", last: true }
    within_ms: 1000
    capture: { fid: id }
  - send: { type: output.done, id: "${fid}" }
    label: first-done
  - expect: { type: speak, text: "No input.", last: true }
    from: first-done
    not_before_ms: 250
    within_ms: 1500
