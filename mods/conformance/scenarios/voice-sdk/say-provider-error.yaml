format: fonoster.scenario.v1
name: say-provider-error
contract: voice-sdk
role: gateway
fixture: say-error
spec: "Errors and session end never leave promises hanging / Provider failure during say"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Hi", last: true }
    capture: { sid: id }
  - send: { type: error, code: provider_unavailable, message: TTS down, fatal: false, relatesTo: "${sid}" }
  - expect: { type: speak, text: "Error: provider_unavailable", last: true }
    within_ms: 1000
