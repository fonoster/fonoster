format: fonoster.scenario.v1
name: say-reports-interruption
contract: voice-sdk
role: appbridge
fixture: say-reports-interruption
spec: "say speaks text and reports what was heard / Interrupted"
description: >
  The fixture says "Your balance is forty two dollars." and, when say() reports an interruption,
  says "You heard: <heardText>".
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, id: "*", text: "Your balance is forty two dollars.", last: true }
    capture: { sid: id }
  - send: { type: output.started, id: "${sid}" }
  - send: { type: output.interrupted, id: "${sid}", heardText: "Your balance is", heardMs: 900 }
  - expect: { type: speak, id: "*", text: "You heard: Your balance is", last: true }
    within_ms: 1000
