format: fonoster.scenario.v1
name: gather-turn-never-ends
contract: voice-sdk
role: appbridge
fixture: gather-after-stale-turn
spec: "gather is built from events / A turn already in progress"
description: A turn in progress never ends; gather gives up 10 s past its timeout, later gathers use their normal timer, and the turn's late end is dropped.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "What's your name?", last: true }
    capture: { sid: id }
  - send: { type: output.started, id: "${sid}" }
  - send: { type: turn.user_started }
  - send: { type: output.interrupted, id: "${sid}", heardText: "What's your", heardMs: 600 }
    label: asked
  - expect: { type: speak, text: "No input 1.", last: true }
    from: asked
    not_before_ms: 10250
    within_ms: 11500
    capture: { n1: id }
  - send: { type: output.done, id: "${n1}" }
    label: one-done
  - expect: { type: speak, text: "No input 2.", last: true }
    from: one-done
    not_before_ms: 250
    within_ms: 1500
    capture: { n2: id }
  - send: { type: turn.ended, text: "late" }
  - send: { type: output.done, id: "${n2}" }
    label: two-done
  - expect: { type: speak, text: "No input 3.", last: true }
    from: two-done
    not_before_ms: 250
    within_ms: 1500
