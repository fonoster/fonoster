format: fonoster.scenario.v1
name: partial-transcripts
contract: voice-sdk
role: gateway
fixture: partials
spec: "Events are exposed as subscriptions / Opting into partial transcripts"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: subscribe, events: [transcript.partial] }
    within_ms: 1000
  - send: { type: transcript.partial, text: "hel", language: en-US }
  - expect: { type: speak, text: "Heard hel", last: true }
    within_ms: 1000
