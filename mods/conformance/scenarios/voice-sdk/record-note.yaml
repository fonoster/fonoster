format: fonoster.scenario.v1
name: record-note
contract: voice-sdk
role: appbridge
fixture: record-note
spec: "Apps can annotate the call record / Autopilot records a turn trace"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: record.note, id: "*", data: { kind: turn, firstTokenMs: 420 } }
    within_ms: 1000
