format: fonoster.scenario.v1
name: gather-dtmf
contract: voice-sdk
role: gateway
fixture: gather-echo
spec: "gather is built from events / Digits with a finish key"
description: >
  Same fixture as gather-speech; a keypress ends gather() with digits instead of speech.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - send: { type: dtmf, digit: "4" }
  - send: { type: dtmf, digit: "2" }
  - send: { type: dtmf, digit: "#" }
  - expect: { type: speak, id: "*", text: "You pressed: 42", last: true }
    within_ms: 1000
