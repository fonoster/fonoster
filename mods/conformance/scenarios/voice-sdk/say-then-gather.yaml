format: fonoster.scenario.v1
name: say-then-gather
contract: voice-sdk
role: gateway
fixture: say-then-gather
spec: "TypeScript and Python parity / A shared scenario"
description: Say interrupted, then gather digits; both SDKs must send the same frames.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Please enter your PIN.", last: true }
    capture: { sid: id }
  - send: { type: output.started, id: "${sid}" }
  - send: { type: dtmf, digit: "4" }
  - send: { type: output.interrupted, id: "${sid}", heardText: "Please enter", heardMs: 700 }
  - send: { type: dtmf, digit: "2" }
  - send: { type: dtmf, digit: "4" }
  - send: { type: dtmf, digit: "2" }
  - expect: { type: speak, text: "PIN 4242 (heard: Please enter)", last: true }
    within_ms: 1000
