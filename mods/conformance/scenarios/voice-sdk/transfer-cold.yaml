format: fonoster.scenario.v1
name: transfer-cold
contract: voice-sdk
role: gateway
fixture: transfer-cold
spec: "Call control methods map one to one / Transfer"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: transfer, id: "*", to: "+15551234567", mode: { $absent: true } }
    within_ms: 1000
  - send: { type: session.end, reason: transfer }
  - expect_close: {}
    within_ms: 1000
