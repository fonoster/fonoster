format: fonoster.scenario.v1
name: sdk-clears-on-barge-in
contract: voice-sdk
role: appbridge
fixture: say-reports-interruption
spec: "say speaks text and reports what was heard / SDK clears on barge-in"
description: >
  The app owns interruption (appbridge B22). The SDK sends clear on turn.user_started while an
  interruptible say plays, with no app code.
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, id: "*", text: "Your balance is forty two dollars.", last: true }
    capture: { sid: id }
  - send: { type: output.started, id: "${sid}" }
  - send: { type: turn.user_started }
  - expect: { type: clear }
    within_ms: 500
  - send: { type: output.interrupted, id: "${sid}", heardText: "Your balance", heardMs: 700 }
  - expect: { type: speak, id: "*", text: "You heard: Your balance", last: true }
    within_ms: 1000
