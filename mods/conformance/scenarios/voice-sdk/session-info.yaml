format: fonoster.scenario.v1
name: session-info
contract: voice-sdk
role: gateway
fixture: session-info
spec: "VoiceServer accepts gateway sessions over WebSocket / A call reaches a standalone server"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: speak, text: "Call call-1 to +15550002222 from +15550001111 (inbound, app app-1)", last: true }
    within_ms: 2000
