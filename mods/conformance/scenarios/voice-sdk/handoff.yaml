format: fonoster.scenario.v1
name: handoff
contract: voice-sdk
role: gateway
fixture: handoff
spec: "Call control methods map one to one / Handoff"
steps:
  - send:
      type: session.start
      protocol: fonoster.session.v1
      sessionRef: sess-1
      callRef: call-1
      appRef: app-1
      direction: inbound
      from: "+15550001111"
      to: "+15550002222"
      metadata: {}
      handoff: null
      audio: { codec: pcm16, rate: 16000 }
      tracks:
        - { id: 1, side: inbound, kind: audio, codec: pcm16 }
        - { id: 2, side: outbound, kind: audio, codec: pcm16 }
      speech: { voice: fonoster/default, language: en-US }
  - expect: { type: handoff, app: app-escalation, payload: { reason: angry caller } }
    within_ms: 1000
  - send: { type: session.end, reason: handoff }
  - expect_close: {}
    within_ms: 1000
