format: fonoster.scenario.v1
name: caller-audio-to-stt
contract: voice-session
role: app
spec: "Gateway latency pass bar (T1) / Caller audio to STT"
tags: [timing]
description: >
  One sample of the T1 caller-audio leg: the time from the fake media node sending the first
  audible caller packet to that audio reaching the fake STT. On pull requests the limit is loose;
  the timing suite repeats this scenario and checks the p95 against 50 ms.
steps:
  - expect: { type: session.start }
  - send: { type: listen.update }
  - assert: { providers.stt.streams: { $gte: 1 } }
  - caller: { audio: { kind: tone, ms: 400 } }
  - assert: { stt.caller_audio_lag_ms: { $lte: 150 } }
