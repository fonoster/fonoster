format: fonoster.scenario.v1
name: id-echo
contract: voice-session
role: app
spec: "Message envelope and versioning / Id echo"
ignore: [turn.estimate, transcript.partial]
steps:
  - expect: { type: session.start }
  - send: { type: speak, id: r1, text: "Thanks for calling.", last: true }
  - expect: { type: output.started, id: r1 }
  - expect: { type: output.done, id: r1 }
