format: fonoster.scenario.v1
name: inbound-routing
contract: voice-session
role: app
spec: "An app is a WebSocket URL, a protocol and speech defaults / Inbound routing"
description: >
  Routr names app-2 in X-App-Ref (call.incoming appRef); AppBridge dials app-2's URL and never
  the default app.
setup:
  media: { appRef: app-2 }
steps:
  - expect: { type: session.start, appRef: app-2 }
    within_ms: 3000
  - assert:
      app.attempts: []
