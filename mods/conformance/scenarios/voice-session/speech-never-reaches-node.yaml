format: fonoster.scenario.v1
name: speech-never-reaches-node
contract: voice-session
role: app
spec: "The Roomr node receives only control / Speech never reaches the Roomr node"
steps:
  - expect: { type: session.start }
  - send: { type: speak, id: r1, text: "Hello there, this is only audio to the node.", last: true }
    label: spoke
  - expect: { type: output.done, id: r1 }
    within_ms: 5000
  - assert:
      media.output_audio_ms: { $gt: 500 }
    from: spoke
  - assert:
      # Speaking sends the node nothing: no speech command, no text, and no command that could
      # carry it (DTMF digits, hold music, a transfer).
      media.commands:
        {
          $excludes:
            [
              { type: speak },
              { type: play },
              { text: "*" },
              { type: sendDtmf },
              { type: hold },
              { type: transfer }
            ]
        }
