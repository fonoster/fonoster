format: fonoster.scenario.v1
name: signature-reflects-secret
contract: voice-session
role: app
spec: "Connection requests are signed / Signature reflects the secret"
description: >
  The app's secret was rotated in the platform (rotated-secret) but the app still checks the old
  one: every connection is signed with the new secret only, so the app refuses them all (no
  overlap window) and the caller gets the fallback message.
setup:
  app:
    signingSecret: rotated-secret
    verifySecret: original-secret
    verifySignature: true
    fallback: { message: "We are unavailable." }
steps:
  - wait: { ms: 2500 }
  - assert:
      app.attempts: { $includes: [{ accepted: false }] }
  - assert:
      app.attempts: { $excludes: [{ accepted: true }] }
      media.commands: { $includes: [{ type: hangup }] }
