format: fonoster.scenario.v1
name: ring-before-answer
contract: voice-session
role: app
spec: "Ringing before answer / Caller hears ringing while the app is unreachable"
description: The node rings (180) before it opens the control stream; AppBridge's Answer, sent once the session is open, brings 200.
steps:
  - expect: { type: session.start }
  - wait: { ms: 200 }
  - assert:
      media.sip: [180, 200]
