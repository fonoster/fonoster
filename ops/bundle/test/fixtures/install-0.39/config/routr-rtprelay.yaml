# fonoster-config init writes config/routr-rtprelay.yaml from this file. Routr's media relay merges
# it over its default RTPEngine profiles one key at a time: a key here replaces the default's, a
# list replaces the default list, and anything not mentioned stays as Routr ships it.
# Put your own settings in config/overrides/routr-rtprelay.yaml.
kind: RTPRelay
apiVersion: v2beta1
spec:
  profiles:
    # Toward a trunk reached over TLS, offer only the mandatory SRTP suite (RFC 4568 §6.2.1).
    # RTPEngine's default offer also lists NULL_HMAC_SHA1_80 and NULL_HMAC_SHA1_32, which is
    # authenticated but unencrypted audio.
    phone-to-secure-phone:
      SDES: ["only-AES_CM_128_HMAC_SHA1_80"]
    web-to-secure-phone:
      SDES: ["only-AES_CM_128_HMAC_SHA1_80"]
