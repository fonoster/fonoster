domain: fonoster.local
appUrl: ${PUBLIC_URL}
server:
  bindAddr: 0.0.0.0:50051
  httpBridgePort: 9876
  host: apiserver
logs:
  level: info
  format: text
  transport: console
telemetry:
  otlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
database:
  url: postgresql://fonoster:s0verride0password@db.example.com:25060/fonoster?sslmode=require
encryption:
  key: ${ENCRYPTION_KEY}
authz:
  enabled: false
features:
  auth:
    methods:
      - password
    signup: invite
  billing:
    enabled: false
  costs:
    display: usage
  sip:
    names: domain
routr:
  apiEndpoint: routr:51907
  sipProxy: routr:${SIP_PORT}
  roomrPeer:
    aor: sip:roomr@default
    username: roomr
    password: ${ROOMR_PASSWORD}
nats:
  url: nats://nats:4222
  user: apiserver
  password: ${NATS_APISERVER_PASSWORD}
apps:
  autopilotUrl: ws://autopilot:3000
  autopilotSigningSecret: ${AUTOPILOT_SIGNING_SECRET}
callRecords:
  enabled: true
  stores:
    - s3:
        bucket: records
        endpoint: http://minio:9000
        region: us-east-1
        forcePathStyle: true
        credentials:
          accessKeyId: ${MINIO_ROOT_USER}
          secretAccessKey: ${MINIO_ROOT_PASSWORD}
catalog:
  file: /etc/fonoster/catalog.yaml
identity:
  database:
    url: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fnidentity
  audience: api
  keys:
    privateKeyPath: /opt/fonoster/keys/private.pem
    publicKeyPath: /opt/fonoster/keys/public.pem
  tokens:
    accessTokenExpiresIn: 15m
    idTokenExpiresIn: 15m
    refreshTokenExpiresIn: 24h
  security:
    contactVerificationRequired: false
    twoFactorAuthenticationRequired: false
  invites:
    expiration: 1d
  owner:
    name: Admin
    email: ${OWNER_EMAIL}
    password: ${OWNER_PASSWORD}
regions:
  public:
    - id: default
      name: Local (this machine)
      default: true
      endpoints:
        sip:
          - host: ${HOST_IP}
            port: ${SIP_PORT}
            transport: udp
          - host: ${HOST_IP}
            port: ${SIP_PORT}
            transport: tcp
        signalingAddresses:
          - ${HOST_IP}
        mediaAddresses:
          - ${HOST_IP}
        rtpPorts:
          min: ${RTPENGINE_PORT_MIN}
          max: ${RTPENGINE_PORT_MAX}
