# NATS subject permissions of one Fonoster service, included by ../nats.conf. Each service
# receives replies only under its own inbox prefix, `_INBOX_<user>.>`, which its NATS clients set
# (no service may read another's replies); allow_responses lets it answer requests it received.
# The session registry is the JetStream KV bucket fonoster_sessions (stream KV_fonoster_sessions);
# the "session registry" lines open it (bind or create) and read it.

# apiserver (control plane): CreateCall and TrackCall, outbound placement (CreateCall is
# gRPC to the Roomr node), record maintenance requests; consumes index entries, catalog use, webhook
# events, usage outside a call and Roomr nodes' call and room events (roomr.events.>); reads the
# session registry and writes only its placements.<callRef> entries.
APISERVER_PERMISSIONS = {
  publish = {
    allow = [
      "calls.create"
      "calls.*.events"
      "callrecord.*.maintenance"
      # session registry
      "$JS.API.INFO"
      "$JS.API.STREAM.INFO.KV_fonoster_sessions"
      "$JS.API.STREAM.CREATE.KV_fonoster_sessions"
      "$JS.API.DIRECT.GET.KV_fonoster_sessions"
      "$JS.API.DIRECT.GET.KV_fonoster_sessions.>"
      "$JS.API.STREAM.MSG.GET.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.INFO.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.DELETE.KV_fonoster_sessions.>"
      "$JS.FC.KV_fonoster_sessions.>"
      # its own entries: placements.<callRef> while an outbound call is being placed
      "$KV.fonoster_sessions.placements.>"
      # webhook intake and call-record index: durable consumers on their own work-queue streams
      "$JS.API.STREAM.INFO.FONOSTER_WEBHOOKS"
      "$JS.API.STREAM.CREATE.FONOSTER_WEBHOOKS"
      "$JS.API.CONSUMER.CREATE.FONOSTER_WEBHOOKS.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.FONOSTER_WEBHOOKS.>"
      "$JS.API.CONSUMER.INFO.FONOSTER_WEBHOOKS.apiserver-webhooks"
      "$JS.API.CONSUMER.MSG.NEXT.FONOSTER_WEBHOOKS.apiserver-webhooks"
      "$JS.ACK.FONOSTER_WEBHOOKS.>"
      "$JS.API.STREAM.INFO.FONOSTER_RECORD_INDEX"
      "$JS.API.STREAM.CREATE.FONOSTER_RECORD_INDEX"
      "$JS.API.CONSUMER.CREATE.FONOSTER_RECORD_INDEX.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.FONOSTER_RECORD_INDEX.>"
      "$JS.API.CONSUMER.INFO.FONOSTER_RECORD_INDEX.apiserver-call-records"
      "$JS.API.CONSUMER.MSG.NEXT.FONOSTER_RECORD_INDEX.apiserver-call-records"
      "$JS.ACK.FONOSTER_RECORD_INDEX.>"
      # usage outside a call (add-usage-metering D5): published on usage.<workspace>.<meter>,
      # stored by its durable consumer on the FONOSTER_USAGE work-queue stream
      "usage.>"
      "$JS.API.STREAM.INFO.FONOSTER_USAGE"
      "$JS.API.STREAM.CREATE.FONOSTER_USAGE"
      "$JS.API.CONSUMER.CREATE.FONOSTER_USAGE.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.FONOSTER_USAGE.>"
      "$JS.API.CONSUMER.INFO.FONOSTER_USAGE.apiserver-usage"
      "$JS.API.CONSUMER.MSG.NEXT.FONOSTER_USAGE.apiserver-usage"
      "$JS.ACK.FONOSTER_USAGE.>"
      # stored usage for billing (add-billing-service D2), only when billing is on
      "billing.usage.>"
      "$JS.API.STREAM.INFO.FONOSTER_USAGE_RECORDED"
      "$JS.API.STREAM.CREATE.FONOSTER_USAGE_RECORDED"
    ]
  }
  subscribe = {
    allow = [
      "calls.create"
      "calls.*.events"
      "roomr.nodes.*.heartbeat"
      "roomr.events.>"
      "callrecord.sealed"
      "registry.used"
      "webhooks.events"
      "_INBOX_apiserver.>"
    ]
  }
  allow_responses = true
}
