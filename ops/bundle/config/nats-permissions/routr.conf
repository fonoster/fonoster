# NATS subject permissions of one Fonoster service, included by ../nats.conf. Every service may
# subscribe to `_INBOX.>` (replies to its requests); allow_responses lets it answer requests it
# received. The session registry is the JetStream KV bucket fonoster_sessions (stream
# KV_fonoster_sessions); the "session registry" lines open it (bind or create) and read it.

# Routr (EdgePort's NATS publisher): call events only.
ROUTR_PERMISSIONS = {
  publish = { allow = ["routr.>"] }
  subscribe = { allow = ["_INBOX.>"] }
}
