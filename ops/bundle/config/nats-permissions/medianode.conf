# NATS subject permissions of one Fonoster service, included by ../nats.conf. Each service
# receives replies only under its own inbox prefix, `_INBOX_<user>.>`, which its NATS clients set
# (no service may read another's replies); allow_responses lets it answer requests it received.
# The session registry is the JetStream KV bucket fonoster_sessions (stream KV_fonoster_sessions);
# the "session registry" lines open it (bind or create) and read it.

# Media node: serves media-control commands, offers calls, publishes its heartbeat and room
# events, `call.failed` webhooks, and its node and room entries.
MEDIANODE_PERMISSIONS = {
  publish = {
    allow = [
      "media.*.heartbeat"
      "media.*.events.*"
      "gateway.incoming"
      "webhooks.events"
      "$KV.fonoster_sessions.nodes.>"
      "$KV.fonoster_sessions.rooms.>"
      # session registry
      "$JS.API.INFO"
      "$JS.API.STREAM.INFO.KV_fonoster_sessions"
      "$JS.API.STREAM.CREATE.KV_fonoster_sessions"
      "$JS.API.DIRECT.GET.KV_fonoster_sessions"
      "$JS.API.DIRECT.GET.KV_fonoster_sessions.>"
      "$JS.API.STREAM.MSG.GET.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.INFO.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.DELETE.KV_fonoster_sessions.>"
      "$JS.FC.KV_fonoster_sessions.>"
    ]
  }
  subscribe = { allow = ["media.*.commands", "_INBOX_medianode.>"] }
  allow_responses = true
}
