# Routr. ${NAME} values come from the routr container's environment in compose.yaml, so passwords
# never land in this file. Edit it, then docker compose up -d --force-recreate routr.
# External Postgres: set spec.database.url here; DATABASE_URL on the routr service is ignored.
kind: RoutrOne
apiVersion: v2beta1
ref: routr-one
spec:
  database:
    url: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/routr
    startInternal: false
  signaling:
    # The address Routr writes in Via and Record-Route for parties outside localnets: one that
    # carriers and softphones reach.
    externalAddrs: ["${HOST_IP}"]
    localnets: ["${SUBNET_PREFIX:-10.216.30}.40/29"]
    publishers:
      nats:
        enabled: true
        url: nats://routr:${NATS_ROUTR_PASSWORD}@nats:4222
  connect:
    verifier:
      # Browser calls: the API server's test tokens are signed with Identity's key.
      publicKeyPath: /etc/routr/keys/public.pem
  rtprelay:
    host: rtpengine
    # RTPEngine profile overrides; compose.yaml mounts config/routr-rtprelay.yaml there.
    configPath: /etc/routr/rtprelay.yaml
  logs:
    level: ${ROUTR_LOGS_LEVEL:-info}
