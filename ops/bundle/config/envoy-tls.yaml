# Envoy with TLS (the default, compose.yaml): HTTPS on 443 (8443 in the container) with the
# certificate in TLS_CERT and TLS_KEY (or the one init generated in config/tls/), and plain HTTP on
# 80 (8080) answering only with a redirect to HTTPS. Routes, filters and clusters are envoy.yaml's (the bundle tests keep them the same).
static_resources:
  listeners:
    - name: listener_http_redirect
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http_redirect
              route_config:
                name: redirect_route
                virtual_hosts:
                  - name: redirect
                    domains: ["*"]
                    routes:
                      - match: { prefix: "/" }
                        redirect: { https_redirect: true }
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: listener_https
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                # gRPC clients need HTTP/2 (h2); browsers may use either.
                alpn_protocols: ["h2", "http/1.1"]
                tls_params: { tls_minimum_protocol_version: TLSv1_2 }
                tls_certificates:
                  - certificate_chain: { filename: "/etc/envoy/tls/fullchain.pem" }
                    private_key: { filename: "/etc/envoy/tls/privkey.pem" }
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: auto
              stat_prefix: ingress_https
              # Routr's WebSocket handshake (JAIN-SIP) matches header names case-sensitively
              # (Host, Sec-WebSocket-Protocol): keep the browser's case on HTTP/1.1 (/sip).
              http_protocol_options:
                header_key_format:
                  stateful_formatter:
                    name: preserve_case
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.header_formatters.preserve_case.v3.PreserveCaseFormatterConfig
              route_config:
                name: local_route
                virtual_hosts:
                  - name: local_service
                    domains: ["*"]
                    # Browsers keep to HTTPS for this host once they have seen it (a year). Only with
                    # the owner's certificate: compose.yaml drops the marked lines when HSTS is empty.
                    # __HSTS_BEGIN__
                    response_headers_to_add:
                      - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        header:
                          key: strict-transport-security
                          value: "max-age=31536000"
                    # __HSTS_END__
                    routes:
                      # SIP over WebSocket to Routr for browser calls ("Talk to agent").
                      - match:
                          prefix: "/sip"
                        route:
                          cluster: routr-ws-cluster
                          prefix_rewrite: "/"
                          timeout: 0s
                          upgrade_configs:
                            - upgrade_type: websocket
                      - match:
                          prefix: "/api"
                        route:
                          cluster: apiserver-cluster-http
                          timeout: 0s
                      # Region-signing public keys (add-private-regions contract §1)
                      - match:
                          path: "/.well-known/region-keys.json"
                        route:
                          cluster: apiserver-cluster-http
                      - match:
                          prefix: "/fonoster.identity.v1beta2.Identity/SendVerificationCode"
                          headers:
                            - name: "content-type"
                              safe_regex_match:
                                google_re2: {}
                                regex: "^(application/grpc|application/grpc-web-text)$"
                        route:
                          cluster: apiserver-cluster
                          timeout: 0s
                          max_stream_duration:
                            grpc_timeout_header_max: 0s
                        typed_per_filter_config:
                          envoy.filters.http.local_ratelimit:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                            stat_prefix: sms_verification_rate_limit
                            token_bucket:
                              max_tokens: 20
                              tokens_per_fill: 20
                              fill_interval: 60s
                            filter_enabled:
                              default_value:
                                numerator: 100
                                denominator: HUNDRED
                            filter_enforced:
                              default_value:
                                numerator: 100
                                denominator: HUNDRED
                            response_headers_to_add:
                              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                header:
                                  key: x-ratelimit-limit
                                  value: "20 per 60s"
                      - match:
                          prefix: "/"
                          headers:
                            - name: "content-type"
                              safe_regex_match:
                                google_re2: {}
                                regex: "^(application/grpc|application/grpc-web-text)$"
                        route:
                          cluster: apiserver-cluster
                          timeout: 0s
                          max_stream_duration:
                            grpc_timeout_header_max: 0s
                      # The dashboard; the WebSocket upgrade is for Vite's HMR in the dev container.
                      - match:
                          prefix: "/"
                        route:
                          cluster: dashboard-cluster
                          timeout: 0s
                          upgrade_configs:
                            - upgrade_type: websocket
                    cors:
                      # Browser origins allowed to call the API besides the dashboard, which Envoy
                      # serves on this same origin. The placeholder matches no origin; deployments
                      # replace it with their list (Compose: CORS_ALLOWED_ORIGINS; Helm:
                      # envoy.corsAllowedOrigins).
                      allow_origin_string_match:
                        - exact: "__CORS_ALLOWED_ORIGINS__"
                      allow_methods: GET, PUT, DELETE, POST, OPTIONS
                      allow_headers: authorization,x-accesskey-id,token,accesskeyid,keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout
                      max_age: "1728000"
                      expose_headers: grpc-status,grpc-message,content-disposition,x-content-hash
              http_filters:
                - name: envoy.filters.http.grpc_web
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                - name: envoy.filters.http.cors
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                - name: envoy.filters.http.local_ratelimit
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: general_api_rate_limit
                    token_bucket:
                      max_tokens: 600
                      tokens_per_fill: 600
                      fill_interval: 60s
                    filter_enabled:
                      default_value:
                        numerator: 100
                        denominator: HUNDRED
                    filter_enforced:
                      default_value:
                        numerator: 100
                        denominator: HUNDRED
                    response_headers_to_add:
                      - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        header:
                          key: x-ratelimit-limit
                          value: "600"
                      - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        header:
                          key: x-ratelimit-remaining
                          value: "%DYNAMIC_METADATA(envoy.filters.http.local_ratelimit:tokens_remaining)%"
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: apiserver-cluster
      type: logical_dns
      connect_timeout: 20s
      http2_protocol_options: {}
      lb_policy: round_robin
      load_assignment:
        cluster_name: apiserver-cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: apiserver
                      port_value: 50051
    - name: apiserver-cluster-http
      type: logical_dns
      connect_timeout: 20s
      lb_policy: round_robin
      load_assignment:
        cluster_name: apiserver-cluster-http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: apiserver
                      port_value: 9876
    - name: routr-ws-cluster
      type: logical_dns
      connect_timeout: 5s
      lb_policy: round_robin
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options:
              header_key_format:
                stateful_formatter:
                  name: preserve_case
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.http.header_formatters.preserve_case.v3.PreserveCaseFormatterConfig
      load_assignment:
        cluster_name: routr-ws-cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: routr
                      port_value: 5062
    - name: dashboard-cluster
      type: logical_dns
      connect_timeout: 20s
      lb_policy: round_robin
      load_assignment:
        cluster_name: dashboard-cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dashboard
                      port_value: 3030