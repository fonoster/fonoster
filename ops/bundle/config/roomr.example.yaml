# The media node. `fonoster-config init` writes config/roomr.yaml from this file; each ${NAME}
# stays as written and is read from the node's environment (Compose passes .env).
nodeId: "${ROOMR_ID:-node-a}"
nats: { url: "nats://nats:4222", user: roomr, password: "${NATS_ROOMR_PASSWORD}" }
# SIP and RTP on the node's fixed address; Compose publishes the RTP range on the host.
sip:
  listen: "0.0.0.0:5060"
  advertise: "${SUBNET_PREFIX}.42"
  # The node knows no registrar by name; this deployment registers with Routr as the media-node
  # Peer the API server creates (routr.mediaNodePeer in fonoster.yaml), and Routr's
  # least-sessions balancer reads X-Session-Count. Dialed calls go out as the same Peer.
  registrations:
    - registrar: "routr:${SIP_PORT}"
      aor: sip:medianode@default
      expires: 30s
      auth: { username: medianode, password: "${ROOMR_PASSWORD}" }
      headers: { X-Session-Count: "{sessions}" }
  # Routr's X-Call-Ref names inbound calls; the API server sends it on dialed calls too.
  callRefHeader: X-Call-Ref
rtp:
  host: 0.0.0.0
  advertise: "${SUBNET_PREFIX}.42"
  portMin: "${ROOMR_RTP_PORT_MIN}"
  portMax: "${ROOMR_RTP_PORT_MAX}"
outboundProxy: "routr:${SIP_PORT}"
# Roomr (gRPC): the API server places outbound calls here (CreateCall). Plaintext; the port is
# reachable only on the bundle's network.
control: { grpc: { listen: "0.0.0.0:50061", advertise: "${SUBNET_PREFIX}.42:50061" } }
debugAddr: "0.0.0.0:8099"
# INVITEs (and their X-App-Ref/X-Call-Ref headers) only from Routr.
trustedSources: ["${SUBNET_PREFIX}.40"]
# OTLP/HTTP export to your collector; empty (the default) is off.
telemetry: { otlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" }
