# A private region's NATS (compose.region.yaml): local traffic stays here; `region.<ref>.>` reaches
# Fonoster over one outbound leaf link. leaf.conf is written by the region agent's `enroll` into
# the `region` volume, so enroll before starting NATS.
port: 4222
http_port: 8222
jetstream {
  store_dir: /data
}
include ./region/leaf.conf

# One user per service, each limited to its own subjects; passwords come from .env.
include ./nats-permissions/appbridge.conf
include ./nats-permissions/roomr.conf
include ./nats-permissions/routr.conf
include ./nats-permissions/region-agent.conf
authorization {
  users = [
    { user: appbridge, password: $NATS_APPBRIDGE_PASSWORD, permissions: $APPBRIDGE_PERMISSIONS }
    { user: roomr, password: $NATS_ROOMR_PASSWORD, permissions: $ROOMR_PERMISSIONS }
    { user: routr, password: $NATS_ROUTR_PASSWORD, permissions: $ROUTR_PERMISSIONS }
    { user: region-agent, password: $NATS_REGION_AGENT_PASSWORD, permissions: $REGION_AGENT_PERMISSIONS }
  ]
}
