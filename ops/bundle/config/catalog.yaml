# The provider catalog: the providers, models and voices the dashboard's pickers offer. The API
# server loads this file on every start (config/fonoster.yaml: catalog.file): it adds and updates
# the entries listed here and never removes others.
# No keys here: providers name a credentialRef. Owners add vendor keys per workspace in the
# dashboard (Settings, provider keys).
entries:
  # ---- providers -------------------------------------------------------------------------
  - { kind: provider, id: deepgram, label: "Deepgram", adapter: deepgram, capabilities: [stt, tts], credentialRef: deepgram-default, state: active }
  - { kind: provider, id: elevenlabs, label: "ElevenLabs", adapter: elevenlabs, capabilities: [tts], credentialRef: elevenlabs-default, state: active }
  - { kind: provider, id: openai, label: "OpenAI", adapter: openai, capabilities: [llm], credentialRef: openai-default, state: active }
  - { kind: provider, id: groq, label: "Groq", adapter: groq, capabilities: [llm], credentialRef: groq-default, state: active }
  - { kind: provider, id: aicoustics, label: "ai-coustics", adapter: aicoustics, capabilities: [nc], credentialRef: aicoustics-default, state: active }
  # ---- models ----------------------------------------------------------------------------
  - { kind: model, id: deepgram/nova-3, label: "Nova 3", type: stt, features: [streaming, interim-results, word-timings, multilingual], languages: [en, es, multi], settings: [], state: active }
  - { kind: model, id: deepgram/nova-2-phonecall, label: "Nova 2 Phone Call", type: stt, features: [streaming, interim-results, word-timings], languages: [en], settings: [], state: active }
  - { kind: model, id: deepgram/aura-2, label: "Aura 2", type: tts, features: [streaming], languages: [en, es], settings: [], state: active }
  - { kind: model, id: elevenlabs/eleven_flash_v2_5, label: "Eleven Flash v2.5", type: tts, features: [streaming], languages: [en, es, multi], settings: [stability, similarity_boost, style, speed], state: active }
  - { kind: model, id: openai/gpt-4o-mini, label: "GPT-4o Mini", type: llm, features: [streaming, tool-calling, json-mode], languages: [], settings: [], state: active }
  # Groq serves OpenAI's open-weight models (catalog id = groq/<Groq model name>). Groq retired
  # Llama 3.3 70B; agents that still name it run on gpt-oss-120b (FN-B5).
  - { kind: model, id: groq/openai/gpt-oss-120b, label: "GPT-OSS 120B", type: llm, features: [streaming, tool-calling], languages: [], settings: [], state: active }
  - { kind: model, id: groq/openai/gpt-oss-20b, label: "GPT-OSS 20B", type: llm, features: [streaming, tool-calling], languages: [], settings: [], state: active }
  - { kind: model, id: groq/llama-3.3-70b-versatile, label: "Llama 3.3 70B Versatile", type: llm, features: [streaming, tool-calling], languages: [], settings: [], state: retired, replacement: groq/openai/gpt-oss-120b, retireOn: "2026-10-15" }
  - { kind: model, id: openai/gpt-4.1-mini, label: "GPT-4.1 Mini", type: llm, features: [streaming, tool-calling, json-mode], languages: [], settings: [], state: active }
  # ---- voices: Deepgram Aura-2 (catalog id = deepgram/<Deepgram model name>) ---------------
