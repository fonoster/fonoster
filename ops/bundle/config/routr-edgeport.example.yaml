# Routr's EdgePort. `fonoster-config init` writes config/routr-edgeport.yaml from this file. SIP
# listens on SIP_PORT inside the container too, so Via and Record-Route carry the port softphones
# and carriers reach.
kind: EdgePort
apiVersion: v2beta1
ref: default
metadata:
  region: default
spec:
  unknownMethodAction: Discard
  processor:
    addr: localhost:51901
  securityContext:
    client:
      protocols: [TLSv1.3, TLSv1.2]
      # Disabled = no client certificate is requested; the carrier's certificate chain is still
      # validated against the JVM's public CAs. Never DisabledAll: it trusts any certificate.
      authType: Disabled
    keyStorePassword: changeme
    keyStore: "/etc/routr/certs/signaling.p12"
    keyStoreType: pkcs12
    # No truststore: EdgePort uses the JVM's cacerts (public CAs). For a carrier with a private CA,
    # set a truststore (trustStore, trustStorePassword) in config/overrides/routr-edgeport.yaml.
  methods: [REGISTER, MESSAGE, INVITE, ACK, BYE, CANCEL]
  transport:
    - protocol: tcp
      port: ${SIP_PORT}
    - protocol: udp
      port: ${SIP_PORT}
    # SIP over WebSocket for browser calls ("Talk to agent"). Not published: Envoy proxies /sip on
    # the API port to it.
    - protocol: ws
      port: 5062
    # Browsers on an https:// dashboard speak SIP over WSS. Envoy terminates TLS and still
    # proxies them to ws:5062, but Routr routes each request by the transport the browser names,
    # so it needs a WSS listening point too (Record-Route and self-route matching use its port).
    # Not published; the keystore above is the self-signed one the image creates, unless
    # compose.tls.yaml mounts yours for SIP over TLS.
    - protocol: wss
      port: 5063
    # SIP over TLS (off by default): uncomment with the routr lines in compose.tls.yaml, which
    # mount your keystore at /etc/routr/certs/signaling.p12 and publish 5061/tcp, and set the
    # keystore password above. Carriers and softphones then use sips: or transport=tls on 5061.
    # - protocol: tls
    #   port: 5061
