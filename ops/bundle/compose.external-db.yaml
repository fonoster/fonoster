# A Postgres you manage instead of the bundled one. Set each service's database URL in its file
# under config/ (fonoster.yaml, appbridge.yaml and autopilot.yaml) and Routr's as
# ROUTR_DATABASE_URL=postgresql://... in .env, then turn this overlay on in .env:
#
#   COMPOSE_FILE=compose.yaml:compose.external-db.yaml
#
# and run `docker compose up -d --wait`. The bundled postgres is never started, routr-migrations
# migrates Routr's database before Routr starts, the services that waited for postgres wait for
# NATS only, and the API server still starts after Routr reached its database. See
# https://docs.fonoster.com/self-hosting/external-database.
services:
  postgres:
    profiles: [bundled-db]
  routr-migrations:
    depends_on: !override {}
  routr:
    depends_on: !override
      routr-migrations: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
  apiserver:
    depends_on: !override
      nats: { condition: service_healthy }
      routr: { condition: service_healthy }
