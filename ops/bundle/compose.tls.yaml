# HTTPS is the default now (compose.yaml), so this file only keeps older .env files working
# (COMPOSE_FILE=compose.yaml:compose.tls.yaml) and holds the optional SIP over TLS lines below.
# Set TLS_CERT and TLS_KEY in .env to serve your own certificate
# (https://docs.fonoster.com/self-hosting/https).
services:
  # SIP over TLS (SIPS) for carriers and softphones, off by default. Routr needs the certificate
  # as a PKCS#12 keystore (config/routr-edgeport.example.yaml has the matching transport), e.g.:
  #
  #   openssl pkcs12 -export -in fullchain.pem -inkey privkey.pem \
  #     -out config/tls/signaling.p12 -passout pass:<password>
  #
  # Then uncomment these lines and the tls transport in config/routr-edgeport.example.yaml, set
  # its keyStorePassword and trustStorePassword to <password>, and run init again. Add this file
  # to COMPOSE_FILE (COMPOSE_FILE=compose.yaml:compose.tls.yaml).
  #
  # routr:
  #   volumes:
  #     - ${CONFIG_DIR:-./config}/tls/signaling.p12:/etc/routr/certs/signaling.p12:ro
  #   ports:
  #     - "5061:5061/tcp"
  {}
