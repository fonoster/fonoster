# NATS subject permissions of one Fonoster service, included by ../nats.conf. Each service
# receives replies only under its own inbox prefix, `_INBOX_<user>.>`, which its NATS clients set
# (no service may read another's replies); allow_responses lets it answer requests it received.
# The session registry is the JetStream KV bucket fonoster_sessions (stream KV_fonoster_sessions);
# the "session registry" lines open it (bind or create) and read it.

# Billing (Fonoster Cloud, off by default): consumes the stored usage the apiserver publishes on
# billing.usage.> (stream FONOSTER_USAGE_RECORDED, durable billing-usage) and watches the session
# registry's calls.> entries to count each owner's calls in progress.
BILLING_PERMISSIONS = {
  publish = {
    allow = [
      # stored usage
      "$JS.API.INFO"
      "$JS.API.STREAM.INFO.FONOSTER_USAGE_RECORDED"
      "$JS.API.STREAM.CREATE.FONOSTER_USAGE_RECORDED"
      "$JS.API.CONSUMER.CREATE.FONOSTER_USAGE_RECORDED.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.FONOSTER_USAGE_RECORDED.>"
      "$JS.API.CONSUMER.INFO.FONOSTER_USAGE_RECORDED.billing-usage"
      "$JS.API.CONSUMER.MSG.NEXT.FONOSTER_USAGE_RECORDED.billing-usage"
      "$JS.ACK.FONOSTER_USAGE_RECORDED.>"
      # session registry
      "$JS.API.STREAM.INFO.KV_fonoster_sessions"
      "$JS.API.STREAM.CREATE.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.INFO.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.DELETE.KV_fonoster_sessions.>"
      "$JS.FC.KV_fonoster_sessions.>"
    ]
  }
  subscribe = {
    allow = [
      "_INBOX_billing.>"
    ]
  }
  allow_responses = true
}
