# The stage: releases/<version> holds the release plus this inventory's files, merged and
# initialised (init.sh). It runs in --check too (check_mode: false): a plan downloads, renders, validates and
# pulls. It is rebuilt from the archive on every run, so nothing from an earlier run carries
# over; writing it is not a change to the host (changed_when: false), the switch is.
# tls/ holds the certificate init.sh generates: none with the owner's own (TLS_CERT).
- name: Persistent folders
  ansible.builtin.set_fact:
    fonoster_tls_dirs: "{{ [] if fonoster_env.TLS_CERT | default('') else ['tls'] }}"

- name: State folders
  ansible.builtin.file:
    path: "{{ fonoster_state_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: "{{ ['releases', 'backups', 'keys'] + fonoster_tls_dirs }}"
  check_mode: false

- name: Paths of this version
  ansible.builtin.set_fact:
    fonoster_releases: "{{ fonoster_state_dir }}/releases"
    fonoster_stage: "{{ fonoster_state_dir }}/releases/{{ fonoster_version }}"
    fonoster_archive_name: "{{ fonoster_archive | basename }}"

# With fonoster_generate_secrets, the secrets init.sh generated on an earlier run (kept in the
# state folder); the inventory's values win.
- name: Generated secrets
  ansible.builtin.slurp:
    src: "{{ fonoster_state_dir }}/generated.env"
  register: fonoster_generated
  failed_when: false
  no_log: true

- name: Values of .env
  ansible.builtin.set_fact:
    fonoster_generated_env: >-
      {{ dict((fonoster_generated.content | default('') | b64decode)
              | regex_findall('(?m)^([A-Za-z_][A-Za-z0-9_]*)=(.*)$'))
         if fonoster_generate_secrets else {} }}
  no_log: true

- name: All values of .env
  ansible.builtin.set_fact:
    fonoster_live_env: >-
      {{ fonoster_generated_env
         | combine(fonoster_env, fonoster_env_secrets, {'FONOSTER_VERSION': fonoster_version}) }}
  no_log: true

# Release files ----------------------------------------------------------------------------------
- name: SHA256SUMS (download)
  ansible.builtin.get_url:
    url: "{{ fonoster_sha256sums }}"
    dest: "{{ fonoster_releases }}/fonoster-{{ fonoster_version }}.SHA256SUMS"
    mode: "0600"
    force: true
  when: fonoster_sha256sums is match('https?://')
  check_mode: false

- name: SHA256SUMS (local)
  ansible.builtin.copy:
    src: "{{ fonoster_sha256sums }}"
    dest: "{{ fonoster_releases }}/fonoster-{{ fonoster_version }}.SHA256SUMS"
    mode: "0600"
  when: fonoster_sha256sums is not match('https?://')
  check_mode: false

- name: Read SHA256SUMS
  ansible.builtin.slurp:
    src: "{{ fonoster_releases }}/fonoster-{{ fonoster_version }}.SHA256SUMS"
  register: fonoster_sums

- name: Checksum SHA256SUMS lists
  ansible.builtin.set_fact:
    fonoster_archive_sha256: >-
      {{ ((fonoster_sums.content | b64decode)
          | regex_findall('(?m)^([0-9a-f]{64}) [ *]' ~ (fonoster_archive_name | regex_escape) ~ '$')
          + ['']) | first }}

- name: Archive (download)
  ansible.builtin.get_url:
    url: "{{ fonoster_archive }}"
    dest: "{{ fonoster_releases }}/fonoster-{{ fonoster_version }}.tar.gz"
    mode: "0600"
    checksum: "{{ ('sha256:' ~ fonoster_archive_sha256) if fonoster_archive_sha256 else omit }}"
  when: fonoster_archive is match('https?://')
  check_mode: false

- name: Archive (local)
  ansible.builtin.copy:
    src: "{{ fonoster_archive }}"
    dest: "{{ fonoster_releases }}/fonoster-{{ fonoster_version }}.tar.gz"
    mode: "0600"
  when: fonoster_archive is not match('https?://')
  check_mode: false

- name: Archive checksum
  ansible.builtin.stat:
    path: "{{ fonoster_releases }}/fonoster-{{ fonoster_version }}.tar.gz"
    checksum_algorithm: sha256
  register: fonoster_archive_stat

- name: Archive matches SHA256SUMS
  ansible.builtin.assert:
    that:
      - fonoster_archive_sha256 != ""
      - fonoster_archive_stat.stat.checksum | default('') == fonoster_archive_sha256
    fail_msg: >-
      {{ fonoster_archive_name }} does not match {{ fonoster_sha256sums }}
      ({{ fonoster_archive_stat.stat.checksum | default('no file') }},
      SHA256SUMS says {{ fonoster_archive_sha256 or 'nothing for it' }}). Nothing was changed.
    quiet: true

# The stage -------------------------------------------------------------------------------------
- name: Fresh stage
  ansible.builtin.file:
    path: "{{ fonoster_stage }}"
    state: absent
  changed_when: false
  check_mode: false

- name: Stage folder
  ansible.builtin.file:
    path: "{{ fonoster_stage }}"
    state: directory
    mode: "0700"
  changed_when: false
  check_mode: false

- name: Unpack the release
  ansible.builtin.unarchive:
    src: "{{ fonoster_releases }}/fonoster-{{ fonoster_version }}.tar.gz"
    dest: "{{ fonoster_stage }}"
    remote_src: true
    extra_opts: [--strip-components=1, --no-same-owner]
  changed_when: false
  check_mode: false

- name: .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ fonoster_stage }}/.env"
    mode: "0600"
  no_log: true
  diff: false
  changed_when: false
  check_mode: false

# Each override deep-merged over the release's config/<file> (objects merge, other values
# replace, null deletes a key). The merged file can hold a secret (a database URL), so it is never
# printed.
- name: Release config files with overrides
  ansible.builtin.slurp:
    src: "{{ fonoster_stage }}/config/{{ item }}"
  loop: "{{ fonoster_overrides.keys() | list }}"
  register: fonoster_release_configs
  check_mode: false

- name: Overrides
  ansible.builtin.copy:
    content: >-
      {{ (item.content | b64decode | from_yaml)
         | fonoster_merge(fonoster_overrides[item.item])
         | to_nice_yaml(indent=2) }}
    dest: "{{ fonoster_stage }}/config/{{ item.item }}"
    mode: "0644"
  loop: "{{ fonoster_release_configs.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  diff: false
  changed_when: false
  check_mode: false

- name: Compose overlays
  ansible.builtin.copy:
    content: "{{ item.value | to_nice_yaml(indent=2) }}"
    dest: "{{ fonoster_stage }}/{{ item.key }}"
    mode: "0644"
  loop: "{{ fonoster_compose_overlays | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  # An overlay can hold a secret (an environment value).
  no_log: true
  diff: false
  changed_when: false
  check_mode: false

# The files only: the folders stay 0755 as init makes them (the containers, which run as other
# users, read the keys through the folder).
- name: Persistent keys and TLS into the stage
  ansible.builtin.shell: |
    set -e
    mkdir -p {{ fonoster_stage }}/config/{{ item }}
    cp -a {{ fonoster_state_dir }}/{{ item }}/. {{ fonoster_stage }}/config/{{ item }}/
    chmod 0755 {{ fonoster_stage }}/config/{{ item }}
  loop: "{{ ['keys'] + fonoster_tls_dirs }}"
  changed_when: false
  check_mode: false

# init.sh keeps every .env value, key and certificate and sets the SIP port in the merged
# routr-edgeport.yaml, so it runs last. It never prints a secret.
- name: Initialise (init.sh)
  ansible.builtin.command:
    argv: ["sh", "{{ fonoster_stage }}/init.sh", "--dir", "{{ fonoster_stage }}", "--host-ip", "{{ fonoster_env.HOST_IP }}"]
  changed_when: false
  check_mode: false

# init.sh adds the names a newer release introduces, with values of its own: those belong in the
# inventory, so stop before anything runs with them.
- name: Read the rendered .env
  ansible.builtin.slurp:
    src: "{{ fonoster_stage }}/.env"
  register: fonoster_stage_env
  no_log: true

- name: Names init.sh added
  ansible.builtin.set_fact:
    fonoster_added: >-
      {{ (fonoster_stage_env.content | b64decode | regex_findall('(?m)^([A-Za-z_][A-Za-z0-9_]*)='))
         | difference(fonoster_live_env.keys() | list) }}

# With fonoster_generate_secrets, a secret init.sh generated is fine (it is kept below).
- name: The inventory has every .env name
  ansible.builtin.assert:
    that: fonoster_missing | length == 0
    fail_msg: >-
      This release adds {{ fonoster_missing | join(', ') }} to .env and the inventory has no value for
      it. Add it to fonoster_env or fonoster_env_secrets ({{ fonoster_stage }}/.env has the value
      init.sh chose) and run again. Nothing was changed.
    quiet: true
  vars:
    fonoster_missing: >-
      {{ fonoster_added | reject('match', '^.*(_PASSWORD|_SECRET|_KEY|_TOKEN)$') | list
         if fonoster_generate_secrets else fonoster_added }}

- name: Keep the secrets init.sh generated
  ansible.builtin.copy:
    content: |
      # Generated by init.sh on this host (fonoster_generate_secrets); the inventory's values win.
      {% set values = fonoster_generated_env | combine(dict((fonoster_stage_env.content | b64decode)
           | regex_findall('(?m)^([A-Za-z_][A-Za-z0-9_]*)=(.*)$'))) %}
      {% for name in (fonoster_generated_env.keys() | list) + fonoster_added %}
      {{ name }}={{ values[name] }}
      {% endfor %}
    dest: "{{ fonoster_state_dir }}/generated.env"
    mode: "0600"
  no_log: true
  diff: false
  when: fonoster_generate_secrets and fonoster_added | length > 0 and not ansible_check_mode

# Keys and TLS init.sh created (a first install) become the persistent ones. Files already there
# are never rewritten.
- name: Persist new keys and TLS
  ansible.builtin.shell: |
    set -e
    [ -d {{ fonoster_stage }}/config/{{ item }} ] || exit 0
    cd {{ fonoster_stage }}/config/{{ item }}
    find . -type f | sort | while read -r f; do
      dest={{ fonoster_state_dir }}/{{ item }}/$f
      [ -e "$dest" ] && continue
      mkdir -p "$(dirname "$dest")"
      cp -a "$f" "$dest"
      echo "$f"
    done
  loop: "{{ ['keys'] + fonoster_tls_dirs }}"
  register: fonoster_persist
  changed_when: fonoster_persist.stdout != ""
  check_mode: false

# A private region runs no API server: its agent's image says the pull is done.
- name: Images on the host
  ansible.builtin.command: docker image inspect fonoster/{{ 'region-agent' if fonoster_region is defined else 'apiserver' }}:{{ fonoster_version }}
  register: fonoster_image
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pull the images
  ansible.builtin.command:
    cmd: docker compose pull --quiet
    chdir: "{{ fonoster_stage }}"
  when: fonoster_image.rc != 0
  changed_when: false
  check_mode: false
