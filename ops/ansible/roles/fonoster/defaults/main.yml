# fonoster_version has no default: pass it (-e fonoster_version=0.40.0).

# The release archive: a URL, or a path on the controller (a local build). SHA256SUMS next to it
# must list it.
fonoster_repo: fonoster/fonoster
fonoster_archive: https://github.com/{{ fonoster_repo }}/releases/download/v{{ fonoster_version }}/fonoster-{{ fonoster_version }}.tar.gz
fonoster_sha256sums: "{{ fonoster_archive | dirname }}/SHA256SUMS"

fonoster_dir: /opt/fonoster          # the live install (what docker compose runs)
fonoster_state_dir: /var/lib/fonoster # stages, backups, keys, TLS and deploys.log
fonoster_keep: 3                     # stages and backups kept

# The smoke test: the dashboard answers 200 at fonoster_public_url, and the API at
# fonoster_api_host (host[:port]) answers an empty ExchangeCredentials with grpc-status 3.
fonoster_public_url: ""
fonoster_api_host: ""
# How many times the smoke test asks the dashboard and the API, 10 s apart, before the play fails.
fonoster_smoke_retries: 30

# .env: every name init.sh writes (FONOSTER_VERSION comes from fonoster_version).
# The play fails when a release adds a name neither of these has.
fonoster_env: {}
fonoster_env_secrets: {}
# true: a secret init.sh generates for a name neither has is kept in the state folder
# (generated.env) and reused, instead of failing the play (private regions).
fonoster_generate_secrets: false
# Deep-merged over the release's config/<file> (objects merge, other values replace, null
# deletes a key).
fonoster_overrides: {}
# Compose files written next to compose.yaml (name them in COMPOSE_FILE).
fonoster_compose_overlays: {}
# Whole files the release does not ship, written next to it (a path inside the install -> its
# content). A file the release ships is refused: add lines with fonoster_inserts or keys with
# fonoster_overrides instead. Never printed.
fonoster_files: {}
# Lines added to a release file (a path inside the install -> a list). Each `before` or `after`
# is a regular expression that must match exactly one line of the release's file; `lines` go right
# before or after that line, each indented like it. Never printed.
fonoster_inserts: {}

# Never copied into the live install: only what runs (and init.sh) lands there.
fonoster_live_excludes:
  - README.md
  - ansible
# A private region's files, left out of an install that doesn't run compose.region.yaml.
fonoster_region_files:
  - compose.region.yaml
  - config/region
  - config/nats-permissions/region-agent.conf
