# A private region: copy to inventory/region.yml and set your host and its values. Two kinds of
# secret go in inventory/group_vars/regions/vault.yml (ansible-vault encrypt_string ... >> that
# file): vault_enroll_token (the token from the dashboard) and one vault_<provider>_key per
# provider. The rest are generated on the host.
all:
  children:
    regions:
      hosts:
        region1:
          ansible_host: 198.51.100.7
          ansible_user: root
      vars:
        # The region runs no dashboard or API: nothing to smoke-test from the controller.
        fonoster_public_url: ""
        fonoster_api_host: ""
        # DNS: sip.<domain> and *.sip.<domain> point at the host.
        region_sip_domain: sip.example.com
        fonoster_env:
          COMPOSE_PROJECT_NAME: fonoster
          COMPOSE_FILE: compose.yaml:compose.region.yaml
          HOST_IP: "{{ ansible_host }}"
          HTTPS_PORT: "443"
          HTTPS_REDIRECT_PORT: "80"
          PUBLIC_URL: "https://{{ ansible_host }}"
          HTTP_PORT: "8449"
          SIP_PORT: "5060"
          RTPENGINE_PORT_MIN: "10000"
          RTPENGINE_PORT_MAX: "10999"
          ROOMR_RTP_PORT_MIN: "11000"
          ROOMR_RTP_PORT_MAX: "11999"
          MINIO_PORT: "9000"
          MINIO_CONSOLE_PORT: "9001"
          NATS_PORT: "4222"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_PROTOCOL: ""
          SUBNET_PREFIX: 10.216.30
          OWNER_EMAIL: ops@example.com
          MINIO_ROOT_USER: fonoster
        # The region's own secrets (database, NATS, encryption key...) are generated by init.sh on
        # the host and kept there (/var/lib/fonoster/generated.env).
        fonoster_generate_secrets: true
        fonoster_env_secrets:
          OTEL_EXPORTER_OTLP_HEADERS: ""
        # What the region reports to Fonoster (shown in the dashboard): its SIP address.
        fonoster_overrides:
          region/region-agent.yaml:
            endpoints:
              sip:
                - { host: "{{ region_sip_domain }}", port: 5060, transport: udp }
                - { host: "{{ region_sip_domain }}", port: 5060, transport: tcp }
        fonoster_region:
          # Used once: a second run with a used token changes nothing.
          enroll_token: "{{ vault_enroll_token }}"
          secrets:
            deepgram: "{{ vault_deepgram_key }}"
