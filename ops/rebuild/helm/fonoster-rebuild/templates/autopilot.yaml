{{- if .Values.autopilot.enabled }}
{{- $a := .Values.autopilot }}
{{- $cfg := tpl (toYaml $a.config) . | fromYaml }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-autopilot
  labels:
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
data:
  autopilot-session.yaml: |
    {{- toYaml $cfg | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-autopilot
  labels:
    app.kubernetes.io/name: autopilot
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  replicas: {{ $a.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: autopilot
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autopilot
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ toYaml $cfg | sha256sum }}
    spec:
      containers:
        - name: autopilot
          image: "{{ $a.image.repository }}:{{ $a.image.tag }}"
          imagePullPolicy: {{ $a.image.pullPolicy }}
          env:
            {{- include "fonoster-rebuild.commonEnv" (dict "root" $ "service" "autopilot") | nindent 12 }}
            - name: AUTOPILOT_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: {{ $a.secret | quote }}, key: secret } }
            - name: APISERVER_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $a.databaseSecret | quote }}, key: url, optional: true } }
            - name: APISERVER_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ $a.databaseSecret | quote }}, key: key, optional: true } }
          ports:
            - { name: session, containerPort: {{ $a.config.port | default 3000 }} }
          volumeMounts:
            - { name: config, mountPath: /etc/fonoster/autopilot-session.yaml, subPath: autopilot-session.yaml, readOnly: true }
            {{- include "fonoster-rebuild.secretMounts" (dict "root" $ "names" $a.secretMounts) | nindent 12 }}
            {{- if .Values.regionAgent.enabled }}
            - { name: cell-secrets, mountPath: /var/lib/fonoster-secrets, readOnly: true }
            {{- end }}
          resources:
            {{- toYaml $a.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-autopilot
        {{- include "fonoster-rebuild.secretVolumes" (dict "root" $ "names" $a.secretMounts) | nindent 8 }}
        {{- if .Values.regionAgent.enabled }}
        - name: cell-secrets
          secret: { secretName: {{ .Values.regionAgent.secretsSecret | quote }}, optional: true }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-autopilot
  labels:
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: autopilot
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: session, port: {{ $a.config.port | default 3000 }}, targetPort: session }
{{- end }}
