{{- if .Values.medianode.enabled }}
{{- $m := .Values.medianode }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-medianode
  labels:
    app.kubernetes.io/name: medianode
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-medianode
  replicas: {{ $m.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: medianode
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medianode
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: {{ $m.hostNetwork }}
      {{- if $m.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      # Drain grace = maxWait: the node drains for this long after SIGTERM, plus a little slack.
      terminationGracePeriodSeconds: {{ add $m.drainGraceSeconds 15 }}
      containers:
        - name: medianode
          image: "{{ $m.image.repository }}:{{ $m.image.tag }}"
          imagePullPolicy: {{ $m.image.pullPolicy }}
          args:
            - -drain-wait={{ $m.drainGraceSeconds }}s
          env:
            - name: MEDIANODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: MEDIANODE_NATS_URL
              value: {{ include "fonoster-rebuild.natsUrl" . | quote }}
            - name: MEDIANODE_SIP_LISTEN
              value: {{ $m.sip.listen | quote }}
            - name: MEDIANODE_SIP_ADVERTISE
              {{- if eq $m.sip.advertise "hostIP" }}
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
              {{- else }}
              value: {{ $m.sip.advertise | quote }}
              {{- end }}
            - name: MEDIANODE_RTP_ADVERTISE
              {{- if eq $m.rtp.advertise "hostIP" }}
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
              {{- else }}
              value: {{ $m.rtp.advertise | quote }}
              {{- end }}
            - { name: MEDIANODE_RTP_HOST, value: "0.0.0.0" }
            - { name: MEDIANODE_RTP_PORT_MIN, value: {{ $m.rtp.portMin | quote }} }
            - { name: MEDIANODE_RTP_PORT_MAX, value: {{ $m.rtp.portMax | quote }} }
            - { name: MEDIANODE_REGISTRAR, value: {{ $m.routr.registrar | quote }} }
            - { name: MEDIANODE_DOMAIN, value: {{ $m.routr.domain | quote }} }
            - { name: MEDIANODE_OUTBOUND_PROXY, value: {{ $m.routr.outboundProxy | quote }} }
            - name: MEDIANODE_USERNAME
              {{- if $m.routr.username }}
              value: {{ $m.routr.username | quote }}
              {{- else }}
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
              {{- end }}
            - name: MEDIANODE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $m.routr.passwordSecret | quote }}, key: password, optional: true } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ include "fonoster-rebuild.otlpEndpoint" . | quote }} }
            - { name: OTEL_SERVICE_NAME, value: fonoster-medianode }
          ports:
            - { name: sip-udp, containerPort: 5060, protocol: UDP }
            - { name: sip-tcp, containerPort: 5060, protocol: TCP }
          resources:
            {{- toYaml $m.resources | nindent 12 }}
{{- end }}
