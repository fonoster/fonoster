{{- if .Values.appbridge.enabled }}
{{- $recordsDir := dig "callRecord" "dir" "" (.Values.appbridge.config | default dict) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-appbridge
  labels:
    app.kubernetes.io/name: appbridge
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.appbridge.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: appbridge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appbridge
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/appbridge-config.yaml") . | sha256sum }}
    spec:
      # Longer than the drain wait (session.drainWait = drainGraceSeconds), whatever values say.
      terminationGracePeriodSeconds: {{ max (.Values.appbridge.terminationGracePeriodSeconds | int) (add (.Values.appbridge.drainGraceSeconds | int) 30) }}
      containers:
        - name: appbridge
          image: "{{ .Values.appbridge.image.repository }}:{{ .Values.appbridge.image.tag }}"
          imagePullPolicy: {{ .Values.appbridge.image.pullPolicy }}
          env:
            {{- include "fonoster-rebuild.commonEnv" (dict "root" $ "service" "appbridge" "nats" "appbridge") | nindent 12 }}
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            {{- $db := .Values.appbridge.databaseSecret | default (and .Values.regionAgent.enabled .Values.regionAgent.databaseSecret) }}
            {{- if $db }}
            # Apps, catalog and webhooks from the control-plane (or, in a private cell, the cell) database.
            - name: APISERVER_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $db | quote }}, key: url } }
            - name: APISERVER_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ $db | quote }}, key: key } }
            {{- end }}
            {{- with .Values.appbridge.analyticsSecret }}
            # ClickHouse credentials for config callRecord.analytics.clickhouse (LO-B6).
            - name: CLICKHOUSE_USER
              valueFrom: { secretKeyRef: { name: {{ . | quote }}, key: user } }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ . | quote }}, key: password } }
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            # Session.Connect (the Roomr node's control streams) and grpc.health.v1.
            - { name: session, containerPort: {{ .Values.appbridge.sessionPort }} }
          # NOT_SERVING while draining after SIGTERM: the Service stops sending new streams here.
          readinessProbe:
            grpc: { port: {{ .Values.appbridge.sessionPort }} }
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - { name: config, mountPath: /etc/fonoster/appbridge.yaml, subPath: appbridge.yaml, readOnly: true }
            {{- include "fonoster-rebuild.secretMounts" (dict "root" $ "names" .Values.appbridge.secretMounts) | nindent 12 }}
            {{- if .Values.regionAgent.enabled }}
            # A private cell's provider keys (config cellSecrets.dir: /var/lib/fonoster-secrets).
            - { name: cell-secrets, mountPath: /var/lib/fonoster-secrets, readOnly: true }
            {{- end }}
            {{- with $recordsDir }}
            # Call records being written (config callRecord.dir).
            - { name: records, mountPath: {{ . | quote }} }
            {{- end }}
          resources:
            {{- toYaml .Values.appbridge.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-appbridge
        {{- include "fonoster-rebuild.secretVolumes" (dict "root" $ "names" .Values.appbridge.secretMounts) | nindent 8 }}
        {{- if .Values.regionAgent.enabled }}
        - name: cell-secrets
          secret: { secretName: {{ .Values.regionAgent.secretsSecret | quote }}, optional: true }
        {{- end }}
        {{- if $recordsDir }}
        - name: records
          {{- toYaml .Values.appbridge.recordsVolume | nindent 10 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-appbridge
  labels:
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  type: {{ .Values.appbridge.service.type }}
  selector:
    app.kubernetes.io/name: appbridge
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: {{ .Values.appbridge.service.port }}, targetPort: http }
    # The Roomr node's sessionEndpoint (<release>-appbridge:<sessionPort>).
    - { name: session, port: {{ .Values.appbridge.sessionPort }}, targetPort: session }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-appbridge
spec:
  minAvailable: {{ .Values.appbridge.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: appbridge
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
