{{- if .Values.dashboard.enabled }}
{{- $d := .Values.dashboard }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  replicas: {{ $d.replicas }}
  selector:
    matchLabels:
      {{- include "fonoster-rebuild.selector" (dict "root" $ "name" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fonoster-rebuild.selector" (dict "root" $ "name" "dashboard") | nindent 8 }}
    spec:
      containers:
        - name: dashboard
          image: "{{ $d.image.repository }}:{{ $d.image.tag }}"
          imagePullPolicy: {{ $d.image.pullPolicy }}
          env:
            # The API as the browser reaches it (Envoy's public address).
            - { name: DASHBOARD_API_URL, value: {{ $d.publicApiUrl | quote }} }
          ports:
            - { name: http, containerPort: 3030 }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            {{- toYaml $d.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fonoster-rebuild.selector" (dict "root" $ "name" "dashboard") | nindent 4 }}
  ports:
    - { name: http, port: 3030, targetPort: http }
{{- end }}
