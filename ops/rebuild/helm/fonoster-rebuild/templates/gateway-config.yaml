{{- if .Values.gateway.enabled }}
{{- $cfg := tpl (toYaml .Values.gateway.config) . | fromYaml }}
{{- $_ := set $cfg "nats" (merge (default (dict) $cfg.nats) (dict "url" (include "fonoster-rebuild.natsUrl" .))) }}
{{- /* The media node sends RTP to this pod's IP unless rtp.advertiseHost is set. */}}
{{- $_ := set $cfg "rtp" (merge (default (dict) $cfg.rtp) (dict "host" "0.0.0.0" "advertiseHostEnv" "POD_IP")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
data:
  gateway.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
