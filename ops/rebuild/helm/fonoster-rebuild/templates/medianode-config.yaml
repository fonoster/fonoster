{{- if .Values.medianode.enabled }}
{{- $m := .Values.medianode }}
{{- /* The media node reads only this file and its flags (no MEDIANODE_* variables). Values the pod
knows at start are ${VAR} placeholders the node fills from the env the StatefulSet sets: POD_NAME,
HOST_IP and ROUTR_PEER_PASSWORD. */}}
{{- $sipAdvertise := ternary "${HOST_IP}" $m.sip.advertise (eq $m.sip.advertise "hostIP") }}
{{- $rtpAdvertise := ternary "${HOST_IP}" $m.rtp.advertise (eq $m.rtp.advertise "hostIP") }}
{{- $cfg := dict "nodeId" "${POD_NAME}" }}
{{- $_ := set $cfg "nats" (include "fonoster-rebuild.natsConfig" (dict "root" $ "user" "medianode") | fromYaml) }}
{{- $_ := set $cfg "sip" (dict "listen" $m.sip.listen "advertise" $sipAdvertise) }}
{{- $_ := set $cfg "rtp" (dict "host" "0.0.0.0" "advertise" $rtpAdvertise "portMin" ($m.rtp.portMin | int) "portMax" ($m.rtp.portMax | int)) }}
{{- $_ := set $cfg "registration" (dict "registrar" $m.routr.registrar "domain" $m.routr.domain "username" ($m.routr.username | default "${POD_NAME}") "password" "${ROUTR_PEER_PASSWORD:-}") }}
{{- $_ := set $cfg "outboundProxy" $m.routr.outboundProxy }}
{{- if $m.tls.enabled }}
{{- /* SIP over TLS toward the edge; with mutual, Routr must present a certificate signed by ca.crt
(add-platform 4.2). The trusted-source allowlist still applies. */}}
{{- $tls := dict "listen" $m.tls.listen "cert" "/etc/medianode/tls/tls.crt" "key" "/etc/medianode/tls/tls.key" "ca" "/etc/medianode/tls/ca.crt" }}
{{- if $m.tls.mutual }}{{- $_ := set $tls "clientCa" "/etc/medianode/tls/ca.crt" }}{{- end }}
{{- $_ := set $cfg "tls" $tls }}
{{- end }}
{{- if $m.trustedSources }}
{{- $sources := list }}
{{- range splitList "," $m.trustedSources }}{{- if trim . }}{{- $sources = append $sources (trim .) }}{{- end }}{{- end }}
{{- $_ := set $cfg "trustedSources" $sources }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-medianode
  labels:
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
data:
  medianode.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
