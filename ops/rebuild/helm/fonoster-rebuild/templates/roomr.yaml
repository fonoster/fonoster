{{- if .Values.roomr.enabled }}
{{- $m := .Values.roomr }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-roomr
  labels:
    app.kubernetes.io/name: roomr
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-roomr
  replicas: {{ $m.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: roomr
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roomr
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/roomr-config.yaml") . | sha256sum }}
    spec:
      hostNetwork: {{ $m.hostNetwork }}
      {{- if $m.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      # The node drains for drainGraceSeconds after SIGTERM (roomr.yaml's drainWait); the pod's
      # grace period is that plus a margin, so the kubelet never kills a pod that is still draining.
      terminationGracePeriodSeconds: {{ add $m.drainGraceSeconds 30 }}
      containers:
        - name: roomr
          image: "{{ $m.image.repository }}:{{ $m.image.tag }}"
          imagePullPolicy: {{ $m.image.pullPolicy }}
          # The node's only flag is -config; the default is /config/roomr.yaml (mounted below).
          env:
            # Filled into roomr.yaml's ${VAR} placeholders (roomr-config.yaml).
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: ROUTR_PEER_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $m.routr.passwordSecret | quote }}, key: password, optional: true } }
            {{- include "fonoster-rebuild.natsPasswordEnv" (dict "root" $ "user" "roomr") | nindent 12 }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ include "fonoster-rebuild.otlpEndpoint" . | quote }} }
            - { name: OTEL_SERVICE_NAME, value: fonoster-roomr }
            {{- include "fonoster-rebuild.otlpExtraEnv" . | nindent 12 }}
          ports:
            - { name: sip-udp, containerPort: 5060, protocol: UDP }
            - { name: sip-tcp, containerPort: 5060, protocol: TCP }
            - { name: control, containerPort: {{ $m.controlPort | int }}, protocol: TCP }
            {{- if $m.tls.enabled }}
            - { name: sip-tls, containerPort: {{ (splitList ":" $m.tls.listen | last) | int }}, protocol: TCP }
            {{- end }}
          # Roomr serves the standard gRPC health service on the control port: SERVING normally,
          # NOT_SERVING from SIGTERM on (readiness fails; live rooms keep running until they end).
          startupProbe:
            grpc: { port: {{ $m.controlPort | int }} }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc: { port: {{ $m.controlPort | int }} }
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - { name: config, mountPath: /config/roomr.yaml, subPath: roomr.yaml, readOnly: true }
            {{- if $m.tls.enabled }}
            - { name: tls, mountPath: /etc/roomr/tls, readOnly: true }
            {{- end }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-roomr
      {{- if $m.tls.enabled }}
        # tls.crt, tls.key (the node's certificate) and ca.crt (the CA of the edge's certificates).
        - name: tls
          secret: { secretName: {{ $m.tls.secret | quote }} }
      {{- end }}
---
{{- if $m.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-roomr
  labels:
    app.kubernetes.io/name: roomr
    {{- include "fonoster-rebuild.labels" . | nindent 4 }}
spec:
  {{- if hasKey $m.podDisruptionBudget "maxUnavailable" }}
  maxUnavailable: {{ $m.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $m.podDisruptionBudget.minAvailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: roomr
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
