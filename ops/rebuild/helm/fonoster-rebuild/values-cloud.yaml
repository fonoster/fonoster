# The whole platform in one release: control plane (apiserver with embedded Identity, Envoy,
# dashboard, hosted Autopilot), NATS, dev-grade Postgres and MinIO, appbridge and Roomr nodes. It
# mirrors ops/rebuild/compose.yaml. Routr and RTPEngine come from their own charts (Routr at
# `routr`, using this release's Postgres database `routr` and NATS).
#
#   helm install fonoster ops/rebuild/helm/fonoster-rebuild -f ops/rebuild/helm/fonoster-rebuild/values-cloud.yaml
#
# No secret is in this file: every one is a secret:// reference (D8) to a Secret you create first
# (docs/operators/rebuild.md, "Helm"):
#   fonoster-db            url, identityUrl, key        (database URLs, encryption key)
#   fonoster-postgres      password                     (postgres.deploy)
#   fonoster-minio         rootUser, rootPassword       (minio.deploy; also the record store keys)
#   fonoster-identity-keys private.pem, public.pem      (Identity's RSA pair)
#   fonoster-autopilot     secret                       (Autopilot apps' signing secret)
#   roomr-peer         password                     (the Roomr nodes' Routr peer)
#   fonoster-records-key   records.pem                  (EC P-256 key that signs call records)
#   fonoster-vendors       deepgram                     (platform Deepgram key: TTS and STT)
#   fonoster-nats-users    apiserver, appbridge, roomr, routr   (NATS passwords, hex; Routr's
#                          NATS URL is nats://routr:<routr password>@fonoster-nats:4222)

nats:
  deploy: true
  # One user per service, limited to its subjects (add-platform 4.1).
  auth: { enabled: true }

postgres:
  deploy: true

minio:
  deploy: true

apiserver:
  enabled: true
  secretMounts: [fonoster-db, fonoster-apiserver, fonoster-autopilot, roomr-peer, fonoster-minio]
  config:
    domain: fonoster.local
    server: { bindAddr: 0.0.0.0:50051, httpBridgePort: 9876, host: "{{ .Release.Name }}-apiserver" }
    logs: { level: info, format: json, transport: console }
    database: { url: "secret://k8s/fonoster-db#url" }
    encryption: { key: "secret://k8s/fonoster-db#key" }
    features:
      # Every edition offers password; Cloud adds the emailed code. Add github once the GitHub app is configured.
      auth: { methods: [password, email_code], signup: invite }
    routr:
      apiEndpoint: routr:51907
      roomrPeer:
        aor: "sip:roomr@default"
        username: roomr
        password: "secret://k8s/roomr-peer#password"
    apps:
      autopilotUrl: "ws://{{ .Release.Name }}-autopilot:3000"
      autopilotSigningSecret: "secret://k8s/fonoster-autopilot#secret"
    callRecords:
      enabled: true
      stores:
        - s3:
            bucket: records
            endpoint: "http://{{ .Release.Name }}-minio:9000"
            forcePathStyle: true
            credentials:
              accessKeyId: "secret://k8s/fonoster-minio#rootUser"
              secretAccessKey: "secret://k8s/fonoster-minio#rootPassword"
    identity:
      database: { url: "secret://k8s/fonoster-db#identityUrl" }
      audience: api
      keys: { privateKeyPath: /opt/fonoster/keys/private.pem, publicKeyPath: /opt/fonoster/keys/public.pem }

dashboard:
  enabled: true
  # Envoy's public URL as browsers reach it (port-forward: http://localhost:8449).
  publicApiUrl: http://localhost:8449

envoy:
  enabled: true

autopilot:
  enabled: true
  secret: fonoster-autopilot
  databaseSecret: fonoster-db
  config:
    host: 0.0.0.0
    port: 3000
    signingSecret: { env: AUTOPILOT_SIGNING_SECRET }
    # apiserver.config.apps.autopilotUrl.
    publicUrl: "ws://{{ .Release.Name }}-autopilot:3000"
    agents: { source: database }
    registry: { source: database }
    # Workspaces bring their own LLM keys (dashboard). A platform key instead:
    #   credentials: { openai: { value: "secret://k8s/fonoster-vendors#openai" } }
    # with fonoster-vendors in autopilot.secretMounts.
    # cellSecrets: null drops the private-cell default (Helm merges maps).
    workspaceSecrets: { source: database, cellSecrets: null }
    database: { url: "${APISERVER_DATABASE_URL}" }
    encryption: { key: "${APISERVER_ENCRYPTION_KEY}" }

appbridge:
  secretMounts: [fonoster-db, fonoster-minio, fonoster-records-key, fonoster-vendors]
  databaseSecret: fonoster-db
  config:
    providers:
      deepgram:
        adapter: deepgram
        capabilities: [tts, stt]
        credential: { value: "secret://k8s/fonoster-vendors#deepgram" }
    stt: { provider: deepgram }
    database:
      url: "secret://k8s/fonoster-db#url"
    encryption: { key: "${APISERVER_ENCRYPTION_KEY}" }
    appStore: { source: database }
    registry: { source: database }
    workspaceKeys: { enabled: true }
    webhooks: { enabled: true }
    callRecord:
      dir: /var/lib/fonoster/records
      region: default
      signingKey: { kid: k1, privateKeyFile: /var/run/fonoster/secrets/fonoster-records-key/records.pem }
      store:
        s3:
          bucket: records
          endpoint: "http://{{ .Release.Name }}-minio:9000"
          forcePathStyle: true
          credentials:
            accessKeyId: "secret://k8s/fonoster-minio#rootUser"
            secretAccessKey: "secret://k8s/fonoster-minio#rootPassword"
      recording: "off"

roomr:
  routr:
    registrar: routr:5060
    domain: default
    username: roomr
    outboundProxy: routr:5060
    passwordSecret: roomr-peer
