# NATS subject permissions of one Fonoster service (add-platform 4.1, build log HD-B1). The
# main NATS (../nats.conf), a private region.s NATS (ops/bundle/config/region/nats.conf) and the Helm
# chart (files/nats-permissions/, copies the deployment suite keeps equal) include the files of
# the services they serve. Each service receives replies only under its own inbox prefix,
# `_INBOX_<user>.>`, which its NATS clients set (no service may read another's replies);
# allow_responses lets it answer requests it received. The session registry is the JetStream KV
# bucket fonoster_sessions (stream KV_fonoster_sessions); the "session registry" lines open it
# (bind or create) and read it.

# billing (Fonoster Cloud only, add-billing-service): rates stored usage from its durable consumer
# on FONOSTER_USAGE_RECORDED (the apiserver publishes it) and counts owners' active calls by
# watching calls.* in the session registry, read only. Not included by any nats.conf yet: Cloud
# adds the billing user where it runs the service.
BILLING_PERMISSIONS = {
  publish = {
    allow = [
      "$JS.API.INFO"
      # stored usage: the work-queue stream and the billing-usage durable consumer
      "$JS.API.STREAM.INFO.FONOSTER_USAGE_RECORDED"
      "$JS.API.STREAM.CREATE.FONOSTER_USAGE_RECORDED"
      "$JS.API.CONSUMER.CREATE.FONOSTER_USAGE_RECORDED.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.FONOSTER_USAGE_RECORDED.>"
      "$JS.API.CONSUMER.INFO.FONOSTER_USAGE_RECORDED.billing-usage"
      "$JS.API.CONSUMER.MSG.NEXT.FONOSTER_USAGE_RECORDED.billing-usage"
      "$JS.ACK.FONOSTER_USAGE_RECORDED.>"
      # session registry, read only (watching calls.*)
      "$JS.API.STREAM.INFO.KV_fonoster_sessions"
      "$JS.API.STREAM.CREATE.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.INFO.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.DELETE.KV_fonoster_sessions.>"
      "$JS.FC.KV_fonoster_sessions.>"
    ]
  }
  subscribe = {
    allow = [
      "_INBOX_billing.>"
    ]
  }
  allow_responses = true
}
