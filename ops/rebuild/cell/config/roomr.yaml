# roomr.yaml: the cell's media node (one YAML, flags win; it reads no ROOMR_* variables of
# its own). Each ${NAME} is filled from the container environment compose.yaml sets.
nodeId: "${ROOMR_ID:-node-a}"
nats: { url: "nats://nats:4222", user: roomr, password: "secret://env/NATS_ROOMR_PASSWORD" }
sip:
  listen: "0.0.0.0:5060"
  advertise: "${ROOMR_ADVERTISE}"
  # Register as the peer the region agent creates in this cell's Routr; Routr's least-sessions
  # balancer reads X-Session-Count. Dialed calls go out as the same peer.
  registrations:
    - registrar: routr:5060
      aor: sip:medianode@default
      expires: 30s
      auth: { username: medianode, password: "${ROOMR_PASSWORD}" }
      headers: { X-Session-Count: "{sessions}" }
rtp:
  host: 0.0.0.0
  advertise: "${ROOMR_ADVERTISE}"
  portMin: "${ROOMR_RTP_PORT_MIN}"
  portMax: "${ROOMR_RTP_PORT_MAX}"
outboundProxy: routr:5060
# INVITEs only from the cell's Routr.
trustedSources: ["${ROOMR_TRUSTED_SOURCE}"]
telemetry: { otlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" }
