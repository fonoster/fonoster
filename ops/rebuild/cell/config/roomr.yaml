# roomr.yaml: the cell's Roomr node (one YAML, its only configuration; it reads no ROOMR_*
# variables of its own). Each ${NAME} is filled from the container environment compose.yaml sets.
nodeId: "${ROOMR_ID:-node-a}"
nats: { url: "nats://nats:4222", user: roomr, password: "secret://env/NATS_ROOMR_PASSWORD" }
sip:
  listen: "0.0.0.0:5060"
  advertise: "${ROOMR_ADVERTISE}"
  # Register as the peer the region agent creates in this cell's Routr; Routr's least-sessions
  # balancer reads X-Session-Count.
  registrations:
    - registrar: routr:5060
      aor: sip:roomr@default
      expires: 30s
      auth: { username: roomr, password: "${ROOMR_PASSWORD}" }
      headers: { X-Session-Count: "{sessions}" }
  # Routr's X-Call-Ref names inbound calls; the control plane sends it on dialed calls too.
  callRefHeader: X-Call-Ref
  # Dialed calls go to Routr unless CreateCall names another proxy (the transport lives in the
  # URI: sip:routr:5060;transport=tcp).
  outboundProxy: sip:routr:5060
rtp:
  host: 0.0.0.0
  advertise: "${ROOMR_ADVERTISE}"
  portMin: "${ROOMR_RTP_PORT_MIN}"
  portMax: "${ROOMR_RTP_PORT_MAX}"
# Each call's control stream goes to AppBridge's session endpoint.
sessionEndpoint: "appbridge:50071"
# On SIGTERM: unregister, node.down, then wait this long for live rooms (stop_grace_period is
# longer).
drainWait: 10m
telemetry: { otlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" }
