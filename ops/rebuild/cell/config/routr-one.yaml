# routr-one.yaml: the cell's Routr, mounted at /etc/routr/one.yaml. Each ${NAME} is filled from the
# container environment compose.yaml sets.
kind: RoutrOne
apiVersion: v2beta1
ref: routr-one
spec:
  database:
    url: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/routr
    startInternal: false
  signaling:
    externalAddrs: ["${ROUTR_EXTERNAL_ADDRS:-127.0.0.1}"]
    publishers:
      nats:
        enabled: true
        url: nats://routr:${NATS_ROUTR_PASSWORD}@nats:4222
  rtprelay:
    host: ${RB_RTPENGINE_HOST:-rtpengine}
