# The cell's own NATS (add-private-regions): local traffic stays here; `region.<ref>.>` reaches the
# control plane over one outbound leaf link. leaf.conf is written by `fonoster-regions enroll`
# into the `region` volume, so enroll before starting NATS.
port: 4222
http_port: 8222
jetstream {
  store_dir: /data
}
include ./region/leaf.conf
