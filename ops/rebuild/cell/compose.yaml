# A region's cell (add-private-regions; operator guide: docs/operators/private-region.md). The same
# install serves a private region (a user's, for any of their workspaces that picked it) and a
# public region (enrolled by an operator, PR-13). Everything that touches calls runs here; the only
# link to Fonoster is the NATS leaf connection, outbound only, carrying `region.<ref>.>`. Provider
# keys and call content never leave the cell. The region's SIP domain needs wildcard DNS
# (`*.<sipDomain>`) pointing here and a TLS certificate for it (PR-16).
#
#   1. cp ops/rebuild/cell/cell.env.example ops/rebuild/cell/.env   (fill in the secrets)
#   2. docker compose -f ops/rebuild/cell/compose.yaml run --rm --no-deps region-agent enroll <token>
#   3. docker compose -f ops/rebuild/cell/compose.yaml run --rm --no-deps region-agent secrets set deepgram
#   4. docker compose -f ops/rebuild/cell/compose.yaml up -d
#
# The ${VAR} values come from ops/rebuild/cell/.env (Compose reads it next to this file).
name: ${COMPOSE_PROJECT_NAME:-fonoster-cell}

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}

# The cell's database (the apiserver schema; the agent migrates it) and the secret-store key.
x-cell-db: &cell-db
  APISERVER_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/fonoster
  APISERVER_ENCRYPTION_KEY: ${CELL_ENCRYPTION_KEY:?set CELL_ENCRYPTION_KEY}
  FONOSTER_REGION_SECRETS_KEY: ${FONOSTER_REGION_SECRETS_KEY:?set FONOSTER_REGION_SECRETS_KEY}

networks:
  default:
    ipam:
      config:
        - subnet: ${RB_NET:-10.216.17}.0/24
          ip_range: ${RB_NET:-10.216.17}.128/25

services:
  # The cell's NATS: local subjects plus the leaf remote `enroll` wrote (region volume).
  nats:
    image: nats:2.11.8-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    # One NATS user per service (add-platform 4.1); each service gets its password below.
    environment:
      NATS_APPBRIDGE_PASSWORD: ${NATS_APPBRIDGE_PASSWORD:?set NATS_APPBRIDGE_PASSWORD}
      NATS_ROOMR_PASSWORD: ${NATS_ROOMR_PASSWORD:?set NATS_ROOMR_PASSWORD}
      NATS_ROUTR_PASSWORD: ${NATS_ROUTR_PASSWORD:?set NATS_ROUTR_PASSWORD}
      NATS_REGION_AGENT_PASSWORD: ${NATS_REGION_AGENT_PASSWORD:?set NATS_REGION_AGENT_PASSWORD}
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - ../config/nats-permissions:/etc/nats/nats-permissions:ro
      - region:/etc/nats/region:ro
      - nats:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: routr
    volumes:
      - db:/var/lib/postgresql/data
      - ../config/postgres-init.sql:/docker-entrypoint-initdb.d/10-fonoster.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d routr"]
      interval: 5s
      timeout: 3s
      retries: 10

  routr:
    image: fonoster/routr-one:2.19.0
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/routr
      EXTERNAL_ADDRS: ${ROUTR_EXTERNAL_ADDRS:-127.0.0.1}
      LOCALNETS: ${ROUTR_LOCALNETS:-}
      NATS_PUBLISHER_ENABLED: "true"
      # Hex passwords only: the password sits in the URL (Routr's NATS client reads user info).
      NATS_PUBLISHER_URL: nats://routr:${NATS_ROUTR_PASSWORD}@nats:4222
      RTPENGINE_HOST: ${RB_RTPENGINE_HOST-rtpengine}
      START_INTERNAL_DB: "false"
      CONFIG_PATH: /etc/routr/stack/edgeport.yaml
    volumes:
      - ../config/routr-edgeport.yaml:/etc/routr/stack/edgeport.yaml:ro
    ports:
      - "${RB_SIP_PORT:-5060}:5060/udp"
      - "${RB_SIP_PORT:-5060}:5060/tcp"
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.17}.40

  rtpengine:
    image: fonoster/rtpengine:0.3.17
    restart: unless-stopped
    platform: linux/x86_64
    environment:
      PORT_MIN: ${RTPENGINE_PORT_MIN:-10000}
      PORT_MAX: ${RTPENGINE_PORT_MAX:-10100}
      PUBLIC_IP: ${RTPENGINE_PUBLIC_IP:-${ROUTR_EXTERNAL_ADDRS:-127.0.0.1}}
    ports:
      - "${RTPENGINE_PORT_MIN:-10000}-${RTPENGINE_PORT_MAX:-10100}:${RTPENGINE_PORT_MIN:-10000}-${RTPENGINE_PORT_MAX:-10100}/udp"
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.17}.41

  # Roomr is released from fonoster/roomr: the bundle's pinned image, not built here.
  roomr:
    image: fonoster/roomr:0.2.5@sha256:da1497a93872bf5bbba74a32b0784e4495a5afb6b4f69e8b1885a7c32c298a84
    restart: unless-stopped
    stop_grace_period: ${RB_DRAIN_GRACE:-11m}
    depends_on:
      nats: { condition: service_healthy }
    environment:
      <<: *otel
      # The ${NAME}s in config/roomr.yaml.
      ROOMR_ID: ${RB_NODE_ID:-node-a}
      NATS_ROOMR_PASSWORD: ${NATS_ROOMR_PASSWORD}
      ROOMR_ADVERTISE: ${RB_NODE_ADVERTISE:-${RB_NET:-10.216.17}.42}
      ROOMR_RTP_PORT_MIN: ${RB_NODE_RTP_MIN:-30000}
      ROOMR_RTP_PORT_MAX: ${RB_NODE_RTP_MAX:-30199}
      ROOMR_PASSWORD: ${RB_NODE_PASSWORD:?set RB_NODE_PASSWORD}
    volumes:
      - ./config/roomr.yaml:/config/roomr.yaml:ro
    ports:
      - "${RB_NODE_RTP_MIN:-30000}-${RB_NODE_RTP_MAX:-30199}:${RB_NODE_RTP_MIN:-30000}-${RB_NODE_RTP_MAX:-30199}/udp"
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.17}.42

  appbridge:
    build:
      context: ../../..
      dockerfile: mods/appbridge/Dockerfile
    image: ${RB_REGISTRY:-fonoster}/appbridge:${RB_TAG:-dev}
    restart: unless-stopped
    depends_on:
      nats: { condition: service_healthy }
      region-agent: { condition: service_started }
    environment:
      <<: [*otel, *cell-db]
      NATS_APPBRIDGE_PASSWORD: ${NATS_APPBRIDGE_PASSWORD}
      # The call-record store (MinIO), through the AWS SDK's default credential chain.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/appbridge.yaml:/etc/fonoster/appbridge.yaml:ro
      - ${CELL_KEYS_DIR:-./.local/keys}:/etc/fonoster/keys:ro
      - secrets:/var/lib/fonoster-secrets:ro
      # Call records in flight (config/appbridge.yaml callRecord.dir), kept across recreation.
      - records:/var/lib/fonoster/records
    # Ready = the Session port (50071, roomr.yaml's sessionEndpoint) answers SERVING;
    # NOT_SERVING while draining after SIGTERM.
    healthcheck:
      test: ["CMD", "node", "/work/mods/appbridge/dist/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: ${RB_DRAIN_GRACE:-11m}
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.17}.43

  # The cell's own hosted Autopilot (PR-9): Autopilot apps synced to this cell point here.
  autopilot:
    build:
      context: ../../..
      dockerfile: mods/autopilot/Dockerfile
    image: ${RB_REGISTRY:-fonoster}/autopilot:${RB_TAG:-dev}
    restart: unless-stopped
    depends_on:
      region-agent: { condition: service_started }
    environment:
      <<: [*otel, *cell-db]
      AUTOPILOT_SIGNING_SECRET: ${AUTOPILOT_SIGNING_SECRET:?set AUTOPILOT_SIGNING_SECRET}
    volumes:
      - ./config/autopilot-session.yaml:/etc/fonoster/autopilot-session.yaml:ro
      - secrets:/var/lib/fonoster-secrets:ro
    expose:
      - 3000

  minio:
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: records
    volumes:
      - minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The region agent: `run` (default) migrates the cell database and syncs; `enroll <token>` and
  # `secrets …` are one-off commands (docker compose run --rm --no-deps region-agent …).
  region-agent:
    build:
      context: ../../..
      dockerfile: ops/rebuild/docker/region-agent.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/region-agent:${RB_TAG:-dev}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      routr: { condition: service_started }
      minio: { condition: service_healthy }
    environment:
      <<: *cell-db
      NATS_REGION_AGENT_PASSWORD: ${NATS_REGION_AGENT_PASSWORD}
      FONOSTER_REGION_SECRETS_FILE: /var/lib/fonoster-secrets/secrets.enc
      AUTOPILOT_SIGNING_SECRET: ${AUTOPILOT_SIGNING_SECRET:?set AUTOPILOT_SIGNING_SECRET}
      RB_NODE_PASSWORD: ${RB_NODE_PASSWORD:?set RB_NODE_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # The cell's public connection details (region.endpoints), from the same settings Routr and
      # RTPEngine use; override them in region-agent.yaml `endpoints`.
      EXTERNAL_ADDRS: ${ROUTR_EXTERNAL_ADDRS:-127.0.0.1}
      RB_SIP_PORT: ${RB_SIP_PORT:-5060}
      RTPENGINE_PUBLIC_IP: ${RTPENGINE_PUBLIC_IP:-${ROUTR_EXTERNAL_ADDRS:-127.0.0.1}}
      RTPENGINE_PORT_MIN: ${RTPENGINE_PORT_MIN:-10000}
      RTPENGINE_PORT_MAX: ${RTPENGINE_PORT_MAX:-10100}
      # For a local control plane on plain nats:// and http:// (testing only).
      FONOSTER_REGION_ALLOW_INSECURE: ${FONOSTER_REGION_ALLOW_INSECURE:-}
      # A control plane that serves its generated certificate (the local stack, an install getting
      # started): copy its ca.pem into the keys folder and set this to /etc/fonoster/keys/ca.pem.
      FONOSTER_CA_FILE: ${FONOSTER_CA_FILE:-}
    volumes:
      - ./config/region-agent.yaml:/etc/fonoster/region-agent.yaml:ro
      - ${CELL_KEYS_DIR:-./.local/keys}:/etc/fonoster/keys:ro
      - region:/var/lib/fonoster-region
      - secrets:/var/lib/fonoster-secrets

volumes:
  db:
  nats:
  minio:
  # Written by `enroll`: region.json, leaf.creds, leaf.conf, cell.key, state.json (0600).
  region:
  # The cell's encrypted secret store.
  secrets:
  # AppBridge's call records in flight.
  records:
