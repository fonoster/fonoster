# The development layer on the self-host bundle (add-self-host-installer D6). ops/bundle/compose.yaml
# is the one Compose source; this override only adds what a checkout needs: images built from
# source, the fake providers, the SIP caller bot, the region hub and AppBridge's HTTP port. The
# stack's overlays name a few more ${NAME}s (vendor keys, the leaf port); each service below gets
# only its own, added to the bundle's per-service `environment:`. `ops/rebuild/stack up`
# (docs/try-the-new-platform.md) generates the secrets into ops/rebuild/.local, renders the
# service configs from ops/bundle/config/*.example.* and runs
#
#   docker compose --project-directory ops/rebuild \
#     -f ops/bundle/compose.yaml -f ops/rebuild/compose.yaml \
#     --env-file .local/stack.env --env-file .local/host.env --env-file .local/bundle.env ...
#
# Relative paths below resolve from ops/rebuild (the project directory). Host ports are in the
# 16000 range (stack.defaults), so the stack runs next to a self-hosted install.
#
#   Profiles added: `fakes` (fake TTS/STT/LLM, no vendor keys), `tools` (the SIP caller bot),
#   `regions` (the region hub), `billing` (Fonoster Cloud's billing service with the Stripe fake;
#   not in the default profiles).
services:
  # The billing user (nats-permissions/billing.conf), added to nats.conf with the billing profile.
  nats:
    environment:
      NATS_BILLING_PASSWORD: ${NATS_BILLING_PASSWORD:-}

  # Roomr is released from fonoster/roomr: the bundle's pinned image, not built here.
  roomr:
    image: fonoster/roomr:0.2.7@sha256:4bd9d5b8f480488322229e06aaaa9a9789a25fca38fe1dc48f81d1a1d8f897db

  appbridge:
    build:
      context: ../..
      dockerfile: mods/appbridge/Dockerfile
    image: ${RB_REGISTRY:-fonoster}/appbridge:${RB_TAG:-dev}
    # Speech vendor keys named by the stack's AppBridge overlay (empty: no platform key).
    environment:
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AICOUSTICS_LICENSE_KEY: ${AICOUSTICS_LICENSE_KEY:-}
    ports:
      - "${RB_APPBRIDGE_PORT:-8080}:8080"

  autopilot:
    build:
      context: ../..
      dockerfile: mods/autopilot/Dockerfile
    image: ${RB_REGISTRY:-fonoster}/autopilot:${RB_TAG:-dev}
    # Language-model keys named by the stack's Autopilot overlay (empty: no platform key).
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  apiserver:
    build:
      context: ../..
      dockerfile: ops/rebuild/docker/apiserver.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/apiserver:${RB_TAG:-dev}
    # The fake providers' catalog, applied with the fakes profile (the stack's fonoster.yaml).
    volumes:
      - ../../mods/conformance/fakes.catalog.yaml:/etc/fonoster/catalog.fakes.yaml:ro
    # The region hub's leaf port and the API's HTTPS port, named by the stack's API server overlay
    # (regions.controlPlaneUrl).
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      LEAF_PORT: ${LEAF_PORT:-7422}
    # One name for the fake OAuth2 provider that the browser (loopback, *.localhost) and identity
    # (the host gateway) both reach on the published port: identity.oauth2.github.url in a local
    # overlay is http://fake-oauth2.localhost:${RB_FAKES_OAUTH2_PORT}.
    extra_hosts:
      - "fake-oauth2.localhost:host-gateway"
    depends_on:
      nats-regions: { condition: service_healthy, required: false }

  # ---- profile `regions`: the region hub private regions link to (the bundle leaves it out; see
  # docs for hosting private regions). `stack up` generates config/region-hub.conf. ----
  nats-regions:
    image: nats:2.11.8-alpine
    profiles: [regions]
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "${LEAF_BIND:-0.0.0.0}:${RB_LEAF_PORT:-7422}:7422"
    volumes:
      - ${CONFIG_DIR:-./config}/region-hub.conf:/etc/nats/nats.conf:ro
      - nats-regions:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: ../..
      dockerfile: ops/rebuild/docker/dashboard.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/dashboard:${RB_TAG:-dev}

  # ---- profile `fakes`: fake TTS (:7001), STT (:7002) and LLM (:7003) ----
  fakes:
    profiles: ["fakes"]
    build:
      context: ../..
      dockerfile: ops/rebuild/docker/fakes.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/fakes:${RB_TAG:-dev}
    restart: unless-stopped
    expose:
      - 7001
      - 7002
      - 7003
    # The fake OAuth2 provider's authorize page is opened by the browser on the host; identity
    # reaches the same address (http://fake-oauth2.localhost:<RB_FAKES_OAUTH2_PORT>) from inside the
    # stack through the apiserver's extra_hosts.
    ports:
      - "${RB_FAKES_OAUTH2_PORT:-16704}:7004"

  # ---- profiles `fakes` and `billing`: the Stripe fake (API, /_fake control API and viewer on
  # :12111). With billing, it sends Stripe's webhooks to the billing service. ----
  stripe-fake:
    profiles: ["fakes", "billing"]
    build:
      context: ../..
      dockerfile: ops/rebuild/docker/stripe-fake.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/stripe-fake:${RB_TAG:-dev}
    restart: unless-stopped
    environment:
      STRIPE_FAKE_WEBHOOKS: "http://billing:50072/stripe/webhooks|${BILLING_WEBHOOK_SECRET:-whsec_stack}"
    ports:
      - "${RB_STRIPE_FAKE_PORT:-12111}:12111"

  # ---- profile `billing`: Fonoster Cloud's billing service (add-billing-service; Cloud only, so not
  # in the bundle). Admission for AppBridge and the apiserver (:50071), Stripe's webhooks (:50072),
  # the Billing API (:50073). Its tables live in the fonoster database, schema `billing`. The stack
  # renders config/billing.yaml. ----
  billing:
    profiles: ["billing"]
    build:
      context: ../..
      dockerfile: ops/rebuild/docker/billing.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/billing:${RB_TAG:-dev}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      stripe-fake: { condition: service_started }
    environment:
      BILLING_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fonoster?schema=billing
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run fonoster-config init}
      NATS_BILLING_PASSWORD: ${NATS_BILLING_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run fonoster-config init}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-whsec_stack}
    volumes:
      - ${CONFIG_DIR:-./config}/billing.yaml:/etc/fonoster/billing.yaml:ro
      - ${CONFIG_DIR:-./config}/rate-cards:/etc/fonoster/rate-cards:ro
    expose:
      - 50071
      - 50072
      - 50073

  # ---- profile `tools`: the SIP caller bot (fonoster/roomr's cmd/sipcaller), HTTP on RB_CALLER_PORT ----
  sipcaller:
    profiles: ["tools"]
    image: fonoster/roomr:0.2.7@sha256:4bd9d5b8f480488322229e06aaaa9a9789a25fca38fe1dc48f81d1a1d8f897db
    entrypoint: ["/sipcaller"]
    command: ["-listen", "0.0.0.0:8080", "-host", "${SUBNET_PREFIX}.44"]
    restart: unless-stopped
    ports:
      - "${RB_CALLER_PORT:-8081}:8080"
    networks:
      default:
        ipv4_address: ${SUBNET_PREFIX}.44

volumes:
  nats-regions:
