# Fonoster rebuild stack (add-platform). Operator guide: docs/operators/rebuild.md. To try it on
# your machine, use `ops/rebuild/stack up` (docs/try-the-new-platform.md): it generates configs,
# keys and secrets into ops/rebuild/.local and runs this file with them.
#
#   Data plane:    NATS, Postgres, Routr, RTPEngine, the media node, the VoiceSessionGateway, MinIO,
#                  and (profile `autopilot`) the hosted Autopilot session engine.
#   Control plane: the apiserver (with its embedded Identity), Envoy and the dashboard.
#   Profiles:      `autopilot`, `fakes` (fake TTS/STT/LLM, no vendor keys), `tools` (the SIP caller
#                  bot), `observability` (OTel collector, Prometheus, Loki, Tempo, Grafana).
#
#   docker compose -f ops/rebuild/compose.yaml --profile autopilot up -d --build
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 \
#     docker compose -f ops/rebuild/compose.yaml --profile observability up -d
#
# Fonoster services read one YAML file each (RB_CONFIG_DIR, default ./config) and never a .env file
# (PL5). The ${VAR:-default} values below are Compose-level knobs (host ports, image tags, ranges,
# addresses), plus the few secrets a container takes from its environment by name.
name: ${COMPOSE_PROJECT_NAME:-fonoster-rebuild}

x-otel: &otel
  # Empty means off: services serve normally and log locally. Set it to any OTLP/HTTP endpoint.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

# One network with fixed addresses for the SIP and RTP parties (SDP needs addresses, not names).
# Dynamic addresses come from the upper half, so they never take a fixed one.
networks:
  default:
    ipam:
      config:
        - subnet: ${RB_NET:-10.216.16}.0/24
          ip_range: ${RB_NET:-10.216.16}.128/25

services:
  nats:
    image: nats:2.11.8-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    # Host-only by default: NATS has no per-service users yet (RV-B6); RB_NATS_BIND=0.0.0.0 opts in.
    ports:
      - "${RB_NATS_BIND:-127.0.0.1}:${RB_NATS_PORT:-4222}:4222"
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - nats:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The region hub (add-private-regions, profile `regions`): NATS in operator mode where private
  # cells link over an outbound leaf node, each scoped to region.<ref>.>. Its config (operator and
  # accounts) is generated by `fonoster-region-hub-setup`; the main NATS above is unchanged.
  nats-regions:
    image: nats:2.11.8-alpine
    profiles: [regions]
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "${RB_LEAF_BIND:-0.0.0.0}:${RB_LEAF_PORT:-7422}:7422"
    volumes:
      - ${RB_CONFIG_DIR:-./config}/region-hub.conf:/etc/nats/nats.conf:ro
      - nats-regions:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Routr's database (routr), the apiserver's (fonoster) and Identity's (fnidentity).
  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      PGTZ: UTC
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: routr
    volumes:
      - db:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/10-fonoster.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d routr"]
      interval: 5s
      timeout: 3s
      retries: 10

  routr:
    image: fonoster/routr-one:2.15.1
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/routr
      # The address Routr writes in Via and Record-Route for parties outside LOCALNETS: one that
      # carriers and softphones reach (on a laptop, its LAN address).
      EXTERNAL_ADDRS: ${ROUTR_EXTERNAL_ADDRS:-127.0.0.1}
      LOCALNETS: ${ROUTR_LOCALNETS:-}
      LOGS_LEVEL: ${ROUTR_LOGS_LEVEL:-info}
      NATS_PUBLISHER_ENABLED: "true"
      NATS_PUBLISHER_URL: nats://nats:4222
      # Set it empty for no media anchoring (RTP then flows directly between the parties).
      RTPENGINE_HOST: ${RB_RTPENGINE_HOST-rtpengine}
      # A separate Postgres: the internal-DB mode stalls on an unpinned `npx prisma`.
      START_INTERNAL_DB: "false"
      # Our EdgePort (SIP on RB_SIP_INTERNAL_PORT, so Via and Record-Route carry the port the host
      # publishes); mounted aside so the image's own sed -i leaves it alone.
      CONFIG_PATH: /etc/routr/stack/edgeport.yaml
    volumes:
      - ${RB_CONFIG_DIR:-./config}/routr-edgeport.yaml:/etc/routr/stack/edgeport.yaml:ro
    ports:
      - "${RB_SIP_PORT:-5060}:${RB_SIP_INTERNAL_PORT:-5060}/udp"
      - "${RB_SIP_PORT:-5060}:${RB_SIP_INTERNAL_PORT:-5060}/tcp"
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.16}.40

  # RTPEngine needs a wide UDP range; on Linux prefer network_mode: host and drop `ports`.
  rtpengine:
    image: fonoster/rtpengine:0.3.17
    restart: unless-stopped
    platform: linux/x86_64
    environment:
      PORT_MIN: ${RTPENGINE_PORT_MIN:-10000}
      PORT_MAX: ${RTPENGINE_PORT_MAX:-10100}
      # Written in SDP for both sides of a call: an address the media node and the far end reach.
      PUBLIC_IP: ${RTPENGINE_PUBLIC_IP:-${ROUTR_EXTERNAL_ADDRS:-127.0.0.1}}
    ports:
      - "${RTPENGINE_PORT_MIN:-10000}-${RTPENGINE_PORT_MAX:-10100}:${RTPENGINE_PORT_MIN:-10000}-${RTPENGINE_PORT_MAX:-10100}/udp"
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.16}.41

  medianode:
    build:
      context: ../../go/medianode
    image: ${RB_REGISTRY:-fonoster}/medianode:${RB_TAG:-dev}
    restart: unless-stopped
    # SIGTERM drains: the node reports full and exits when its rooms end or the wait runs out.
    stop_grace_period: ${RB_DRAIN_GRACE:-10m}
    depends_on:
      nats: { condition: service_healthy }
    environment:
      <<: *otel
      MEDIANODE_ID: ${RB_NODE_ID:-node-a}
      MEDIANODE_NATS_URL: nats://nats:4222
      MEDIANODE_SIP_LISTEN: 0.0.0.0:5060
      MEDIANODE_SIP_ADVERTISE: ${RB_NODE_ADVERTISE:-${RB_NET:-10.216.16}.42}
      MEDIANODE_RTP_HOST: 0.0.0.0
      # What Routr and RTPEngine put in SDP. Behind NAT, set it to the address they reach.
      MEDIANODE_RTP_ADVERTISE: ${RB_NODE_ADVERTISE:-${RB_NET:-10.216.16}.42}
      MEDIANODE_RTP_PORT_MIN: ${RB_NODE_RTP_MIN:-30000}
      MEDIANODE_RTP_PORT_MAX: ${RB_NODE_RTP_MAX:-30199}
      # The media-node Peer the apiserver creates (routr.mediaNodePeer: sip:medianode@default).
      MEDIANODE_REGISTRAR: routr:${RB_SIP_INTERNAL_PORT:-5060}
      MEDIANODE_DOMAIN: ${RB_NODE_DOMAIN:-default}
      MEDIANODE_USERNAME: ${RB_NODE_USERNAME:-medianode}
      MEDIANODE_PASSWORD: ${RB_NODE_PASSWORD:-change-me}
      # udp: with tcp the node's REGISTER client binds the SIP port before its TCP listener (ST-B5).
      MEDIANODE_TRANSPORT: ${RB_NODE_TRANSPORT:-udp}
      MEDIANODE_REGISTER_EVERY: ${RB_NODE_REGISTER_EVERY:-15s}
      MEDIANODE_OUTBOUND_PROXY: routr:${RB_SIP_INTERNAL_PORT:-5060}
      MEDIANODE_DEBUG_ADDR: 0.0.0.0:8099
      # INVITEs (and their X-App-Ref/X-Call-Ref headers) only from Routr (RV-B7).
      MEDIANODE_TRUSTED_SOURCES: ${RB_NODE_TRUSTED_SOURCES:-${RB_NET:-10.216.16}.40}
    ports:
      - "${RB_NODE_RTP_MIN:-30000}-${RB_NODE_RTP_MAX:-30199}:${RB_NODE_RTP_MIN:-30000}-${RB_NODE_RTP_MAX:-30199}/udp"
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.16}.42

  gateway:
    build:
      context: ../..
      dockerfile: mods/gateway/Dockerfile
    image: ${RB_REGISTRY:-fonoster}/gateway:${RB_TAG:-dev}
    restart: unless-stopped
    depends_on:
      nats: { condition: service_healthy }
      apiserver: { condition: service_started }
    environment:
      <<: *otel
      # The apiserver's encryption key: app signing secrets are encrypted columns.
      APISERVER_ENCRYPTION_KEY: ${RB_ENCRYPTION_KEY:-}
      # Vendor keys, read only when gateway.yaml names them (credential.env).
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - ${RB_CONFIG_DIR:-./config}/gateway.yaml:/etc/fonoster/gateway.yaml:ro
      - ${RB_CONFIG_DIR:-./config}/keys:/etc/fonoster/keys:ro
    ports:
      - "${RB_GATEWAY_PORT:-8080}:8080"
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.16}.43

  # The hosted Autopilot session engine: the session app Autopilot-type apps point to
  # (ws://autopilot:3000). Assistants, the catalog and workspace vendor keys come from the
  # apiserver's database (autopilot-session.yaml, `source: database`).
  autopilot:
    profiles: ["autopilot"]
    build:
      context: ../..
      dockerfile: mods/autopilot/Dockerfile
    image: ${RB_REGISTRY:-fonoster}/autopilot-session:${RB_TAG:-dev}
    restart: unless-stopped
    depends_on:
      apiserver: { condition: service_started }
    environment:
      <<: *otel
      AUTOPILOT_SIGNING_SECRET: ${AUTOPILOT_SIGNING_SECRET:-change-me}
      # The control-plane database and the key that decrypts workspace vendor keys.
      APISERVER_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fonoster
      APISERVER_ENCRYPTION_KEY: ${RB_ENCRYPTION_KEY:-}
      # Platform LLM keys, read only when autopilot-session.yaml names them (credentials).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ${RB_CONFIG_DIR:-./config}/autopilot-session.yaml:/etc/fonoster/autopilot-session.yaml:ro
    expose:
      - 3000

  # MinIO's own images are no longer pullable from Docker Hub (ST-B7); Bitnami's legacy build
  # creates the call-record bucket itself (MINIO_DEFAULT_BUCKETS).
  minio:
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      # Generated into .local/stack.env by ops/rebuild/stack; no default password (RV-B6).
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD (ops/rebuild/stack generates it)}
      MINIO_DEFAULT_BUCKETS: ${RB_RECORDS_BUCKET:-records}
    # Host-only by default (RV-B6); RB_MINIO_BIND=0.0.0.0 opts in.
    ports:
      - "${RB_MINIO_BIND:-127.0.0.1}:${RB_MINIO_PORT:-9000}:9000"
      - "${RB_MINIO_BIND:-127.0.0.1}:${RB_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- control plane ----
  # The API server with its embedded Identity. The entrypoint applies the core migrations
  # (including rebuild_persistence and add_call_records) and Identity's, seeds, then serves.
  apiserver:
    build:
      context: ../..
      dockerfile: ops/rebuild/docker/apiserver.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/apiserver:${RB_TAG:-dev}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      routr: { condition: service_started }
      nats-regions: { condition: service_healthy, required: false }
    environment:
      <<: *otel
    volumes:
      - ${RB_CONFIG_DIR:-./config}/fonoster.yaml:/opt/fonoster/fonoster.yaml:ro
      - ${RB_CONFIG_DIR:-./config}/keys:/opt/fonoster/keys:ro
      - ${RB_CONFIG_DIR:-./config}/integrations.json:/opt/fonoster/integrations.json:ro
    expose:
      - 50051
      - 9876

  # gRPC, gRPC-Web, /api and the dashboard on one port (the root config/envoy.yaml).
  envoy:
    image: envoyproxy/envoy:v1.35.0
    restart: unless-stopped
    depends_on:
      apiserver: { condition: service_started }
    volumes:
      - ../../config/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${RB_API_PORT:-8449}:8449"

  dashboard:
    build:
      context: ../..
      dockerfile: ops/rebuild/docker/dashboard.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/dashboard:${RB_TAG:-dev}
    restart: unless-stopped
    environment:
      # The API as the browser reaches it (Envoy).
      DASHBOARD_API_URL: ${RB_PUBLIC_API_URL:-http://localhost:8449}
    expose:
      - 3030

  # ---- profile `fakes`: fake TTS (:7001), STT (:7002) and LLM (:7003) ----
  fakes:
    profiles: ["fakes"]
    build:
      context: ../..
      dockerfile: ops/rebuild/docker/fakes.Dockerfile
    image: ${RB_REGISTRY:-fonoster}/fakes:${RB_TAG:-dev}
    restart: unless-stopped
    expose:
      - 7001
      - 7002
      - 7003

  # ---- profile `tools`: the SIP caller bot (go/medianode/cmd/sipcaller), HTTP on RB_CALLER_PORT ----
  sipcaller:
    profiles: ["tools"]
    build:
      context: ../../go/medianode
    image: ${RB_REGISTRY:-fonoster}/medianode:${RB_TAG:-dev}
    entrypoint: ["/sipcaller"]
    command: ["-listen", "0.0.0.0:8080", "-host", "${RB_NET:-10.216.16}.44"]
    restart: unless-stopped
    ports:
      - "${RB_CALLER_PORT:-8081}:8080"
    networks:
      default:
        ipv4_address: ${RB_NET:-10.216.16}.44

  # ---- optional observability profile (enabled with --profile observability) ----
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${RB_OTLP_HTTP_PORT:-4318}:4318"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "${RB_GRAFANA_PORT:-3000}:3000"

volumes:
  db:
  nats:
  nats-regions:
  minio:
