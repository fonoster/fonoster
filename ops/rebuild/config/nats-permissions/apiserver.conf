# NATS subject permissions of one Fonoster service (add-platform 4.1, build log HD-B1). The
# main NATS (../nats.conf), the cell's NATS (ops/rebuild/cell/config/nats.conf) and the Helm
# chart (files/nats-permissions/, copies the deployment suite keeps equal) include the files of
# the services they serve. Each service receives replies only under its own inbox prefix,
# `_INBOX_<user>.>`, which its NATS clients set (no service may read another's replies);
# allow_responses lets it answer requests it received. The session registry is the JetStream KV
# bucket fonoster_sessions (stream KV_fonoster_sessions); the "session registry" lines open it
# (bind or create) and read it.

# apiserver (control plane): CreateCall and TrackCall, outbound placement (media-control and
# gateway.outbound), record maintenance requests; consumes index entries, catalog use, webhook
# events and Routr's call events; reads the session registry (never writes it).
APISERVER_PERMISSIONS = {
  publish = {
    allow = [
      "calls.create"
      "calls.*.events"
      "media.*.commands"
      "gateway.outbound"
      "callrecord.*.maintenance"
      # session registry
      "$JS.API.INFO"
      "$JS.API.STREAM.INFO.KV_fonoster_sessions"
      "$JS.API.STREAM.CREATE.KV_fonoster_sessions"
      "$JS.API.DIRECT.GET.KV_fonoster_sessions"
      "$JS.API.DIRECT.GET.KV_fonoster_sessions.>"
      "$JS.API.STREAM.MSG.GET.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions"
      "$JS.API.CONSUMER.CREATE.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.INFO.KV_fonoster_sessions.>"
      "$JS.API.CONSUMER.DELETE.KV_fonoster_sessions.>"
      "$JS.FC.KV_fonoster_sessions.>"
      # webhook intake and call-record index: durable consumers on their own work-queue streams
      "$JS.API.STREAM.INFO.FONOSTER_WEBHOOKS"
      "$JS.API.STREAM.CREATE.FONOSTER_WEBHOOKS"
      "$JS.API.CONSUMER.CREATE.FONOSTER_WEBHOOKS.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.FONOSTER_WEBHOOKS.>"
      "$JS.API.CONSUMER.INFO.FONOSTER_WEBHOOKS.apiserver-webhooks"
      "$JS.API.CONSUMER.MSG.NEXT.FONOSTER_WEBHOOKS.apiserver-webhooks"
      "$JS.ACK.FONOSTER_WEBHOOKS.>"
      "$JS.API.STREAM.INFO.FONOSTER_RECORD_INDEX"
      "$JS.API.STREAM.CREATE.FONOSTER_RECORD_INDEX"
      "$JS.API.CONSUMER.CREATE.FONOSTER_RECORD_INDEX.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.FONOSTER_RECORD_INDEX.>"
      "$JS.API.CONSUMER.INFO.FONOSTER_RECORD_INDEX.apiserver-call-records"
      "$JS.API.CONSUMER.MSG.NEXT.FONOSTER_RECORD_INDEX.apiserver-call-records"
      "$JS.ACK.FONOSTER_RECORD_INDEX.>"
      # call refs (call id -> ref), its own KV bucket
      "$JS.API.STREAM.INFO.KV_fonoster_call_refs"
      "$JS.API.STREAM.CREATE.KV_fonoster_call_refs"
      "$JS.API.DIRECT.GET.KV_fonoster_call_refs.>"
      "$JS.API.STREAM.MSG.GET.KV_fonoster_call_refs"
      "$KV.fonoster_call_refs.>"
    ]
  }
  subscribe = {
    allow = [
      "calls.create"
      "calls.*.events"
      "media.*.heartbeat"
      "media.*.events.*"
      "callrecord.sealed"
      "registry.used"
      "webhooks.events"
      "routr.>"
      "_INBOX_apiserver.>"
    ]
  }
  allow_responses = true
}
