# NATS subject permissions of one Fonoster service (add-platform 4.1, build log HD-B1). The
# main NATS (../nats.conf), a private region.s NATS (ops/bundle/config/region/nats.conf) and the Helm
# chart (files/nats-permissions/, copies the deployment suite keeps equal) include the files of
# the services they serve. Each service receives replies only under its own inbox prefix,
# `_INBOX_<user>.>`, which its NATS clients set (no service may read another's replies);
# allow_responses lets it answer requests it received. The session registry is the JetStream KV
# bucket fonoster_sessions (stream KV_fonoster_sessions); the "session registry" lines open it
# (bind or create) and read it.

# Region agent (a cell): `region.<ref>.>` crosses the leaf link; its inbox prefix is
# `region.<ref>._INBOX`, under it, so it needs no other inbox. Locally it counts nodes and
# their rooms from their heartbeats (AppBridge's readiness is its gRPC health check, not NATS),
# forwards index entries and answers bring-your-own key requests.
REGION_AGENT_PERMISSIONS = {
  publish = { allow = ["region.>"] }
  subscribe = {
    allow = [
      "region.>"
      "roomr.nodes.*.heartbeat"
      "callrecord.sealed"
      "cell.workspacekeys.get"
    ]
  }
  allow_responses = true
}
