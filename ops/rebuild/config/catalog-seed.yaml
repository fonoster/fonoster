# Catalog seed for the rebuild stack (VO-B5): the base catalog, the same entries as the shipped
# ops/bundle/config/catalog.yaml. Load it with
#   fonoster-registry apply -f catalog-seed.yaml          (file store; FONOSTER_REGISTRY_FILE)
#   fonoster-registry apply -f catalog-seed.yaml --store database
# No keys here: providers name a credentialRef; AppBridge and Autopilot map it to a key in their
# own config (appbridge `providers.<id>.credential`, Autopilot `credentials.<ref>`).
#
# App speech defaults then take catalog ids:
#   speech: { voice: deepgram/aura-2-thalia-en, sttModel: deepgram/nova-3, hints: [Fonoster] }
# AppBridge's provider names must match the catalog's provider ids:
#   registry: { file: /etc/fonoster/registry.json }
#   providers:
#     deepgram: { adapter: deepgram, capabilities: [stt, tts], credential: { env: DEEPGRAM_API_KEY } }
entries:
  # ---- providers -------------------------------------------------------------------------
  - { kind: provider, id: deepgram, label: "Deepgram", adapter: deepgram, capabilities: [stt, tts], credentialRef: deepgram, state: active }
  - { kind: provider, id: openai, label: "OpenAI", adapter: openai, capabilities: [llm], credentialRef: openai, state: active }
  # ---- models ----------------------------------------------------------------------------
  - { kind: model, id: deepgram/nova-3, label: "Nova 3", type: stt, features: [streaming, interim-results, word-timings, multilingual], languages: [en, es, multi], settings: [], state: active }
  - { kind: model, id: deepgram/aura-2, label: "Aura 2", type: tts, features: [streaming], languages: [en, es], settings: [], state: active }
  - { kind: model, id: openai/gpt-5.4-mini, label: "GPT-5.4 Mini", type: llm, features: [streaming, tool-calling, json-mode, reasoning], languages: [], settings: [], state: active }
  # OpenAI shuts these down on 2027-01-14; agents that still name them run on gpt-5.4-mini.
  - { kind: model, id: openai/gpt-4o-mini, label: "GPT-4o Mini", type: llm, features: [streaming, tool-calling, json-mode], languages: [], settings: [], state: retired, replacement: openai/gpt-5.4-mini }
  - { kind: model, id: openai/gpt-4.1-mini, label: "GPT-4.1 Mini", type: llm, features: [streaming, tool-calling, json-mode], languages: [], settings: [], state: retired, replacement: openai/gpt-5.4-mini }
  # ---- voices: Deepgram Aura-2 (catalog id = deepgram/<Deepgram model name>) ---------------
  - { kind: voice, id: deepgram/aura-2-thalia-en, label: "Aura 2 Thalia", models: [deepgram/aura-2], language: en-US, gender: female, state: active }
  - { kind: voice, id: deepgram/aura-2-andromeda-en, label: "Aura 2 Andromeda", models: [deepgram/aura-2], language: en-US, gender: female, state: active }
  - { kind: voice, id: deepgram/aura-2-apollo-en, label: "Aura 2 Apollo", models: [deepgram/aura-2], language: en-US, gender: male, state: active }
  - { kind: voice, id: deepgram/aura-2-selena-es, label: "Aura 2 Selena", models: [deepgram/aura-2], language: es-419, gender: female, state: active }
  - { kind: voice, id: deepgram/aura-2-aquila-es, label: "Aura 2 Aquila", models: [deepgram/aura-2], language: es-419, gender: male, state: active }
