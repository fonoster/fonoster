# appbridge.yaml: AppBridge's only configuration (one YAML per service, no .env).
# Secrets may be inline or secret:// references.
nats:
  url: nats://nats:4222
  user: appbridge
  password: secret://env/NATS_APPBRIDGE_PASSWORD
rtp:
  host: 0.0.0.0
  advertiseHost: appbridge
# The session endpoint the Roomr node dials (sessionEndpoint: appbridge:50071) and its
# grpc.health.v1 readiness check.
session:
  listen: 0.0.0.0:50071
mediaTimeout: 15s
apps: []
providers: {}
