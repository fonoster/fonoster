# gateway.yaml: the VoiceSessionGateway's only configuration (one YAML per service, no .env).
# Secrets may be inline or secret:// references.
nats:
  url: nats://nats:4222
  user: gateway
  password: secret://env/NATS_GATEWAY_PASSWORD
rtp:
  host: 0.0.0.0
  advertiseHost: appbridge
apps: []
providers: {}
