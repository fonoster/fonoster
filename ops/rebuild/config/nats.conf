# NATS for the rebuild: JetStream (session registry KV) on, monitoring on 8222.
port: 4222
http_port: 8222
jetstream {
  store_dir: /data
}

# One user per service, each limited to its own subjects (add-platform 4.1, HD-B1). Passwords
# come from the environment (ops/rebuild/stack generates them into .local/stack.env); each
# service reads its own through a secret:// reference in its config.
include ./nats-permissions/apiserver.conf
include ./nats-permissions/gateway.conf
include ./nats-permissions/medianode.conf
include ./nats-permissions/routr.conf
authorization {
  users = [
    { user: apiserver, password: $NATS_APISERVER_PASSWORD, permissions: $APISERVER_PERMISSIONS }
    { user: gateway, password: $NATS_GATEWAY_PASSWORD, permissions: $GATEWAY_PERMISSIONS }
    { user: medianode, password: $NATS_MEDIANODE_PASSWORD, permissions: $MEDIANODE_PERMISSIONS }
    { user: routr, password: $NATS_ROUTR_PASSWORD, permissions: $ROUTR_PERMISSIONS }
  ]
}

# Regions: the hub accepts outbound-only leaf links from cells (docs/operators/rebuild.md).
# Enable with TLS and a per-cell account before opening the port to the internet:
