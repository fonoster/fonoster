# Fonoster on Docker Compose: the platform stack in ops/rebuild/compose.yaml (NATS with JetStream,
# Postgres, Routr, RTPEngine, the Go media node, the VoiceSessionGateway, MinIO, the apiserver,
# Envoy, the dashboard; profiles autopilot, fakes, tools, regions, observability, analytics).
# Asterisk and InfluxDB are gone.
#
# The easy way, which generates configs, keys and secrets and runs that file:
#
#   ops/rebuild/stack up                       # docs/try-the-new-platform.md
#
# Running this file directly needs the same inputs the stack generates (operator guide:
# docs/operators/rebuild.md):
#
#   docker compose --env-file ops/rebuild/.local/stack.env --profile autopilot up -d
#
# Developer services for running the TypeScript services from source: compose.dev.yaml.
include:
  - path: ops/rebuild/compose.yaml
    project_directory: ops/rebuild
