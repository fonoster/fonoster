# Fonoster on Docker Compose: the self-host bundle (ops/bundle/compose.yaml: NATS with JetStream,
# Postgres, Routr, RTPEngine, the Go Roomr node, AppBridge, MinIO, the apiserver,
# Envoy, the dashboard, the hosted Autopilot; no profiles) with the development layer
# (ops/rebuild/compose.yaml: builds from source, profiles regions, fakes and tools).
# Asterisk and InfluxDB are gone.
#
# The easy way, which generates configs, keys and secrets and runs both files:
#
#   ops/rebuild/stack up                       # docs/try-the-new-platform.md
#
# Running this file directly needs the same inputs the stack generates (operator guide:
# docs/operators/rebuild.md):
#
#   docker compose --env-file ops/rebuild/.local/stack.env --env-file ops/rebuild/.local/host.env \
#     --env-file ops/rebuild/.local/bundle.env up -d
#
# Self-hosting without a checkout: ops/bundle/README.md. Developing Fonoster: the dev container
# (.devcontainer/, CONTRIBUTING.md); this file is the smoke/CI harness, not a development path.
include:
  # HTTPS, the bundle's default, with the certificate `ops/rebuild/stack up` generates in
  # ops/rebuild/.local/config/tls/ (clients trust its ca.pem).
  - path: [ops/bundle/compose.yaml, ops/rebuild/compose.yaml]
    project_directory: ops/rebuild
