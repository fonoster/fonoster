# Dev layer over .dev/config/fonoster.yaml (fonoster-config render --overlay). Your own overrides:
# .dev/overlay/fonoster.yaml.
#
# The fake providers (npm run dev:fakes) join the catalog as one more provider, `fake`, which
# needs no key, so new agents start on the fakes. The real vendors are offered as in any install:
# put your keys in appbridge.yaml and autopilot.yaml (.dev/overlay), or add them in the dashboard.
catalog: { files: [/workspaces/fonoster/mods/conformance/fakes.catalog.yaml] }
