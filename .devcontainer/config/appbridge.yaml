# Dev layer over .dev/config/appbridge.yaml (ops/rebuild/merge-config.cjs; objects merge, `null`
# removes a key). Your own overrides: .dev/overlay/appbridge.yaml.
#
# AppBridge runs in the workspace, at its fixed address (.devcontainer/compose.yaml).
rtp: { advertiseHost: "${SUBNET_PREFIX}.46" }
# Call records: a directory and signing key the workspace user can write and read.
callRecord:
  dir: /workspaces/fonoster/.dev/records
  signingKey: { privateKeyFile: /workspaces/fonoster/.dev/config/keys/records.pem }
