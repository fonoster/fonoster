# The Fonoster dev container (CONTRIBUTING.md). Opening it starts the `workspace` (where you run
# our components from source: `npm run dev`) and the dependencies, which are the self-host
# bundle's own services (`extends` of ops/bundle/compose.yaml): same images, health checks, fixed
# addresses and published ports, so development and self-hosting cannot drift.
#
# Values come from .env here, a link to ../.dev/.env that .devcontainer/initialize.sh writes with
# `fonoster-config init` before the containers start (secrets are generated, never committed).
name: ${COMPOSE_PROJECT_NAME:-fonoster-dev}

# The bundle's network: Routr, RTPEngine, the Roomr node and the workspace (AppBridge's RTP) need
# fixed addresses for SIP and SDP.
networks:
  default:
    ipam:
      config:
        - subnet: ${SUBNET_PREFIX:?run .devcontainer/initialize.sh}.0/24
          ip_range: ${SUBNET_PREFIX}.128/25

services:
  workspace:
    # Built from ./Dockerfile by initialize.sh (before the containers start).
    image: fonoster-dev-workspace
    pull_policy: never
    # A real PID 1 (tini) reaps exited processes. Without it, `sleep infinity` is PID 1 and
    # zombies from test runs and `docker exec` sessions pile up for the container's lifetime.
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspaces/fonoster:cached
      # Linux node_modules stay out of the host checkout (native binaries differ).
      - node-modules:/workspaces/fonoster/node_modules
      # The keys and the provider catalog at the paths the bundle's config files name. The
      # service files themselves are passed explicitly (npm run dev): mounted at /config they
      # would also be picked up by the Roomr nodes and AppBridge replicas the tests start. As in the
      # bundle, AppBridge's path holds Identity's public key and the call-record key only.
      - ../.dev/config/keys:/opt/fonoster/keys:ro
      - ../.dev/config/keys/public.pem:/etc/fonoster/keys/public.pem:ro
      - ../.dev/config/keys/records.pem:/etc/fonoster/keys/records.pem:ro
      - ../.dev/config/catalog.yaml:/etc/fonoster/catalog.yaml:ro
    environment:
      # Tests use their own NATS and database, never the dev stack's.
      CONFORMANCE_NATS_URL: nats://nats-test:4222
      PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fonoster_test
    networks:
      default:
        # A fixed address for AppBridge's RTP (appbridge.yaml advertises it) and the names the
        # bundle's Envoy and configs use for the services we run from source.
        ipv4_address: ${SUBNET_PREFIX}.46
        aliases: [apiserver, appbridge, autopilot, dashboard, fakes]

  nats:
    extends: { file: ../ops/bundle/compose.yaml, service: nats }

  postgres:
    extends: { file: ../ops/bundle/compose.yaml, service: postgres }
    volumes:
      - ./postgres-test.sql:/docker-entrypoint-initdb.d/20-test.sql:ro
    # Reachable from the host too, so tests can run outside the workspace container
    # (PERSISTENCE_TEST_DATABASE_URL=postgresql://postgres:<password>@127.0.0.1:15432/fonoster_test).
    ports:
      - "127.0.0.1:15432:5432"

  routr:
    extends: { file: ../ops/bundle/compose.yaml, service: routr }

  rtpengine:
    extends: { file: ../ops/bundle/compose.yaml, service: rtpengine }

  # The Roomr node: the bundle's pinned image at its fixed address (Routr trusts INVITEs from it),
  # with .dev/config/roomr.yaml. Roomr is developed in fonoster/roomr.
  roomr:
    extends: { file: ../ops/bundle/compose.yaml, service: roomr }
    depends_on: !reset {}

  minio:
    extends: { file: ../ops/bundle/compose.yaml, service: minio }

  # Routes to the workspace (the `apiserver` and `dashboard` aliases), which runs them from source.
  envoy:
    extends: { file: ../ops/bundle/compose.yaml, service: envoy }
    depends_on: !reset {}

  # The conformance suites' NATS (CONFORMANCE_NATS_URL): JetStream, no users.
  nats-test:
    image: nats:2.11.8-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    # From the host: CONFORMANCE_NATS_URL=nats://127.0.0.1:14222.
    ports:
      - "127.0.0.1:14222:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  nats-data:
  minio-data:
  node-modules:
