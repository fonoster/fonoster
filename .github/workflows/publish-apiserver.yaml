name: publish apiserver

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to use for Docker tags'
        required: false
        type: string
      ref:
        description: 'Commit SHA to check out and build (defaults to the triggering commit if omitted)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to use for Docker tags'
        required: false
        type: string
      ref:
        description: 'Commit SHA to check out and build (defaults to the triggering commit if omitted)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Without this, checkout defaults to github.sha (the commit that
          # triggered the workflow run) rather than the version-bump commit
          # "npm run release" pushes afterward in the calling workflow's
          # build job, so the image would build with the pre-bump
          # package.json versions. See release.yaml's RELEASE_SHA output.
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Get version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "LERNA_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            lerna_version=$(node -p "require('./lerna.json').version")
            echo "LERNA_VERSION=$lerna_version" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Publish the APIServer to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mods/apiserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fonoster/apiserver:latest
            fonoster/apiserver:${{ env.LERNA_VERSION }}

      - name: Install dependencies for integration tests
        run: |
          npm install --prefer-offline --no-audit
          npm run build

      - name: Starting services for integration tests
        run: |
          npm run generate:keypair
          cp config/integrations.example.json config/integrations.json
          cp .env.example .env
          echo "" >> .env
          echo "DOCKER_HOST_ADDRESS=127.0.0.1" >> .env
          sed -i "s|ROUTR_EXTERNAL_ADDRS=.*|ROUTR_EXTERNAL_ADDRS=127.0.0.1|g" .env 
          sed -i "s|RTPENGINE_PUBLIC_IP=.*|RTPENGINE_PUBLIC_IP=127.0.0.1|g" .env 
          sed -i "s|ASTERISK_SIPPROXY_HOST=.*|ASTERISK_SIPPROXY_HOST=127.0.0.1|g" .env
          sed -i "s|APISERVER_SMTP_HOST=.*|APISERVER_SMTP_HOST=mailhog|g" .env 
          sed -i "s|APISERVER_SMTP_PORT=.*|APISERVER_SMTP_PORT=1025|g" .env
          sed -i "s|APISERVER_SMTP_SECURE=.*|APISERVER_SMTP_SECURE=false|g" .env
          docker compose -f compose.yaml -f compose.dev.yaml up -d envoy routr nats postgres apiserver asterisk mailhog

      - name: Waiting for services to be ready
        run: |
          sleep 120 # Enough time for Routr to start in a low spec machine
          docker ps -a

      - name: Wait for apiserver gRPC port
        run: |
          echo "Waiting for apiserver on port 50051..."
          for i in $(seq 1 45); do
            if node -e "require('net').createConnection(50051,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "Apiserver is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Timeout: apiserver did not become ready on port 50051."
          exit 1

      - name: Run integration tests for the SDK
        run: |
          set +e
          echo "--- environment ---"
          node -v
          free -h || true
          ulimit -a
          echo "--- running mocha directly (bypassing npm's own exit-code translation) ---"
          cross-env LOGS_LEVEL=none NODE_ENV=development \
            node --unhandled-rejections=strict node_modules/.bin/mocha \
            --slow 50000 --timeout 10000 \
            'mods/**/node.integration.ts' 'mods/**/*.integration.test.ts'
          status=$?
          echo "mocha exited with raw status: $status"
          if [ "$status" -gt 128 ]; then
            sig=$((status - 128))
            echo "That's signal $sig (kill -l $sig): $(kill -l "$sig" 2>/dev/null || echo unknown)"
          fi
          dmesg 2>/dev/null | tail -50 | grep -i "killed process\|out of memory" || true
          exit $status

      - name: Apiserver logs (on failure)
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs apiserver