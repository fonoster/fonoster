name: Images

# Builds the Fonoster images for linux/amd64 and linux/arm64 and pushes them to Docker Hub as
# fonoster/<name>:<version> (and :latest when asked). The list is ops/release/images.json, the same
# one ops/release/bundle builds from, so the published images and the release archive agree.
# Called by release.yaml; can also be started by hand (e.g. to republish one version).
#
# Each platform builds on its own native runner (arm64 on ubuntu-24.04-arm, no QEMU) and pushes by
# digest; the merge job then tags one manifest list holding both, and fails unless both are in it.
# push: false builds both platforms and pushes nothing (to check a change to this file or a
# Dockerfile).

on:
  workflow_call:
    inputs:
      version:
        description: Image tag (the release version)
        required: true
        type: string
      ref:
        description: Commit to build (default the calling commit)
        required: false
        type: string
      latest:
        description: Also tag :latest
        required: false
        type: boolean
        default: false
      only:
        description: Build just this image (a name from ops/release/images.json); empty builds all
        required: false
        type: string
        default: ""
      push:
        description: Push the images and their tags (false builds both platforms and pushes nothing)
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (the release version)
        required: true
        type: string
      ref:
        description: Commit, branch or tag to build (default the selected branch)
        required: false
        type: string
      latest:
        description: Also tag :latest
        required: false
        type: boolean
        default: false
      only:
        description: Build just this image (a name from ops/release/images.json); empty builds all
        required: false
        type: string
      push:
        description: Push the images and their tags (false builds both platforms and pushes nothing)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  list:
    name: image list
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Read ops/release/images.json
        id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          images="$(jq -c --arg only "$ONLY" '[.images[] | select($only == "" or .name == $only)]' ops/release/images.json)"
          [ "$images" != "[]" ] || { echo "no image named '$ONLY' in ops/release/images.json"; exit 1; }
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    name: fonoster/${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: list
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # No build cache: per-platform scopes would double the entries in the repository's 10 GB
      # Actions cache, which already evicted the npm caches the PR checks use.
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: ${{ inputs.push && format('type=image,name=fonoster/{0},push-by-digest=true,name-canonical=true,push=true', matrix.image.name) || 'type=cacheonly' }}

      - name: Keep the digest
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: fonoster/${{ matrix.image.name }}
    if: ${{ inputs.push }}
    needs: [list, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      # Both platforms or nothing: no tag points at a one-platform image.
      - name: Both platforms built
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -- *
          [ "$#" = 2 ] || { echo "expected 2 digests (amd64, arm64), found $#: $*"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Tag the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          NAME: ${{ matrix.image.name }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags=(-t "fonoster/$NAME:$VERSION")
          [ "$LATEST" != "true" ] || tags+=(-t "fonoster/$NAME:latest")
          refs=()
          for d in *; do refs+=("fonoster/$NAME@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Both platforms published
        env:
          NAME: ${{ matrix.image.name }}
          VERSION: ${{ inputs.version }}
        run: |
          platforms="$(docker buildx imagetools inspect "fonoster/$NAME:$VERSION" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | join(" ")')"
          echo "fonoster/$NAME:$VERSION: $platforms"
          case " $platforms " in *" linux/amd64 "*) ;; *) echo "linux/amd64 missing"; exit 1 ;; esac
          case " $platforms " in *" linux/arm64 "*) ;; *) echo "linux/arm64 missing"; exit 1 ;; esac
