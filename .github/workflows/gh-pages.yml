name: deploy to github pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installing Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Populate out directory
        run: |
          # Publish everything under site/ (the deploy replaces the whole gh-pages branch)
          mkdir -p out
          cp -a site/. out/
          rm -f out/README.md
          echo > out/.nojekyll
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          cname: fonoster.com
