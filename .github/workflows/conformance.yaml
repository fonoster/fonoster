name: conformance

# Conformance suites (add-conformance-framework, C6). The suites that need NATS run on pull
# requests that touch the voice path; timing (T1), load (T2), turn-taking replay (T3) and the
# Pipecat golden test run nightly and on demand. Unit tests, Go and Python are in ci.yaml.

on:
  pull_request:
    paths:
      - '.github/workflows/conformance.yaml'
      - 'mods/apiserver/src/calls/**'
      - 'mods/apiserver/src/outbound/**'
      - 'mods/apiserver/test/outbound/**'
      - 'mods/apiserver/src/regions/**'
      - 'mods/apiserver/src/records/**'
      - 'mods/apiserver/test/regions/**'
      - 'mods/region-agent/**'
      - 'mods/common/**'
      - 'mods/conformance/**'
      - 'mods/gateway/**'
      - 'mods/voice/**'
      - 'mods/autopilot/**'
      - 'mods/callrecord/**'
      - 'python/**'
      - 'go/**'
      - 'package-lock.json'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: session, SDK and Autopilot suites (NATS)
    runs-on: ubuntu-latest
    # The region suites keep their control plane's state in throwaway databases on this server.
    services:
      postgres:
        image: postgres:16.10-alpine3.22
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A step, not a service container: services cannot pass -js, and the session registry
      # (JetStream KV) is part of what these suites check, as in the dev container's nats-test.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.11.8 -js -m 8222
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8222/healthz && exit 0; sleep 1; done
          docker logs nats; exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      # Some suites build and run the real media node (go build, cgo with libopus).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/medianode/go.mod
          cache-dependency-path: go/medianode/go.sum

      - name: Install libopus
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Run the suites that need NATS
        env:
          CONFORMANCE_NATS_URL: nats://127.0.0.1:4222
          GOTOOLCHAIN: local
          LOGS_LEVEL: none
        run: |
          npx mocha --exit --timeout 30000 \
            'mods/gateway/test/conformance.test.ts' \
            'mods/gateway/test/integration.test.ts' \
            'mods/gateway/test/crash.test.ts' \
            'mods/conformance/test/nats.test.ts' \
            'mods/conformance/test/media-control.test.ts' \
            'mods/conformance/test/media-control-go.test.ts' \
            'mods/gateway/test/gonode.test.ts' \
            'mods/gateway/test/observability.test.ts' \
            'mods/conformance/test/medianode-secrets.test.ts' \
            'mods/autopilot/test/session/fullstack.test.ts' \
            'mods/apiserver/test/outbound/placeOutboundCall.test.ts' \
            'mods/apiserver/test/outbound/controlPlane.test.ts'

      # The regions suite runs its own region hub and cell (nats-server, TLS leaf link).
      - name: Install nats-server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.11.8/nats-server-v2.11.8-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "NATS_SERVER_BIN=$RUNNER_TEMP/nats-server-v2.11.8-linux-amd64/nats-server" >> "$GITHUB_ENV"

      - name: Run the region suites
        env:
          CONFORMANCE_NATS_URL: nats://127.0.0.1:4222
          PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          LOGS_LEVEL: none
        run: |
          npx mocha --exit --timeout 120000 \
            'mods/conformance/test/regions.test.ts' \
            'mods/conformance/test/regionsScenarios.test.ts' \
            'mods/apiserver/test/regions/regions.test.ts' \
            'mods/region-agent/test/cell.test.ts'

  nightly:
    name: timing (T1), load (T2), replay (T3) and Pipecat
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Shared runners are noisy; these numbers are a trend, not the pass bar (which needs a
    # dedicated runner, conformance task 4.2).
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.11.8
        ports:
          - 4222:4222
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build
          python -m pip install -r python/pipecat-golden/requirements.txt

      - name: Timing (T1)
        env:
          CONFORMANCE_NATS_URL: nats://127.0.0.1:4222
          CONFORMANCE_TIMING_RUNS: "200"
          CONFORMANCE_REPORT_DIR: reports
          LOGS_LEVEL: none
        run: npx mocha --timeout 0 'mods/gateway/test/timing.test.ts'

      - name: Load (T2)
        run: |
          mkdir -p reports
          npx tsx mods/gateway/scripts/scale.ts --calls 100 --seconds 60 | tee reports/scale-100.json
          # A reduced multi-replica profile: the full bar (ten replicas, 1,000 calls) needs about
          # 20 vCPU for the gateways alone, more than a hosted runner has (harden-conformance 2.2).
          npx tsx mods/gateway/scripts/scale.ts --calls 200 --seconds 60 --replicas 2 | tee reports/scale-2x200.json

      - name: Turn-taking replay (T3)
        run: npx tsx mods/gateway/scripts/replay.ts | tee reports/turn-replay.txt

      - name: Pipecat golden test
        env:
          CONFORMANCE_NATS_URL: nats://127.0.0.1:4222
          PIPECAT_PYTHON: python
          LOGS_LEVEL: none
        run: npx mocha --timeout 60000 'mods/gateway/test/pipecat.test.ts'

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: reports/

  # The full T2 bar (ten replicas, 1,000 calls) needs about 20 vCPU for the gateways alone, more
  # than a hosted runner has. This job stays off until the repository variable LOAD_RUNNER names
  # a bigger runner (a GitHub larger-runner label or a self-hosted label); the nightly job above
  # keeps running the reduced profiles meanwhile.
  load-full:
    name: load (T2), full scale
    if: vars.LOAD_RUNNER != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.LOAD_RUNNER }}
    timeout-minutes: 60
    services:
      nats:
        image: nats:2.11.8
        ports:
          - 4222:4222
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Load (T2), ten replicas at 1,000 calls
        run: |
          mkdir -p reports
          npx tsx mods/gateway/scripts/scale.ts --calls 1000 --seconds 60 --replicas 10 | tee reports/scale-10x1000.json

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-load-full
          path: reports/
