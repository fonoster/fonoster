name: ci

# Build and test. Each job runs only when its inputs changed (the `changes` job); a change to this
# file runs them all.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.filter.outputs.node }}
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yaml'
            node:
              - *workflow
              - 'mods/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.mocharc.cjs'
            go:
              - *workflow
              - 'go/**'
            python:
              - *workflow
              - 'python/**'
            dashboard:
              - *workflow
              - 'mods/dashboard/**'
              - 'mods/sdk/**'
              - 'mods/types/**'
              - 'mods/common/**'
              - 'package-lock.json'
            sdk:
              - *workflow
              - 'mods/common/**'
              - 'mods/types/**'
              - 'mods/sdk/**'
              - 'package.json'
              - 'package-lock.json'

  node:
    name: node build and unit tests
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The database tests (standalone Identity, persistence) make their own throwaway databases
    # on this server, as they do on the dev container's (PERSISTENCE_TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16.10-alpine3.22
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Everything that needs no NATS; the NATS suites are in conformance.yaml.
      - name: Unit tests
        env:
          PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm test

  go:
    name: go Roomr node
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.11.8
        ports:
          - 4222:4222
    defaults:
      run:
        working-directory: go/roomr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/roomr/go.mod
          cache-dependency-path: go/roomr/go.sum

      # The Opus codec is cgo (internal/audio/opus.go); the shipped image links libopus statically
      # (go/roomr/Dockerfile). Tests run with cgo (the race detector needs it), so Opus is in.
      - name: Install libopus
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev

      - name: gofmt, vet and tests (race detector; e2e against NATS)
        env:
          CONFORMANCE_NATS_URL: nats://127.0.0.1:4222
          GOTOOLCHAIN: local
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          # The no-libopus fallback (opus_none.go) still builds.
          CGO_ENABLED=0 go build ./...
          # Packages one at a time: several bind random local ports and collide when run in parallel.
          go test -race -p 1 ./...

  python:
    name: python SDK and runner
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install -e fonoster-conformance -e "fonoster-voice[test]"
          python -m pytest fonoster-conformance/tests fonoster-voice/tests

  dashboard:
    name: dashboard typecheck, unit and e2e
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      # The dashboard reads the SDK's and types' dist.
      - name: Install dependencies and build the SDK
        run: |
          npm install --no-audit --no-fund
          npx lerna run build --scope @fonoster/sdk --include-dependencies

      - name: Typecheck and unit tests
        working-directory: mods/dashboard
        run: |
          npm run typecheck
          npm test

      - name: End-to-end tests (Playwright)
        working-directory: mods/dashboard
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e-results
          path: mods/dashboard/test-results/
          if-no-files-found: ignore

  sdk-pack:
    name: pack the SDK
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies and build the SDK
        run: |
          npm install --no-audit --no-fund
          npx lerna run build --scope @fonoster/sdk --include-dependencies

      - name: Pack
        working-directory: mods/sdk
        run: npm pack

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball
          path: mods/sdk/fonoster-sdk-*.tgz

  sdk-install:
    name: install the SDK (node ${{ matrix.node }}, ${{ matrix.pm }})
    needs: sdk-pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        pm: [npm]
        include:
          - node: 22
            pm: yarn
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download the tarball
        uses: actions/download-artifact@v4
        with:
          name: sdk-tarball

      - name: Install it in a new project and load it
        run: |
          tgz="$(ls "$PWD"/fonoster-sdk-*.tgz)"
          mkdir new-project && cd new-project
          if [ "${{ matrix.pm }}" = "yarn" ]; then
            npm install -g yarn
            yarn init -y
            yarn add "$tgz"
          else
            npm init -y
            npm install "$tgz"
          fi
          node -e 'const sdk = require("@fonoster/sdk"); if (!sdk.Client) throw new Error("no Client export");'
