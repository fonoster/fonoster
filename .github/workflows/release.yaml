name: release

# Cuts a release, by hand only (Actions tab). Nothing here runs on merge.
#
#   1. version: .scripts/next-release.sh (conventional commits since the last tag; a
#      `Release-As: x.y.z` footer pins it). "none" stops here.
#   2. npm: `npm run release` (lerna publish, dist-tag latest), which commits the version bump,
#      tags v<version> and pushes both to main.
#   3. images: images.yaml at the release commit (every image in ops/release/images.json).
#   4. bundle: ops/release/bundle <version> (images skipped) and a DRAFT GitHub release with
#      fonoster-<version>.tar.gz and fonoster-common-<version>.tgz attached.
#   5. approval: the release-approval environment (review the draft and the images).
#   6. publish: the draft becomes the published release.
#
# compose.yaml is never edited: the archive's .env.example carries FONOSTER_VERSION.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    name: version and npm packages
    runs-on: ubuntu-latest
    # id-token lets npm verify this run (trusted publishing), so no npm token is stored.
    permissions:
      contents: read
      id-token: write
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org

      - name: Next release
        id: next
        run: |
          release="$(.scripts/next-release.sh)"
          echo "Next release: $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and build
        if: steps.next.outputs.release != 'none'
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish the packages to npm
        if: steps.next.outputs.release != 'none'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout .
          npm run release

      # Runs on every release run, even with no new commits: publishes any version already in
      # package.json that npm doesn't have yet (a run that failed partway). Does nothing otherwise.
      - name: Publish versions missing from npm
        run: npx lerna publish from-package --yes --dist-tag latest

      - name: Released version and commit
        id: version
        if: steps.next.outputs.release != 'none'
        run: |
          echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  images:
    name: images
    needs: npm
    if: needs.npm.outputs.release != 'none'
    uses: ./.github/workflows/images.yaml
    with:
      version: ${{ needs.npm.outputs.version }}
      ref: ${{ needs.npm.outputs.sha }}
      latest: true
    secrets: inherit

  bundle:
    name: install archive and draft release
    needs: npm
    if: needs.npm.outputs.release != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.npm.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.npm.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the archive
        run: SKIP_IMAGES=1 ops/release/bundle "$VERSION"

      - name: Release notes
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude_types: other,doc,chore
          config_file: ./.scripts/tag-changelog-config.cjs

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: true
          files: |
            dist/release/${{ env.VERSION }}/fonoster-${{ env.VERSION }}.tar.gz
            dist/release/${{ env.VERSION }}/fonoster-common-${{ env.VERSION }}.tgz

  approval:
    name: approve the release
    needs: [npm, images, bundle]
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - name: What is waiting
        env:
          VERSION: ${{ needs.npm.outputs.version }}
        run: |
          echo "Release v$VERSION: npm packages published, images pushed (fonoster/<name>:$VERSION"
          echo "for every entry in ops/release/images.json), draft release with the install archive."
          echo "Review the draft release and the images, then approve to publish the release."

  publish:
    name: publish the release
    needs: [npm, approval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.npm.outputs.version }}
        run: gh release edit "v$VERSION" --repo "${{ github.repository }}" --draft=false --latest
