name: Release

# Every push to main that carries a releasable commit is released, all the way:
#
#   1. version: ops/release/next-release.sh picks the bump from the conventional commits since
#      the last v* tag (feat: minor; fix, perf, refactor, revert: patch; `!` or BREAKING CHANGE:
#      major; a `Release-As: x.y.z` footer pins it). docs, chore, ci, test and style ship nothing.
#   2. qa: the QA gate (qa-proofs.yaml) on that commit. A failed gate stops the release before
#      anything is published.
#   3. npm: `npm run release` (lerna publish, dist-tag latest) commits the version bump with
#      [skip ci], tags v<version> and pushes both to main.
#   4. images: images.yaml at the release commit (every image in ops/release/images.json).
#   5. release: the install archive, the notes, the QA report and two release cards (dark and
#      light) on a published GitHub release, marked latest.
#   6. deploy: deploy.yaml stages the release on production, then waits for approval in the
#      production environment before it switches.
#
# compose.yaml is never edited: the archive's .env.example carries FONOSTER_VERSION.
#
# Runs queue, never overlap. When main moves while the gate runs, that run stops without
# publishing; the run queued for the newer push releases everything.
#
# Retry a release that failed partway with `gh workflow run release.yaml` when there are no new
# releasable commits: it publishes the versions npm still lacks, then the images and the GitHub
# release for the version already tagged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: next version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      sha: ${{ steps.next.outputs.sha }}
      resume: ${{ steps.next.outputs.resume }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A manual run with nothing new to release finishes the version already tagged.
      - name: Next release
        id: next
        run: |
          release="$(ops/release/next-release.sh)"
          echo "Next release: $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          resume=false
          if [ "$release" = "none" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then resume=true; fi
          echo "resume=$resume" >> "$GITHUB_OUTPUT"

  # The gate. Skipped when there is nothing to release, and when resuming a version already tagged
  # (its gate ran when it was cut).
  qa:
    name: QA gate
    needs: plan
    # QA_PAUSED=true (repository variable) skips the gate while QA is paused; unset it to gate again.
    if: needs.plan.outputs.release != 'none' && vars.QA_PAUSED != 'true'
    uses: ./.github/workflows/qa-proofs.yaml
    with:
      version: ${{ needs.plan.outputs.release }}
      ref: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  npm:
    name: version and npm packages
    needs: [plan, qa]
    # Only after the gate passed, or on a resume (no gate: it ran when the version was cut).
    if: ${{ !cancelled() && (needs.qa.result == 'success' || (needs.qa.result == 'skipped' && (needs.plan.outputs.resume == 'true' || (vars.QA_PAUSED == 'true' && needs.plan.outputs.release != 'none')))) }}
    runs-on: ubuntu-latest
    # id-token lets npm verify this run (trusted publishing), so no npm token is stored.
    permissions:
      contents: read
      id-token: write
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # The gate tested the plan's commit; publishing anything newer would skip it. The run queued
      # for the newer push releases it, so this one stops quietly.
      - name: Publish only what the gate tested
        id: current
        if: needs.qa.result == 'success'
        env:
          TESTED: ${{ needs.plan.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED" ]; then
            echo "::notice::main moved to $(git rev-parse --short HEAD) while the QA gate tested ${TESTED:0:9}; the newer run releases both."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org

      - name: Next release
        id: next
        if: steps.current.outputs.superseded != 'true'
        run: |
          release="$(ops/release/next-release.sh)"
          echo "Next release: $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and build
        if: steps.next.outputs.release != '' && (steps.next.outputs.release != 'none' || needs.plan.outputs.resume == 'true')
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish the packages to npm
        if: steps.next.outputs.release != '' && steps.next.outputs.release != 'none'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout .
          npm run release

      # Runs on every release run, even with no new commits: publishes any version already in
      # package.json that npm doesn't have yet (a run that failed partway). Does nothing otherwise.
      - name: Publish versions missing from npm
        if: steps.next.outputs.release != ''
        run: |
          # The normal publish leaves gitHead edits in package.json files; from-package refuses a
          # dirty tree, and those edits are not meant to be committed.
          git checkout -- .
          npx lerna publish from-package --yes --dist-tag latest

      - name: Released version and commit
        id: version
        if: steps.next.outputs.release != '' && (steps.next.outputs.release != 'none' || needs.plan.outputs.resume == 'true')
        run: |
          echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  images:
    name: images
    needs: npm
    # !cancelled(): on a retry the gate is skipped, and a skipped ancestor skips every job after it
    # unless the condition says otherwise.
    if: ${{ !cancelled() && needs.npm.result == 'success' && needs.npm.outputs.version != '' }}
    uses: ./.github/workflows/images.yaml
    with:
      version: ${{ needs.npm.outputs.version }}
      ref: ${{ needs.npm.outputs.sha }}
      latest: true
    secrets: inherit

  bundle:
    name: GitHub release
    needs: npm
    # !cancelled(): on a retry the gate is skipped, and a skipped ancestor skips every job after it
    # unless the condition says otherwise.
    if: ${{ !cancelled() && needs.npm.result == 'success' && needs.npm.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.npm.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.npm.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The archive script loads several workspace packages (common, identity, ...): build them all.
      - name: Build the packages the archive needs
        run: NX_DAEMON=false npm run build

      - name: Build the archive
        run: SKIP_IMAGES=1 ops/release/bundle "$VERSION"

      # The QA report of the gate that let this release through (absent on a resume).
      - name: QA report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qa-report
          path: dist/qa

      - name: Release notes
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude_types: other,doc,chore
          config_file: ./ops/release/tag-changelog-config.cjs

      # A card that fails to render never holds the release back.
      - name: Release cards
        continue-on-error: true
        run: |
          cd ops/release/release-card && npm ci --no-audit --no-fund && cd -
          for theme in dark light; do
            RELEASE_CARD_THEME=$theme node ops/release/release-card/release-card.mjs "v$VERSION" "dist/release-card-v$VERSION-$theme.png"
          done

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/release/${{ env.VERSION }}/fonoster-${{ env.VERSION }}.tar.gz
            dist/release/${{ env.VERSION }}/fonoster-common-${{ env.VERSION }}.tgz
            dist/qa/qa-report.md
            dist/release-card-v${{ env.VERSION }}-dark.png
            dist/release-card-v${{ env.VERSION }}-light.png

  deploy:
    name: deploy
    needs: [npm, images, bundle]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.bundle.result == 'success' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      version: ${{ needs.npm.outputs.version }}
    secrets: inherit
