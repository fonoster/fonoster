name: Deploy

# Rolls a release out to production with the Ansible playbook the release ships (fonoster/ansible
# in its archive). release.yaml calls it after every release; run it by hand to redeploy, to move
# to another version or to apply an inventory change: `gh workflow run deploy.yaml -f version=0.43.0`
# (add `-f host_role=true` to run the host role too).
#
#   1. plan (environment production-prepare, no approval, no credential): resolves the tag
#      v<version> to its SHA, reads the archive's SHA256 from the release's SHA256SUMS, checks the
#      archive against it and that it carries the playbook, and lints that playbook. A version
#      without a playbook fails here.
#   2. apply (environment production, waits for a required reviewer): over SSH as the deploy user,
#      ops/ansible/deploy-on-host.sh downloads that archive on the host, checks it against the
#      plan's SHA256, prints the playbook's --check --diff, then applies it with the host's
#      inventory (/etc/fonoster/inventory, root only, never in the repository). A failed apply
#      restores the backup its switch made (none when it failed before the switch).
#
# The database is never touched. The switch time in the summary (and deploys.log on the server) is
# the point to restore a database backup to. Nobody edits the server by hand: ops/ansible/README.md
# "Fonoster Cloud".
#
# Secret (production): DEPLOY_SSH_KEY. Variables: DEPLOY_HOST, DEPLOY_KNOWN_HOSTS (ssh-keyscan).

on:
  workflow_call:
    inputs:
      version:
        description: The release to deploy, like 0.43.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The release to deploy, like 0.43.0 (empty = the latest release)
        type: string
        required: false
      host_role:
        description: Also run the host role
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    environment: production-prepare
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_sha: ${{ steps.pins.outputs.tag_sha }}
      archive_sha256: ${{ steps.pins.outputs.archive_sha256 }}
    steps:
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # What the apply runs: the archive at this SHA256, whatever the tag or release does later.
      - name: Pins
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" -q .sha) \
            || { echo "::error::no tag v$VERSION"; exit 1; }
          cd "$RUNNER_TEMP"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -p "fonoster-$VERSION.tar.gz" \
            || { echo "::error::release v$VERSION has no SHA256SUMS or archive"; exit 1; }
          archive_sha256=$(awk -v f="fonoster-$VERSION.tar.gz" '$2 == f || $2 == "*" f { print $1 }' SHA256SUMS)
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::SHA256SUMS of v$VERSION lists no fonoster-$VERSION.tar.gz"; exit 1; }
          echo "$archive_sha256  fonoster-$VERSION.tar.gz" | sha256sum -c --quiet - \
            || { echo "::error::fonoster-$VERSION.tar.gz does not match SHA256SUMS"; exit 1; }
          tar -xzf "fonoster-$VERSION.tar.gz" fonoster/ansible 2>/dev/null \
            && [ -f fonoster/ansible/playbooks/site.yml ] && [ -f fonoster/ansible/playbooks/rollback.yml ] \
            || { echo "::error::version $VERSION has no playbook"; exit 1; }
          {
            echo "tag_sha=$tag_sha"
            echo "archive_sha256=$archive_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Ansible
        uses: ./.github/actions/ansible
        with:
          lint: "true"

      - name: Lint and syntax-check the release's playbook
        working-directory: ${{ runner.temp }}/fonoster/ansible
        run: |
          ansible-lint
          for p in site rollback; do
            ansible-playbook -i localhost, "playbooks/$p.yml" --syntax-check
          done

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_SHA: ${{ steps.pins.outputs.tag_sha }}
          ARCHIVE_SHA256: ${{ steps.pins.outputs.archive_sha256 }}
        run: |
          {
            echo "## Plan: $VERSION"
            echo
            echo "- tag v$VERSION: \`$TAG_SHA\`"
            echo "- fonoster-$VERSION.tar.gz SHA256: \`$ARCHIVE_SHA256\`"
            echo
            echo "The apply prints the playbook's --check --diff on the host before it changes anything."
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCHIVE_SHA256: ${{ needs.plan.outputs.archive_sha256 }}
      TARGET: deploy@${{ vars.DEPLOY_HOST }}
    steps:
      # Nothing reaches the host without every credential.
      - name: Credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::the production environment has no$missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply
        id: apply
        env:
          HOST_ROLE: ${{ inputs.host_role }}
        run: |
          echo "since=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          host=""
          [ "$HOST_ROLE" != true ] || host=host
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$TARGET" sudo bash -s apply "$VERSION" "$ARCHIVE_SHA256" $host \
            < ops/ansible/deploy-on-host.sh

      - name: Roll back
        id: rollback
        if: failure() && steps.apply.outcome == 'failure'
        env:
          SINCE: ${{ steps.apply.outputs.since }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$TARGET" sudo bash -s rollback "$VERSION" "$SINCE" \
            < ops/ansible/deploy-on-host.sh

      # deploys.log's last line is "<switch time> <from> -> <to>" (with "rolled back" after a
      # rollback); the newest backup is the install from before the switch.
      - name: Summary
        if: always() && steps.apply.outcome != 'skipped'
        env:
          TAG_SHA: ${{ needs.plan.outputs.tag_sha }}
          APPLY: ${{ steps.apply.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          state=$(ssh -i ~/.ssh/deploy -o BatchMode=yes "$TARGET" sudo bash -s summary \
            < ops/ansible/deploy-on-host.sh 2>&1 || true)
          {
            echo "## Apply: $VERSION ($APPLY)"
            echo
            echo "- tag v$VERSION: \`$TAG_SHA\`, archive SHA256: \`$ARCHIVE_SHA256\`"
            [ "$ROLLBACK" = skipped ] || echo "- rollback: $ROLLBACK"
            echo
            echo '```'
            echo "$state"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
