name: publish amd

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to use for Docker tags'
        required: false
        type: string
      ref:
        description: 'Commit SHA to check out and build (defaults to the triggering commit if omitted)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to use for Docker tags'
        required: false
        type: string
      ref:
        description: 'Commit SHA to check out and build (defaults to the triggering commit if omitted)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Without this, checkout defaults to github.sha (the commit that
          # triggered the workflow run) rather than the version-bump commit
          # "npm run release" pushes afterward in the calling workflow's
          # build job, so the image would build with the pre-bump
          # package.json versions. See release.yaml's RELEASE_SHA output.
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Get version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "LERNA_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            lerna_version=$(node -p "require('./lerna.json').version")
            echo "LERNA_VERSION=$lerna_version" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Publish AMD to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mods/amd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fonoster/amd:latest
            fonoster/amd:${{ env.LERNA_VERSION }}
