name: PR Checks

# Contribution rules (DCO sign-off, eslint and prettier), then build and test. Each build job runs
# only when its inputs changed (the `changes` job); a change to this file runs them all. The last
# job, "PR Checks passed", is the one required check: it passes when every job passed or was
# skipped. The PR title (the squash commit) is checked by pr-title.yaml.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: KineticCafe/actions-dco@v1
        with:
          exempt-authors: |
            @fonoster.com

  lint:
    name: eslint and prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint (includes format checking)
        run: npm run lint

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.filter.outputs.node }}
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/pr-checks.yaml'
            node:
              - *workflow
              - 'mods/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.mocharc.cjs'
              - 'tools/**'
            go:
              - *workflow
              - 'go/**'
            python:
              - *workflow
              - 'python/**'
              # The Python SDK runs the shared scenario files and takes its case ids from the
              # catalog, so a contract change can't skip it (catalog area VSD).
              - 'mods/conformance/scenarios/**'
              - 'mods/conformance/catalog/areas/**'
            dashboard:
              - *workflow
              - 'mods/dashboard/**'
              - 'mods/sdk/**'
              - 'mods/types/**'
              - 'mods/common/**'
              - 'package-lock.json'
            sdk:
              - *workflow
              - 'mods/common/**'
              - 'mods/types/**'
              - 'mods/sdk/**'
              - 'package.json'
              - 'package-lock.json'

  node:
    name: node build and unit tests
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The database tests (standalone Identity, persistence) make their own throwaway databases
    # on this server, as they do on the dev container's (PERSISTENCE_TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16.10-alpine3.22
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Everything that needs no NATS; the NATS suites are in conformance.yaml.
      - name: Unit tests
        env:
          PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm test

  api:
    name: API area (mods/conformance/catalog/areas/api.md)
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The apiserver runs in the test process; Postgres, NATS and Routr (which stores the SIP
    # resources) are real.
    services:
      postgres:
        image: postgres:16.10-alpine3.22
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      nats:
        image: nats:2.11.8
        ports:
          - 4222:4222
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Routr on the job's Postgres: the image's own-database start runs an unpinned `npx prisma`,
      # which now fetches prisma 8; the external-database path pins prisma@6.12.0.
      - name: Start Routr
        run: |
          docker run -d --name routr --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/routr -e START_INTERNAL_DB=false \
            fonoster/routr-one:2.15.4
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/51907) 2>/dev/null && exit 0; sleep 2; done
          docker logs routr; exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: API cases (JUnit in reports/junit)
        env:
          PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          ROUTR_API_ENDPOINT: 127.0.0.1:51907
          CONFORMANCE_NATS_URL: nats://127.0.0.1:4222
          LOGS_LEVEL: none
        run: |
          npx mocha --config mods/conformance/test/api/.mocharc.cjs \
            --reporter xunit --reporter-option output=reports/junit/api.xml

      - name: JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-api
          path: reports/junit/
          if-no-files-found: ignore

      - name: Routr logs
        if: failure()
        run: docker logs routr

  autopilot:
    name: Autopilot area (mods/conformance/catalog/areas/autopilot.md)
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The pr-tier cases need no services: the runner plays AppBridge and the fakes harness serves
    # the LLM, tools and media in the test process. The nightly cases are in conformance.yaml.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Autopilot cases (JUnit in reports/junit)
        env:
          LOGS_LEVEL: none
        run: |
          npx mocha --exit --timeout 30000 \
            --reporter xunit --reporter-option output=reports/junit/apt.xml \
            mods/autopilot/test/session/conformance.test.ts \
            mods/autopilot/test/session/hosted.test.ts \
            mods/autopilot/test/session/tools.test.ts \
            mods/autopilot/test/session/telemetry.test.ts \
            mods/autopilot/test/session/usage.test.ts

      - name: JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-apt
          path: reports/junit/
          if-no-files-found: ignore

  billing:
    name: Billing area (mods/conformance/catalog/areas/billing.md)
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Metering, the billing service and the Stripe fake: Postgres and NATS (JetStream) are real,
    # Stripe is the fake in the test process. No network, no Stripe account.
    services:
      postgres:
        image: postgres:16.10-alpine3.22
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A step, not a service container: services cannot pass -js, and the usage streams are
      # JetStream.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.11.8 -js -m 8222
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8222/healthz && exit 0; sleep 1; done
          docker logs nats; exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Billing cases (JUnit in reports/junit)
        env:
          PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CONFORMANCE_NATS_URL: nats://127.0.0.1:4222
          LOGS_LEVEL: none
        run: |
          npx mocha --config mods/conformance/test/billing/.mocharc.cjs \
            --reporter xunit --reporter-option output=reports/junit/bil.xml

      # The viewer runs from viewer/dist, built by npm run build above.
      - name: Stripe fake viewer cases (Playwright, JUnit in reports/junit)
        working-directory: mods/stripe-fake
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: ${{ github.workspace }}/reports/junit/bil-viewer.xml
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config viewer/playwright.config.ts --reporter=junit

      - name: JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-bil
          path: reports/junit/
          if-no-files-found: ignore

  go:
    name: go Roomr node
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.11.8
        ports:
          - 4222:4222
    defaults:
      run:
        working-directory: go/roomr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/roomr/go.mod
          cache-dependency-path: go/roomr/go.sum

      # The Opus codec is cgo (internal/audio/opus.go); the shipped image links libopus statically
      # (go/roomr/Dockerfile). Tests run with cgo (the race detector needs it), so Opus is in.
      - name: Install libopus
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev

      # The live-Routr test registers two nodes behind a real Routr (e2e/testdata/routr). ROM-034 is
      # waived (catalog waivers.json, Routr 2.15.4 ignores least-sessions) and skips unless ROM034_LIVE=1.
      - name: Start a throwaway Routr
        run: docker compose -f e2e/testdata/routr/compose.yaml up -d --wait

      - name: gofmt, vet and tests (race detector; e2e against NATS and Routr; JUnit)
        env:
          CONFORMANCE_NATS_URL: nats://127.0.0.1:4222
          ROUTR_EDGEPORT: 127.0.0.1:15360
          ROUTR_NODE_HOST: host.docker.internal
          GOTOOLCHAIN: local
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          # The no-libopus fallback (opus_none.go) still builds.
          CGO_ENABLED=0 go build ./...
          # Packages one at a time: several bind random local ports and collide when run in parallel.
          mkdir -p ../../reports/junit
          go run gotest.tools/gotestsum@v1.13.0 --junitfile ../../reports/junit/roomr-go.xml -- -race -p 1 ./...

      - name: Roomr JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-roomr-go
          path: reports/junit/
          if-no-files-found: ignore

      - name: Routr logs
        if: failure()
        run: docker compose -f e2e/testdata/routr/compose.yaml logs

  python:
    name: python SDK and runner
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install -e fonoster-conformance -e "fonoster-voice[test]"
          python -m pytest fonoster-conformance/tests fonoster-voice/tests

  dashboard:
    name: dashboard typecheck, unit and e2e
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      # The dashboard reads the SDK's and types' dist.
      - name: Install dependencies and build the SDK
        run: |
          npm install --no-audit --no-fund
          npx lerna run build --scope @fonoster/sdk --include-dependencies

      - name: Typecheck and unit tests
        working-directory: mods/dashboard
        run: |
          npm run typecheck
          npm test

      - name: End-to-end tests (Playwright)
        working-directory: mods/dashboard
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e-results
          path: mods/dashboard/test-results/
          if-no-files-found: ignore

  sdk-pack:
    name: pack the SDK
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies and build the SDK
        run: |
          npm install --no-audit --no-fund
          npx lerna run build --scope @fonoster/sdk --include-dependencies

      - name: Pack
        working-directory: mods/sdk
        run: npm pack

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball
          path: mods/sdk/fonoster-sdk-*.tgz

  sdk-install:
    name: install the SDK (node ${{ matrix.node }}, ${{ matrix.pm }})
    needs: sdk-pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        pm: [npm]
        include:
          - node: 22
            pm: yarn
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download the tarball
        uses: actions/download-artifact@v4
        with:
          name: sdk-tarball

      - name: Install it in a new project and load it
        run: |
          tgz="$(ls "$PWD"/fonoster-sdk-*.tgz)"
          mkdir new-project && cd new-project
          if [ "${{ matrix.pm }}" = "yarn" ]; then
            npm install -g yarn
            yarn init -y
            yarn add "$tgz"
          else
            npm init -y
            npm install "$tgz"
          fi
          node -e 'const sdk = require("@fonoster/sdk"); if (!sdk.Client) throw new Error("no Client export");'

  passed:
    name: PR Checks passed
    if: always()
    needs:
      [
        dco,
        lint,
        changes,
        node,
        api,
        autopilot,
        billing,
        go,
        python,
        dashboard,
        sdk-pack,
        sdk-install
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
