name: Stack Smoke

# The deployment target starts (deployment spec: Docker Compose is the official target):
#   compose       build the bundle images and the install archive (ops/release/bundle), install it
#                 the way a self-hoster does and wait for a healthy apiserver and the dashboard
#                 (ops/release/smoke)
#   playbook      put the runner through the Ansible playbook with two local builds: plan, apply,
#                 apply again, switch versions and back, roll back a failed apply
#                 (ops/ansible/test/throwaway.sh --rollback, area OPS)
#   e2e           nightly (and on demand): build the stack from source, seed it and place one real
#                 call through Routr to the hosted Autopilot app with the fake providers; checks the
#                 greeting, one conversation turn, the hang-up and a sealed, verified call record
#                 (ops/rebuild/stack e2e; conformance "End-to-end caller bot")
#   devcontainer  build the dev container's image (when .devcontainer/ changes, and nightly)
#
# On pull requests it runs only when the packaging changes (ops/, a Dockerfile, compose.yaml, the
# root package files); code changes in mods/ and go/ are covered by the nightly run.

on:
  pull_request:
    paths:
      - '.github/workflows/stack-smoke.yaml'
      - 'ops/**'
      - '.devcontainer/**'
      - 'compose.yaml'
      - '**/Dockerfile'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      compose: ${{ steps.filter.outputs.compose }}
      playbook: ${{ steps.filter.outputs.playbook }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            compose:
              - '!ops/rebuild/helm/**'
              - '!ops/ansible/**'
              - '!.devcontainer/**'
            playbook:
              - 'ops/ansible/**'
            devcontainer:
              - '.devcontainer/**'

  compose:
    name: compose install (bundle)
    needs: changes
    if: github.event_name != 'pull_request' || (vars.QA_PAUSED != 'true' && needs.changes.outputs.compose == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: 0.0.0-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      # The bundle exports the config schemas (tsx) and packs @fonoster/common.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The bundle exports the services' config schemas, which import the built @fonoster packages.
      - name: Build the packages
        run: npm run build

      - name: Build the images and the archive
        run: ops/release/bundle "$VERSION"

      - name: Install and start it
        env:
          SMOKE_PORT_BASE: "18000"
          SMOKE_TIMEOUT: "900"
        run: ops/release/smoke "$VERSION"

  e2e:
    name: end-to-end call (nightly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # The fake providers and the caller bot; no regions.
      RB_PROFILES: fakes,tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      # The seed and the check use @fonoster/sdk and @fonoster/callrecord from this checkout.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the packages
        run: npm run build

      - name: Build, seed and call
        env:
          RB_OUT: ${{ runner.temp }}/e2e
        run: ops/rebuild/stack e2e

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  playbook:
    name: playbook (throwaway)
    needs: changes
    if: github.event_name != 'pull_request' || (vars.QA_PAUSED != 'true' && needs.changes.outputs.playbook == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm

      # The bundle exports the config schemas and packs @fonoster/common (as in the compose job).
      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      # The versions ops/ansible/README.md names.
      - name: Install ansible-core and ansible-lint
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet ansible-core==2.21.5 ansible-lint==26.10.1
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"

      - name: Plan, apply, apply again, switch and back, roll back a failed apply
        run: ops/ansible/test/throwaway.sh 0.0.0-a 0.0.0-b --rollback

  devcontainer:
    name: dev container image
    needs: changes
    if: github.event_name != 'pull_request' || (vars.QA_PAUSED != 'true' && needs.changes.outputs.devcontainer == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .devcontainer/Dockerfile
        run: docker build -t fonoster-dev-workspace .devcontainer
