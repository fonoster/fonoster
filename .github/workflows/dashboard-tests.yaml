name: dashboard tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mods/dashboard/**'
      - 'mods/sdk/**'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22.x"

    - name: Install dependencies and build
      run: |
        npm install
        npm run build

    - name: Typecheck and unit tests
      working-directory: mods/dashboard
      run: |
        npm run typecheck
        npm test

    - name: End-to-end tests
      working-directory: mods/dashboard
      run: |
        npx playwright install --with-deps chromium
        npm run test:e2e
